<style>
:root{
  --bg:#f3f4f1; --card:#ffffff; --card2:#f7f8f6; --text:#1a1d1a; --muted:#6b726b; --line:#e2e5e0;

}
@media (prefers-color-scheme: dark){

    --bg:#0f1210; --card:#181c19; --card2:#1f2420; --text:#e8ece8; --muted:#8e978f; --line:#2b312c;

:root[data-theme=dark]{

*{box-sizing:border-box}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.money{font-variant-numeric:tabular-nums}

.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);

.box{background:var(--card2);border-radius:12px;padding:12px;margin:8px 0 14px}
.sheet .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--text)}
.catrow{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;margin-bottom:8px}
.catrow input{text-align:center}
.catrow input+input{text-align:left}
.brow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;width:100%;background:var(--card);text-align:left}

  .hero .big{font-size:2.1em}
  .nav .today{position:static}
  .nav{flex-wrap:wrap}
  .nav .lbl{min-width:140px}

<script>
"use strict";
const APP_VERSION = "20261122a";
const LOCAL = !window.BUDGET_FIREBASE;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Math.random().toString(36).slice(2, 12);
const pad = n => String(n).padStart(2, "0");
const today = () => new Date();
const thisMonth = () => { const d = today(); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const isoDay = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const mi = m => { const [y, mo] = m.split("-").map(Number); return y * 12 + mo - 1; };
const mk = i => Math.floor(i / 12) + "-" + pad(i % 12 + 1);
const daysIn = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo, 0).getDate(); };
const monthName = (m, opt = { month: "long", year: "numeric" }) => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("en-GB", opt); };
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v ?? "").replace(/[\s €$£]/g, "");
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (s.includes(",")) s = /,\d{1,2}$/.test(s) ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  const n = parseFloat(s); return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
const sum = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
const ICON = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.7 10.7 0 0 1 12 20c-7 0-11-8-11-8a19.8 19.8 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a19.9 19.9 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></svg>',

};

/* ---------- defaults & options ---------- */
const ACCENTS = { green: "#15803d", teal: "#0f766e", blue: "#2563eb", purple: "#7c3aed", rose: "#e11d48", orange: "#ea580c", graphite: "#475569" };
const CURRENCIES = ["EUR", "USD", "GBP", "CHF", "SEK", "NOK", "DKK", "PLN", "CZK", "HUF", "RON", "BAM", "RSD", "CAD", "AUD"];
const NUMSTYLES = { dot: ["de-DE", "1.234,56"], comma: ["en-GB", "1,234.56"], space: ["fr-FR", "1 234,56"] };
const REPEATS = { once: ["Just once", 0], monthly: ["Every month", 1], bimonthly: ["Every 2 months", 2], quarterly: ["Every 3 months", 3], half: ["Every 6 months", 6], yearly: ["Every year", 12] };
const PALETTE = ["#16a34a", "#0ea5e9", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316", "#6366f1", "#84cc16", "#06b6d4", "#a855f7", "#64748b", "#d946ef"];
const DEFAULT_CATS = [
  ["in", "💼", "Salary"], ["in", "🏖️", "Pension"], ["in", "🎁", "Gifts & extra"], ["in", "📥", "Other income"],
  ["out", "🏠", "Housing"], ["out", "💡", "Utilities"], ["out", "📱", "Phone & internet"], ["out", "🛡️", "Insurance"],
  ["out", "🚗", "Car & transport"], ["out", "🛒", "Groceries"], ["out", "🍽️", "Eating out"], ["out", "📺", "Subscriptions"],
  ["out", "💊", "Health"], ["out", "🏦", "Loans"], ["out", "🎉", "Fun & hobbies"], ["out", "👕", "Clothes"], ["out", "📦", "Other"],
].map(([kind, emoji, name], i) => ({ id: "c" + i, kind, emoji, name, color: PALETTE[i % PALETTE.length] }));
const TYPES = { income: "Income", bill: "Bill", spend: "Spending" };

/* ---------- demo store (no Firebase): same API as Cloud, kept in this browser ---------- */
function makeLocalStore() {
  const K = "budget.demo.v1";
  let db = null; try { db = JSON.parse(localStorage.getItem(K)); } catch {}
  db = db || { profile: {}, budgets: {}, items: {}, months: {} };
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch {} subs.forEach(f => f()); };
  const on = f => { subs.add(f); setTimeout(f); return () => subs.delete(f); };
  const clone = o => JSON.parse(JSON.stringify(o ?? null));
  const merge = (t, p) => { for (const [k, v] of Object.entries(p)) {
    if (v === null) delete t[k];
    else if (v && typeof v === "object" && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== "object") t[k] = {}; merge(t[k], v); }
    else t[k] = v; } return t; };
  const listOf = o => Object.entries(o || {}).map(([id, x]) => ({ ...clone(x), id }));
  const ok = Promise.resolve();
  return {
    version: APP_VERSION,
    watchProfile: cb => on(() => cb(clone(db.profile))),
    saveProfile: p => { merge(db.profile, p); persist(); return ok; },
    watchBudgets: cb => on(() => cb(listOf(db.budgets), { fromCache: false })),
    createBudget: d => { const id = rid(); db.budgets[id] = { ...d, owner: "local", members: ["local"], createdAt: Date.now() }; persist(); return { id, done: ok }; },
    updateBudget: (b, p) => { merge(db.budgets[b], p); persist(); return ok; },
    replaceBudgetField: (b, f, v) => { db.budgets[b][f] = clone(v); persist(); return ok; },
    deleteBudget: b => { delete db.budgets[b]; delete db.items[b]; delete db.months[b]; persist(); return ok; },
    leaveBudget: () => ok,
    watchBudget: (b, o) => on(() => { const it = db.items[b] || {}; o.entries(listOf(it.entries)); o.months(clone(db.months[b] || {})); o.goals(listOf(it.goals)); }),
    saveItem: (b, c, id, d) => { id = id || rid(); ((db.items[b] ||= {})[c] ||= {})[id] = clone(d); persist(); return { id, done: ok }; },
    deleteItem: (b, c, id) => { if (db.items[b]?.[c]) delete db.items[b][c][id]; persist(); return ok; },
    setMonth: (b, m, p) => { merge((db.months[b] ||= {})[m] ||= {}, p); persist(); return ok; },
  };
}

/* ---------- state ---------- */
let Store = null;
const S = { user: null, profile: {}, budgets: [], bid: null, entries: [], months: {}, goals: [], month: thisMonth(), year: today().getFullYear(),
  view: "month", hide: false, ready: false, loaded: false };
let unsub = [], unsubBudget = null, creatingPersonal = false;
const B = () => S.budgets.find(b => b.id === S.bid);
const look = () => ({ theme: "auto", accent: "green", size: "normal", start: "month", hideOnStart: false, billSort: "due", ...(S.profile.look || {}) });
const cats = () => (B()?.categories?.length ? B().categories : DEFAULT_CATS);
const cat = id => cats().find(c => c.id === id) || { emoji: "📦", name: "Other", color: "#64748b" };
const w = p => { (p && p.catch ? p : Promise.resolve()).catch(e => { console.error(e); toast("Couldn't save: " + (e.code || e.message || e)); }); return p; };
const myName = () => S.profile.name || (S.user?.email || "").split("@")[0] || "Me";
const whoName = uid => uid === S.user?.uid ? "you" : (B()?.memberNames?.[uid] || "someone");

function money(n, opt = {}) {
  const b = B() || {};
  const loc = (NUMSTYLES[b.numStyle] || NUMSTYLES.dot)[0];
  let s;
  try { s = new Intl.NumberFormat(loc, { style: "currency", currency: b.currency || "EUR", minimumFractionDigits: opt.round ? 0 : 2, maximumFractionDigits: opt.round ? 0 : 2 }).format(opt.abs ? Math.abs(n) : n); }
  catch { s = (Math.round(n * 100) / 100).toFixed(2); }
  return opt.raw ? s : `<span class="money">${s}</span>`;
}

/* ---------- budget maths ---------- */
function occurs(e, m) {
  if (!e.start) return false;
  const a = mi(e.start), x = mi(m);
  if (x < a || (e.until && x > mi(e.until))) return false;
  const step = (REPEATS[e.repeat] || REPEATS.once)[1];
  return step ? (x - a) % step === 0 : x === a;
}
function autoPaid(e, m) {
  const cur = thisMonth();
  if (m < cur) return true;
  if (m > cur) return false;
  return today().getDate() >= (e.due || 1);
}
function monthItems(m) {
  const md = S.months[m] || {};
  return S.entries.filter(e => occurs(e, m)).map(e => {
    const over = md.amounts?.[e.id];
    const explicit = md.paid?.[e.id];
    return { ...e, base: num(e.amount), amt: over != null ? num(over) : num(e.amount), changed: over != null,
      skipped: !!md.skip?.[e.id], paid: e.type === "bill" ? (explicit != null ? !!explicit : (e.auto ? autoPaid(e, m) : false)) : true };
  });
}
function goalMoves(m) { const out = []; for (const g of S.goals) for (const d of (g.moves || [])) if ((d.d || "").startsWith(m)) out.push({ ...d, goal: g }); return out; }
function firstMonth() {
  let f = null;
  for (const e of S.entries) if (e.start && (!f || e.start < f)) f = e.start;
  for (const g of S.goals) for (const d of (g.moves || [])) { const m = (d.d || "").slice(0, 7); if (m && (!f || m < f)) f = m; }
  return f;
}
const carryCache = new Map();
function totals(m) {
  const items = monthItems(m).filter(i => !i.skipped);
  const income = sum(items.filter(i => i.type === "income"), i => i.amt);
  const billsAll = items.filter(i => i.type === "bill");
  const bills = sum(billsAll, i => i.amt);
  const unpaidList = billsAll.filter(i => !i.paid);
  const unpaid = sum(unpaidList, i => i.amt);
  const spend = sum(items.filter(i => i.type === "spend"), i => i.amt);
  const saved = sum(goalMoves(m), d => num(d.a));
  const carry = B()?.carry ? carryIn(m) : 0;
  const afterBills = income + carry - bills;
  const left = afterBills - spend - saved;
  return { income, bills, unpaid, unpaidCount: unpaidList.length, billCount: billsAll.length, spend, saved, carry, afterBills, left };
}
function carryIn(m) {
  const key = m + "|" + S.dataStamp;
  if (carryCache.has(key)) return carryCache.get(key);
  const f = firstMonth();
  let c = 0;
  if (f && f < m) {
    const start = Math.max(mi(f), mi(m) - 240);   // never look back more than 20 years
    for (let i = start; i < mi(m); i++) {
      const items = monthItems(mk(i)).filter(x => !x.skipped);
      c += sum(items, x => x.type === "income" ? x.amt : -x.amt) - sum(goalMoves(mk(i)), d => num(d.a));
    }
  }
  carryCache.set(key, c);
  return c;
}

/* ---------- look ---------- */
function applyLook() {
  const l = look(), r = document.documentElement;
  if (l.theme === "auto") delete r.dataset.theme; else r.dataset.theme = l.theme;
  if (l.size === "normal") delete r.dataset.size; else r.dataset.size = l.size;
  const a = ACCENTS[l.accent] || ACCENTS.green;
  r.style.setProperty("--accent", a);
  r.style.setProperty("--accent-soft", a + "22");
  document.querySelector('meta[name=theme-color]').content = a;
  try { localStorage.setItem("budget.look", JSON.stringify({ theme: l.theme, size: l.size })); } catch {}
}

function sharedWith(b) {
  const others = (b.members || []).filter(u => u !== S.user.uid).map(u => b.memberNames?.[u] || "someone");
  return others.length ? others.join(", ") : "nobody yet (add people in Settings)";

function itemRow(i, m) {
  const c = cat(i.category);
  const late = i.type === "bill" && !i.paid && !i.skipped && m === thisMonth() && i.due && i.due < today().getDate();
  const lateOld = i.type === "bill" && !i.paid && !i.skipped && m < thisMonth();
  const meta = [];
  if (i.type === "bill" && i.due) meta.push("due " + ord(i.due));
  if (i.repeat && i.repeat !== "once") meta.push(REPEATS[i.repeat][0].toLowerCase());
  if (i.until) meta.push("until " + monthName(i.until, { month: "short", year: "numeric" }));
  if (i.note) meta.push(i.note);
  if (B()?.kind === "shared" && i.by) meta.push("by " + whoName(i.by));
  const tags = [];
  if (i.skipped) tags.push('<span class="tag">skipped</span>');
  if (i.auto && i.type === "bill") tags.push('<span class="tag acc">auto</span>');
  if (late || lateOld) tags.push('<span class="tag bad">overdue</span>');
  else if (i.type === "bill" && !i.paid && !i.skipped && m === thisMonth() && i.due && i.due - today().getDate() <= 5) tags.push('<span class="tag warn">soon</span>');
  return `<div class="item ${i.skipped ? "skipped" : ""} ${i.type === "bill" && i.paid ? "paid" : ""}" data-act="edit" data-id="${esc(i.id)}">
    ${i.type === "bill" ? `<button class="chk ${i.paid ? "on" : ""} ${late || lateOld ? "late" : ""}" data-act="pay" data-id="${esc(i.id)}" title="${i.paid ? "Paid — tap to undo" : "Mark as paid"}">${ICON.tick}</button>` : ""}
    <div class="emo" style="background:${c.color}22">${esc(c.emoji)}</div>
    <div class="main"><div class="name">${esc(i.name || c.name)}${tags.join("")}</div><div class="meta">${esc(meta.join(" · ") || c.name)}</div></div>
    <div class="amt">${money(i.amt)}${i.changed && !i.skipped ? `<span class="was">${money(i.base)}</span>` : ""}</div>
  </div>`;
}

function renderMonth() {
  const m = S.month, t = totals(m), items = monthItems(m), l = look();
  if (!S.entries.length && !S.goals.length) return `<div class="card welcome">
    <div class="e">👋</div><h2 style="justify-content:center;font-size:1.25em">Let's set up ${esc(B()?.name || "your budget")}</h2>

  const bills = items.filter(i => i.type === "bill").sort(sorters[l.billSort] || sorters.due);
  const spend = items.filter(i => i.type === "spend").sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const moves = goalMoves(m);
  const isNow = m === thisMonth();
  const daysLeft = isNow ? daysIn(m) - today().getDate() + 1 : 0;

  // stacked bar of where the income goes
  const pot = Math.max(t.income + Math.max(0, t.carry), t.bills + t.spend + t.saved, 1);
  const seg = [[t.bills - t.unpaid, "var(--out)", "Bills paid"], [t.unpaid, "color-mix(in srgb,var(--out) 45%,transparent)", "Bills to pay"],
    [t.spend, "#f59e0b", "Spending"], [t.saved, "#8b5cf6", "Savings"], [Math.max(0, t.left), "var(--accent)", "Left"]];

  // alerts (this month only)
  const alerts = [];
  if (isNow) {
    const d = today().getDate();
    const over = bills.filter(i => !i.paid && !i.skipped && i.due && i.due < d);

    if (over.length) alerts.push(`<div class="alert bad">⚠️ <div><b>${over.length} bill${over.length > 1 ? "s" : ""} overdue:</b> ${over.map(i => esc(i.name) + " (" + ord(i.due) + ")").join(", ")}</div></div>`);
    if (soon.length) alerts.push(`<div class="alert">⏰ <div><b>Due soon:</b> ${soon.map(i => esc(i.name) + " " + (i.due === d ? "today" : "on the " + ord(i.due))).join(", ")}</div></div>`);
  }

    <div class="legend">${seg.filter(s => s[0] > 0).map(s => `<span><b style="background:${s[1]}"></b>${s[2]}</span>`).join("")}</div>
    <div class="facts">

      ${isNow ? `<div class="fact"><div class="k">Safe to spend</div><div class="v">${money(Math.max(0, t.left) / daysLeft)}</div><div class="k">per day, ${daysLeft} day${daysLeft > 1 ? "s" : ""} left</div></div>` : ""}

    <h2>${emoji} ${title}<span class="tot">${money(total)}</span></h2>

    </div>

      ${catRows.length ? `<div class="card"><h2>📊 Where it goes</h2>${catRows.map(([id, v]) => { const c = cat(id); return `<div class="hbar"><span class="n">${esc(c.emoji)} ${esc(c.name)}</span><span class="tr"><i style="width:${v / catMax * 100}%;background:${c.color}"></i></span><span class="num">${money(v, { round: true })}</span></div>`; }).join("")}</div>` : ""}
      <div class="card"><h2>📝 Notes for ${esc(monthName(m, { month: "long" }))}</h2><textarea id="note" placeholder="Anything to remember this month…">${esc(md.note || "")}</textarea></div>

}

function renderYear() {
  const y = S.year, ms = Array.from({ length: 12 }, (_, i) => y + "-" + pad(i + 1)), cur = thisMonth();
  const T = ms.map(m => ({ m, ...totals(m) }));
  const inc = sum(T, t => t.income), out = sum(T, t => t.bills + t.spend), saved = sum(T, t => t.saved);
  const past = T.filter(t => t.m <= cur);
  const max = Math.max(...T.map(t => Math.max(t.income, t.bills + t.spend)), 1);
  const W = 720, H = 240, pb = 26, cw = W / 12, bw = cw * .32;
  const bars = T.map((t, i) => {
    const x = i * cw, hi = (t.income / max) * (H - pb - 10), ho = ((t.bills + t.spend) / max) * (H - pb - 10);

    return `<g class="m" data-act="ymonth" data-m="${t.m}"><title>${monthName(t.m)}: in ${money(t.income, { raw: true })}, out ${money(t.bills + t.spend, { raw: true })}, left ${money(t.left, { raw: true })}</title>

      <rect x="${x + cw / 2 - bw - 1}" y="${H - pb - hi}" width="${bw}" height="${Math.max(hi, 0)}" rx="3" fill="var(--accent)"${fut}/>
      <rect x="${x + cw / 2 + 1}" y="${H - pb - ho}" width="${bw}" height="${Math.max(ho, 0)}" rx="3" fill="var(--out)"${fut}/>
      <text x="${x + cw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${t.m === cur ? "var(--text)" : "var(--muted)"}" font-weight="${t.m === cur ? 700 : 400}">${monthName(t.m, { month: "short" })}</text></g>`;
  }).join("");
  const byCat = {};
  for (const m of ms) for (const i of monthItems(m)) if (!i.skipped && i.type !== "income") byCat[i.category] = (byCat[i.category] || 0) + i.amt;
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]), catMax = Math.max(...catRows.map(r => r[1]), 1);
  const best = past.length ? past.reduce((a, b) => b.left > a.left ? b : a) : null;
  const bigBills = {};
  for (const m of ms) for (const i of monthItems(m)) if (!i.skipped && i.type === "bill") { const k = i.id; (bigBills[k] ||= { name: i.name, c: i.category, v: 0 }).v += i.amt; }
  const topBills = Object.values(bigBills).sort((a, b) => b.v - a.v).slice(0, 6);
  return `<div class="grid">
    <div class="card">
      <div class="facts" style="margin-top:0">
        <div class="fact"><div class="k">Income</div><div class="v">${money(inc, { round: true })}</div></div>

        <div class="fact"><div class="k">Left over</div><div class="v ${inc - out - saved < 0 ? "bad" : "good"}">${money(inc - out - saved, { round: true })}</div></div>
        ${saved ? `<div class="fact"><div class="k">Put into savings</div><div class="v">${money(saved, { round: true })}</div></div>` : ""}
        <div class="fact"><div class="k">Average left / month</div><div class="v">${money(past.length ? sum(past, t => t.left) / past.length : 0, { round: true })}</div></div>
      </div>
      <div class="chart" style="margin-top:16px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending per month">${bars}</svg></div>
      <div class="legend" style="justify-content:center"><span><b style="background:var(--accent)"></b>Income</span><span><b style="background:var(--out)"></b>Bills & spending</span><span>Faded = planned months · tap a month to open it</span></div>
      ${best && best.left > 0 ? `<p class="muted small" style="text-align:center;margin:8px 0 0">Best month so far: <b>${monthName(best.m, { month: "long" })}</b> with ${money(best.left, { round: true })} left.</p>` : ""}
    </div>
    <div class="grid two">
      <div class="card"><h2>📊 By category</h2>${catRows.length ? catRows.map(([id, v]) => { const c = cat(id); return `<div class="hbar"><span class="n">${esc(c.emoji)} ${esc(c.name)}</span><span class="tr"><i style="width:${v / catMax * 100}%;background:${c.color}"></i></span><span class="num">${money(v, { round: true })}</span></div>`; }).join("") : '<div class="empty">Nothing yet.</div>'}</div>
      <div class="card"><h2>🧾 Biggest bills this year</h2>${topBills.length ? topBills.map(b => `<div class="hbar"><span class="n">${esc(cat(b.c).emoji)} ${esc(b.name || cat(b.c).name)}</span><span class="tr"><i style="width:${b.v / topBills[0].v * 100}%;background:${cat(b.c).color}"></i></span><span class="num">${money(b.v, { round: true })}</span></div>`).join("") : '<div class="empty">No bills yet.</div>'}</div>
    </div>
  </div>`;
}

function goalSaved(g) { return sum(g.moves || [], d => num(d.a)); }
function renderGoals() {
  const gs = [...S.goals].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const total = sum(gs, goalSaved);
  return `<div class="grid">
    ${gs.length ? `<div class="card hero"><div class="lbl">Saved in total</div><div class="big good">${money(total)}</div><div class="eq">across ${gs.length} goal${gs.length > 1 ? "s" : ""}</div></div>` : ""}
    ${gs.length ? `<div class="grid two" style="align-items:stretch">${gs.map(g => {
      const s = goalSaved(g), tg = num(g.target), pct = tg ? Math.min(100, s / tg * 100) : 0;
      let plan = "";
      if (tg && s < tg && g.by) {
        const months = mi(g.by) - mi(thisMonth()) + 1;
        plan = months > 0 ? `Put aside <b>${money((tg - s) / months)}</b> a month to reach it by ${esc(monthName(g.by, { month: "short", year: "numeric" }))}` : `<span class="bad">Target date has passed</span>`;
      }
      return `<div class="card goal">
        <h2><span class="emo" style="background:${g.color || "#8b5cf6"}22">${esc(g.emoji || "🐷")}</span> ${esc(g.name)}<button class="btn sm" style="margin-left:auto" data-act="goal" data-id="${esc(g.id)}">Edit</button></h2>
        <div class="row"><span><b>${money(s)}</b>${tg ? ` of ${money(tg)}` : ""}</span>${tg ? `<span class="muted">${s >= tg ? "🎉 Reached!" : Math.round(pct) + "%"}</span>` : ""}</div>
        ${tg ? `<div class="bar"><i style="width:${pct}%;background:${g.color || "#8b5cf6"}"></i></div>` : ""}
        ${plan ? `<div class="muted small">${plan}</div>` : ""}
        <div class="addrow"><button class="btn sm pri" data-act="gmove" data-id="${esc(g.id)}" data-dir="1">+ Put money in</button><button class="btn sm" data-act="gmove" data-id="${esc(g.id)}" data-dir="-1">− Take out</button></div>
      </div>`; }).join("")}</div>` : `<div class="card welcome"><div class="e">🐷</div><h2 style="justify-content:center">Saving for something?</h2><p class="muted">A holiday, a new car, an emergency fund… Make a goal, then put money in whenever you can. It shows up in that month's budget too.</p></div>`}
    <div><button class="btn pri" data-act="goal">+ New savings goal</button></div>
  </div>`;
}

/* ---------- sheets ---------- */
function openSheet(html, mount) {
  const sc = $("#scrim");
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  sc.hidden = false; document.body.classList.add("noscroll");
  const sh = sc.firstElementChild;
  mount && mount(sh);
  const f = sh.querySelector("[autofocus]"); if (f && matchMedia("(pointer:fine)").matches) f.focus();
  return sh;
}
function closeSheet() { const sc = $("#scrim"); sc.hidden = true; sc.innerHTML = ""; document.body.classList.remove("noscroll"); }
const head = t => `<h3>${t}<button class="ib x" data-close title="Close">✕</button></h3>`;
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

function catChips(kind, sel) {
  return cats().filter(c => c.kind === kind).map(c => `<button type="button" class="chip ${c.id === sel ? "on" : ""}" data-cat="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("");
}

function openEntry(id, type) {
  const e = id ? S.entries.find(x => x.id === id) : null;
  if (id && !e) return;
  const m = S.month, md = S.months[m] || {};
  const f = e ? { ...e } : { type: type || "bill", name: "", amount: "", repeat: type === "spend" ? "once" : "monthly", start: m, until: "", due: "", auto: false, note: "",
    category: (cats().find(c => c.kind === (type === "income" ? "in" : "out")) || {}).id };
  const repeating = e && e.repeat && e.repeat !== "once";
  const sh = openSheet(`
    ${head(e ? "Edit " + TYPES[e.type].toLowerCase() : "Add")}
    <div class="seg" id="tsel">${Object.entries(TYPES).map(([k, v]) => `<button type="button" data-t="${k}" class="${f.type === k ? "on" : ""}">${v}</button>`).join("")}</div>
    <label class="f"><span>Amount</span><input class="amount" id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(e ? String(e.amount).replace(".", ",") : "")}" autofocus></label>
    <label class="f"><span>Name</span><input type="text" id="fName" maxlength="60" placeholder="e.g. Rent, Electricity, Salary" value="${esc(f.name)}"></label>
    <div class="f"><span>Category</span><div class="chips" id="fCats"></div></div>
    <div class="cols">
      <label class="f"><span>How often</span><select id="fRep">${Object.entries(REPEATS).map(([k, [t]]) => `<option value="${k}" ${f.repeat === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label class="f"><span id="fStartL">Month</span><input type="month" id="fStart" value="${esc(f.start)}"></label>
    </div>
    <div class="cols" id="billRow">
      <label class="f"><span>Due on day</span><input type="number" id="fDue" min="1" max="31" inputmode="numeric" placeholder="e.g. 15" value="${esc(f.due || "")}"></label>
      <label class="f" id="untilF"><span>Last month (optional)</span><input type="month" id="fUntil" value="${esc(f.until || "")}"></label>
    </div>
    <label class="check" id="autoRow"><input type="checkbox" id="fAuto" ${f.auto ? "checked" : ""}> Paid automatically (direct debit) — ticks itself on the due day</label>
    <label class="f"><span>Note (optional)</span><input type="text" id="fNote" maxlength="120" placeholder="e.g. account number, who pays it" value="${esc(f.note || "")}"></label>
    ${repeating ? `<h4>Just for ${esc(monthName(m))}</h4><div class="box">
      <label class="f" style="margin-bottom:8px"><span>Different amount this month only</span><input type="text" id="fOver" inputmode="decimal" placeholder="usual: ${esc(money(num(e.amount), { raw: true }))}" value="${md.amounts?.[e.id] != null ? esc(String(md.amounts[e.id]).replace(".", ",")) : ""}"></label>
      <label class="check" style="margin:0"><input type="checkbox" id="fSkip" ${md.skip?.[e.id] ? "checked" : ""}> Skip it this month</label></div>` : ""}
    <div class="actions"><button class="btn pri" id="save">Save</button></div>
    ${e ? `<div class="actions">${repeating && m > e.start ? `<button class="btn" id="stop">Stop from ${esc(monthName(m, { month: "short" }))} on</button>` : ""}<button class="btn dang" id="del">Delete${repeating ? " from every month" : ""}</button></div>` : ""}
  `, sh => {
    const sync = () => {
      sh.querySelectorAll("#tsel button").forEach(b => b.classList.toggle("on", b.dataset.t === f.type));
      const kind = f.type === "income" ? "in" : "out";
      if (!cats().some(c => c.id === f.category && c.kind === kind)) f.category = (cats().find(c => c.kind === kind) || {}).id;
      sh.querySelector("#fCats").innerHTML = catChips(kind, f.category);
      sh.querySelector("#fDue").closest("label").style.display = f.type === "bill" ? "" : "none";
      sh.querySelector("#autoRow").style.display = f.type === "bill" ? "" : "none";
      const rep = sh.querySelector("#fRep").value !== "once";
      sh.querySelector("#untilF").style.display = rep ? "" : "none";
      sh.querySelector("#billRow").style.display = f.type === "bill" || rep ? "" : "none";
      sh.querySelector("#fStartL").textContent = rep ? "Starting from" : "Month";
    };
    sync();
    sh.querySelector("#tsel").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; f.type = b.dataset.t;
      if (!e) sh.querySelector("#fRep").value = f.type === "spend" ? "once" : "monthly"; sync(); };
    sh.querySelector("#fRep").onchange = sync;
    sh.querySelector("#fCats").onclick = ev => { const b = ev.target.closest("[data-cat]"); if (!b) return; f.category = b.dataset.cat; sync(); };
    sh.querySelector("#save").onclick = () => {
      const amount = num(sh.querySelector("#fAmt").value);
      if (!amount) { toast("Enter an amount"); sh.querySelector("#fAmt").focus(); return; }
      const repeat = sh.querySelector("#fRep").value;
      const start = sh.querySelector("#fStart").value || m;
      let until = repeat === "once" ? null : (sh.querySelector("#fUntil").value || null);
      if (until && until < start) { toast("The last month is before the start"); return; }
      const due = f.type === "bill" ? Math.min(31, Math.max(1, parseInt(sh.querySelector("#fDue").value) || 0)) || null : null;
      const data = { type: f.type, name: sh.querySelector("#fName").value.trim() || cat(f.category).name, amount, category: f.category || null,
        repeat, start, until, due, auto: f.type === "bill" && sh.querySelector("#fAuto").checked, note: sh.querySelector("#fNote").value.trim(),
        by: e?.by || S.user.uid, createdAt: e?.createdAt || Date.now(), updatedAt: Date.now() };
      w(Store.saveItem(S.bid, "entries", e?.id || null, data).done);
      if (repeating) {
        const ov = sh.querySelector("#fOver").value.trim();
        const patch = { amounts: { [e.id]: ov === "" ? null : num(ov) }, skip: { [e.id]: sh.querySelector("#fSkip").checked ? true : null } };
        w(Store.setMonth(S.bid, m, patch));
      }
      closeSheet();
      toast(e ? "Saved" : (data.repeat !== "once" ? `Added — repeats ${REPEATS[data.repeat][0].toLowerCase()}` : "Added"));
      if (!e && !occurs(data, S.month)) toast("Added to " + monthName(start));
    };
    const st = sh.querySelector("#stop");
    if (st) st.onclick = () => { if (!confirm(`Stop "${e.name}" from ${monthName(m)} on? Earlier months stay as they are.`)) return;
      w(Store.saveItem(S.bid, "entries", e.id, { ...strip(e), until: mk(mi(m) - 1), updatedAt: Date.now() }).done); closeSheet(); toast("Stopped"); };
    const dl = sh.querySelector("#del");
    if (dl) dl.onclick = () => { if (!confirm(repeating ? `Delete "${e.name}" from every month, including past ones?\n\nTip: use "Stop from … on" to keep the history.` : `Delete "${e.name}"?`)) return;
      w(Store.deleteItem(S.bid, "entries", e.id)); closeSheet(); toast("Deleted"); };
  });
}
const strip = o => { const { id, ...r } = o; return r; };

function openGoal(id) {
  const g = id ? S.goals.find(x => x.id === id) : null;
  let color = g?.color || "#8b5cf6";
  openSheet(`${head(g ? "Edit goal" : "New savings goal")}
    <div class="cols" style="grid-template-columns:70px 1fr">
      <label class="f"><span>Icon</span><input type="text" id="gE" maxlength="4" value="${esc(g?.emoji || "🐷")}" style="text-align:center"></label>
      <label class="f"><span>What for?</span><input type="text" id="gN" maxlength="50" placeholder="e.g. Summer holiday" value="${esc(g?.name || "")}" autofocus></label>
    </div>
    <div class="cols">
      <label class="f"><span>Target amount (optional)</span><input type="text" id="gT" inputmode="decimal" placeholder="0,00" value="${g?.target ? esc(String(g.target).replace(".", ",")) : ""}"></label>
      <label class="f"><span>Reach it by (optional)</span><input type="month" id="gB" value="${esc(g?.by || "")}"></label>
    </div>
    <div class="f"><span>Colour</span><div class="swatches" id="gC">${PALETTE.slice(0, 10).map(c => `<button type="button" class="sw ${c === color ? "on" : ""}" style="background:${c}" data-c="${c}"></button>`).join("")}</div></div>
    ${g && (g.moves || []).length ? `<h4>History</h4><div class="list">${[...g.moves].sort((a, b) => b.d.localeCompare(a.d)).map((d, i) => `<div class="item" style="cursor:default"><div class="main"><div class="name">${num(d.a) >= 0 ? "Put in" : "Took out"}</div><div class="meta">${esc(new Date(d.d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }))}${d.by && B()?.kind === "shared" ? " · " + esc(whoName(d.by)) : ""}</div></div><div class="amt ${num(d.a) < 0 ? "bad" : ""}">${money(num(d.a))}</div><button class="ib" data-rm="${esc(d.k)}" title="Remove">✕</button></div>`).join("")}</div>` : ""}
    <div class="actions"><button class="btn pri" id="gS">Save</button></div>
    ${g ? `<div class="actions"><button class="btn dang" id="gD">Delete goal</button></div>` : ""}`, sh => {
    sh.querySelector("#gC").onclick = ev => { const b = ev.target.closest("[data-c]"); if (!b) return; color = b.dataset.c; sh.querySelectorAll(".sw").forEach(s => s.classList.toggle("on", s === b)); };
    sh.querySelector("#gS").onclick = () => {
      const name = sh.querySelector("#gN").value.trim(); if (!name) { toast("Give the goal a name"); return; }
      w(Store.saveItem(S.bid, "goals", g?.id || null, { name, emoji: sh.querySelector("#gE").value.trim() || "🐷", target: num(sh.querySelector("#gT").value) || null,
        by: sh.querySelector("#gB").value || null, color, moves: g?.moves || [], createdAt: g?.createdAt || Date.now() }).done);
      closeSheet(); toast("Saved");
    };
    sh.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { if (!confirm("Remove this entry?")) return;
      w(Store.saveItem(S.bid, "goals", g.id, { ...strip(g), moves: g.moves.filter(d => d.k !== b.dataset.rm) }).done); closeSheet(); toast("Removed"); });
    const d = sh.querySelector("#gD");
    if (d) d.onclick = () => { if (!confirm(`Delete the goal "${g.name}" and its history?`)) return; w(Store.deleteItem(S.bid, "goals", g.id)); closeSheet(); toast("Deleted"); };
  });
}
function openMove(id, dir) {
  const g = S.goals.find(x => x.id === id); if (!g) return;
  openSheet(`${head((dir > 0 ? "Put money into " : "Take money out of ") + esc(g.name))}
    <label class="f"><span>Amount</span><input class="amount" id="mA" inputmode="decimal" placeholder="0,00" autofocus></label>
    <label class="f"><span>Date</span><input type="date" id="mD" value="${isoDay(today())}"></label>
    <p class="muted small">${dir > 0 ? "This counts as money set aside in that month's budget." : "This adds the money back to that month's budget."}</p>
    <div class="actions"><button class="btn pri" id="mS">${dir > 0 ? "Put in" : "Take out"}</button></div>`, sh => {
    sh.querySelector("#mS").onclick = () => {
      const a = num(sh.querySelector("#mA").value); if (!a) { toast("Enter an amount"); return; }
      const d = sh.querySelector("#mD").value || isoDay(today());
      w(Store.saveItem(S.bid, "goals", g.id, { ...strip(g), moves: [...(g.moves || []), { k: rid(), d, a: dir * Math.abs(a), by: S.user.uid }] }).done);
      closeSheet(); toast(dir > 0 ? "Saved 🎉" : "Taken out");
    };
  });
}

function openBudgets() {
  const list = [...S.budgets].sort((a, b) => (a.kind === "personal" ? 0 : 1) - (b.kind === "personal" ? 0 : 1) || (a.createdAt || 0) - (b.createdAt || 0));
  openSheet(`${head("Your budgets")}
    ${list.map(b => `<button class="brow ${b.id === S.bid ? "on" : ""}" data-pick="${esc(b.id)}"><span class="emo" style="background:var(--card2)">${esc(b.emoji || "💰")}</span>
      <span class="main"><b>${esc(b.name)}</b><br><span class="muted small">${b.kind === "personal" ? "🔒 Private — only you" : "👥 Shared with " + esc(sharedWith(b))}</span></span></button>`).join("")}
    <div class="actions"><button class="btn" id="nb">+ New shared budget</button></div>
    <p class="muted small">A shared budget is for things you plan together (e.g. the household). You add people from its Settings using their sharing code.</p>`, sh => {
    sh.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { selectBudget(b.dataset.pick); closeSheet(); });
    sh.querySelector("#nb").onclick = () => {
      const name = prompt("Name for the shared budget:", "Household"); if (!name) return;
      const r = Store.createBudget({ name: name.trim().slice(0, 40), emoji: "🏡", kind: "shared", currency: B()?.currency || "EUR", numStyle: B()?.numStyle || "dot",
        categories: DEFAULT_CATS, memberNames: { [S.user.uid]: myName() } });
      w(r.done); closeSheet(); selectBudget(r.id); toast("Shared budget created — add people in Settings");

  });
}

function openSettings() {
  const b = B(), l = look(), owner = b?.owner === S.user.uid;
  const opt = (o, v) => Object.entries(o).map(([k, t]) => `<option value="${k}" ${k === v ? "selected" : ""}>${t}</option>`).join("");
  openSheet(`${head("Settings")}
    <h4>Your look <span style="text-transform:none;letter-spacing:0;font-weight:400">— only on your login</span></h4>
    <div class="f"><span>Theme</span><div class="seg" id="sTheme" style="margin:0">${[["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]].map(([k, t]) => `<button type="button" data-v="${k}" class="${l.theme === k ? "on" : ""}">${t}</button>`).join("")}</div></div>
    <div class="f"><span>Colour</span><div class="swatches" id="sAcc">${Object.entries(ACCENTS).map(([k, c]) => `<button type="button" class="sw ${l.accent === k ? "on" : ""}" title="${k}" style="background:${c}" data-v="${k}"></button>`).join("")}</div></div>

    <div class="cols">

      <label class="f"><span>Order bills by</span><select id="sSort">${opt({ due: "Due date", unpaid: "Unpaid first", amount: "Amount", name: "Name" }, l.billSort)}</select></label>

    <label class="check"><input type="checkbox" id="sHide" ${l.hideOnStart ? "checked" : ""}> Hide amounts when the app opens (tap 👁 to show)</label>

    ${b ? `<h4>This budget</h4>
    <div class="cols" style="grid-template-columns:70px 1fr">
      <label class="f"><span>Icon</span><input type="text" id="bE" maxlength="4" value="${esc(b.emoji || "💰")}" style="text-align:center"></label>

      <label class="f"><span>Number style</span><select id="bNum">${opt(Object.fromEntries(Object.entries(NUMSTYLES).map(([k, v]) => [k, v[1]])), b.numStyle || "dot")}</select></label>
    </div>
    <label class="check"><input type="checkbox" id="bCarry" ${b.carry ? "checked" : ""}> Carry what's left over into the next month</label>
    <div class="actions" style="margin-top:0"><button class="btn" id="bSave">Save budget settings</button><button class="btn" id="bCats">Edit categories</button></div>

    ${b.kind === "shared" ? `<h4>People</h4>
      <div class="list">${(b.members || []).map(u => `<div class="item" style="cursor:default"><div class="emo" style="background:var(--card2)">👤</div><div class="main"><div class="name">${esc(b.memberNames?.[u] || "someone")}${u === S.user.uid ? " (you)" : ""}${u === b.owner ? '<span class="tag acc">owner</span>' : ""}</div></div>${owner && u !== S.user.uid ? `<button class="btn sm dang" data-kick="${esc(u)}">Remove</button>` : ""}</div>`).join("")}</div>
      ${owner ? `<div class="box"><label class="f"><span>Add a person — paste their sharing code</span><input type="text" id="pC" placeholder="their code from Settings → Your account" autocomplete="off"></label>
        <label class="f"><span>Their name</span><input type="text" id="pN" maxlength="30" placeholder="e.g. Mum"></label><button class="btn" id="pAdd">Add person</button></div>` : ""}
      <div class="actions">${owner ? `<button class="btn dang" id="bDel">Delete this budget</button>` : `<button class="btn dang" id="bLeave">Leave this budget</button>`}</div>` : ""}` : ""}

    <h4>Your account</h4>
    <label class="f"><span>Your name (shown to people you share with)</span><input type="text" id="aN" maxlength="30" value="${esc(myName())}"></label>
    ${LOCAL ? `<p class="muted small">Demo mode: there is no login. Everything is stored only in this browser.</p>` : `
      <div class="f"><span>Your sharing code — give it to someone so they can add you to a shared budget</span><code class="code">${esc(S.user.uid)}</code></div>
      <p class="muted small">Signed in as ${esc(S.user.email)}</p>`}
    <div class="actions" style="margin-top:0"><button class="btn" id="aSave">Save name</button><button class="btn" id="aCopy" ${LOCAL ? "hidden" : ""}>Copy code</button>${LOCAL ? "" : `<button class="btn dang" id="aOut">Sign out</button>`}</div>

        closeSheet(); toast((name || "They") + " can now open this budget");

      if (del) del.onclick = async () => {
        if (prompt(`This deletes "${b.name}" and everything in it for everyone. Type DELETE to confirm.`) !== "DELETE") return;

        try { await Store.deleteBudget(b.id); toast("Budget deleted"); } catch (e) { toast("Couldn't delete: " + (e.code || e)); }

      const lv = sh.querySelector("#bLeave");
      if (lv) lv.onclick = () => { if (!confirm(`Leave "${b.name}"? You'll need to be added again to see it.`)) return;
        const p = S.budgets.find(x => x.kind === "personal" && x.owner === S.user.uid); w(Store.leaveBudget(b.id)); closeSheet(); if (p) selectBudget(p.id); toast("You left the budget"); };
    }
    sh.querySelector("#aSave").onclick = () => {
      const n = sh.querySelector("#aN").value.trim(); if (!n) return;
      S.profile.name = n; w(Store.saveProfile({ name: n }));
      for (const x of S.budgets) if (x.memberNames?.[S.user.uid] !== n) w(Store.updateBudget(x.id, { memberNames: { [S.user.uid]: n } }));
      toast("Name saved");
    };
    sh.querySelector("#aCopy").onclick = () => navigator.clipboard.writeText(S.user.uid).then(() => toast("Code copied"), () => toast("Couldn't copy — select it by hand"));
    const out = sh.querySelector("#aOut"); if (out) out.onclick = () => { closeSheet(); signOut(); };
    sh.querySelector("#xJ").onclick = exportJSON;
    sh.querySelector("#xC").onclick = exportCSV;
    sh.querySelector("#xI").onclick = () => sh.querySelector("#xF").click();
    sh.querySelector("#xF").onchange = importJSON;
  });
}

function openCats() {
  const b = B(); let list = JSON.parse(JSON.stringify(cats()));
  const draw = sh => {
    const part = kind => list.map((c, i) => c.kind !== kind ? "" : `<div class="catrow"><input class="inp" data-i="${i}" data-k="emoji" maxlength="4" value="${esc(c.emoji)}"><input class="inp" data-i="${i}" data-k="name" maxlength="30" value="${esc(c.name)}"><button class="ib" data-del="${i}" title="Remove">✕</button></div>`).join("");
    sh.querySelector("#cl").innerHTML = `<h4 style="margin-top:0">Money in</h4>${part("in")}<button class="btn sm" data-addk="in">+ Add</button><h4>Money out</h4>${part("out")}<button class="btn sm" data-addk="out">+ Add</button>`;
  };
  openSheet(`${head("Categories")}<p class="muted small" style="margin-top:-6px">Tap an icon to change it (any emoji works). Changes apply to “${esc(b.name)}”.</p><div id="cl"></div>
    <div class="actions"><button class="btn pri" id="cS">Save categories</button><button class="btn" id="cR">Reset to defaults</button></div>`, sh => {
    draw(sh);
    sh.querySelector("#cl").addEventListener("input", ev => { const t = ev.target; if (t.dataset.i != null) list[t.dataset.i][t.dataset.k] = t.value; });
    sh.querySelector("#cl").addEventListener("click", ev => {
      const d = ev.target.closest("[data-del]"), a = ev.target.closest("[data-addk]");
      if (d) { const c = list[d.dataset.del]; const used = S.entries.filter(e => e.category === c.id).length;
        if (used && !confirm(`${used} item${used > 1 ? "s use" : " uses"} “${c.name}”. They'll show as “Other”. Remove it?`)) return; list.splice(d.dataset.del, 1); draw(sh); }
      if (a) { list.push({ id: "c" + rid(), kind: a.dataset.addk, emoji: "🏷️", name: "", color: PALETTE[list.length % PALETTE.length] }); draw(sh); sh.querySelector(`#cl [data-i="${list.length - 1}"][data-k=name]`).focus(); }
    });
    sh.querySelector("#cS").onclick = () => { list = list.filter(c => c.name.trim()).map(c => ({ ...c, name: c.name.trim(), emoji: c.emoji.trim() || "🏷️" }));
      w(Store.replaceBudgetField(b.id, "categories", list)); closeSheet(); toast("Categories saved"); };
    sh.querySelector("#cR").onclick = () => { if (confirm("Put back the original categories?")) { list = JSON.parse(JSON.stringify(DEFAULT_CATS)); draw(sh); } };
  });
}

/* ---------- backup ---------- */
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileSafe = s => String(s).replace(/[^\w-]+/g, "-").replace(/^-|-$/g, "") || "budget";
function exportJSON() {
  const b = B();
  const data = { app: "budget", format: 1, exported: new Date().toISOString(), budget: { name: b.name, emoji: b.emoji, currency: b.currency, numStyle: b.numStyle, carry: !!b.carry, categories: cats() },
    entries: S.entries, months: S.months, goals: S.goals };
  download(`budget-${fileSafe(b.name)}-${isoDay(today())}.json`, JSON.stringify(data, null, 2), "application/json");
  toast("Backup downloaded — keep it somewhere safe");
}
function exportCSV() {
  const rows = [["Month", "Type", "Name", "Category", "Amount", "Paid", "Note"]];
  const q = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  for (let i = 1; i <= 12; i++) { const m = S.year + "-" + pad(i);
    for (const it of monthItems(m)) if (!it.skipped) rows.push([m, TYPES[it.type], it.name, cat(it.category).name, it.amt.toFixed(2).replace(".", ","), it.type === "bill" ? (it.paid ? "yes" : "no") : "", it.note || ""]);
    for (const d of goalMoves(m)) rows.push([m, "Savings", d.goal.name, "", num(d.a).toFixed(2).replace(".", ","), "", ""]); }
  download(`budget-${fileSafe(B().name)}-${S.year}.csv`, "﻿" + rows.map(r => r.map(q).join(";")).join("\r\n"), "text/csv");
}
async function importJSON(ev) {
  const file = ev.target.files[0]; ev.target.value = ""; if (!file) return;
  let d; try { d = JSON.parse(await file.text()); } catch { toast("That file isn't a budget backup"); return; }
  if (d.app !== "budget" || !Array.isArray(d.entries)) { toast("That file isn't a budget backup"); return; }
  if (!confirm(`Restore ${d.entries.length} items and ${(d.goals || []).length} goals from "${d.budget?.name || "backup"}" into "${B().name}"?\n\nItems with the same id are replaced; nothing else is deleted.`)) return;
  for (const e of d.entries) if (e && e.id && e.start) w(Store.saveItem(S.bid, "entries", String(e.id), strip(e)).done);
  for (const g of d.goals || []) if (g && g.id) w(Store.saveItem(S.bid, "goals", String(g.id), strip(g)).done);
  for (const [m, md] of Object.entries(d.months || {})) if (/^\d{4}-\d{2}$/.test(m) && md) w(Store.setMonth(S.bid, m, md));
  if (d.budget?.categories?.length) w(Store.replaceBudgetField(S.bid, "categories", d.budget.categories));
  closeSheet(); toast("Backup restored");
}

/* ---------- data flow ---------- */
function selectBudget(id) {
  if (S.bid === id && unsubBudget) return;
  unsubBudget && unsubBudget();
  S.bid = id; S.entries = []; S.months = {}; S.goals = []; S.loaded = false; S.dataStamp = 0; carryCache.clear();
  try { localStorage.setItem("budget.last." + S.user.uid, id); } catch {}
  let got = 0;
  const mark = () => { S.dataStamp++; carryCache.clear(); if (++got >= 3) S.loaded = true; render(); };
  unsubBudget = Store.watchBudget(id, {
    entries: l => { S.entries = l; mark(); },
    months: o => { S.months = o; mark(); },
    goals: l => { S.goals = l; mark(); },
  }, err);
  render();
}
function err(e) { console.error(e); if (e && e.code === "permission-denied") toast("No access to this budget"); else toast("Sync problem: " + (e.code || e.message || e)); }

function start(user) {
  S.user = user; S.ready = true; S.loaded = false;
  let firstProfile = true;
  unsub.push(Store.watchProfile(p => {
    S.profile = p || {};
    if (firstProfile) { firstProfile = false; S.view = look().start; S.hide = !!look().hideOnStart; }
    applyLook(); render();
  }, err));
  unsub.push(Store.watchBudgets((list, meta) => {
    S.budgets = list;
    const mine = list.find(b => b.kind === "personal" && b.owner === user.uid);
    if (!mine && !meta?.fromCache && !creatingPersonal) {
      creatingPersonal = true;
      const r = Store.createBudget({ name: "My budget", emoji: "💰", kind: "personal", currency: "EUR", numStyle: "dot", categories: DEFAULT_CATS, memberNames: { [user.uid]: myName() } });
      w(r.done);
      selectBudget(r.id);
      return;
    }
    if (!S.bid || !list.some(b => b.id === S.bid)) {
      let last = null; try { last = localStorage.getItem("budget.last." + user.uid); } catch {}
      const pick = list.find(b => b.id === last) || mine || list[0];
      if (pick) selectBudget(pick.id);
    }
    render();
  }, err));
}
function signOut() {
  unsub.forEach(f => f()); unsub = []; unsubBudget && unsubBudget(); unsubBudget = null;
  Object.assign(S, { user: null, profile: {}, budgets: [], bid: null, entries: [], months: {}, goals: [], ready: false, loaded: false });
  creatingPersonal = false;
  window.Cloud.signOut();
}

/* ---------- login ---------- */
function showLogin(msg) {
  S.ready = false;
  $("#app").innerHTML = `<div class="login">
    <img class="logo" src="icons/icon.svg" alt="">
    <h1 style="margin:0 0 4px">Budget</h1>
    <p class="muted" style="margin:0 0 20px">Private budgeting. Sign in with the login you were given.</p>
    <form id="lf">
      <label class="f"><span>Email</span><input type="email" id="le" autocomplete="username" required></label>
      <label class="f"><span>Password</span><input type="password" id="lp" autocomplete="current-password" required></label>
      <div class="err" id="lerr">${esc(msg || "")}</div>
      <button class="btn pri wide" id="lb">Sign in</button>
    </form>
    <p style="text-align:center"><button class="btn sm" id="lr" style="border:none;background:none;color:var(--muted)">Forgot password?</button></p>
  </div>`;
  $("#lf").onsubmit = async ev => {
    ev.preventDefault(); $("#lb").disabled = true; $("#lerr").textContent = "";
    try { await window.Cloud.signIn($("#le").value.trim(), $("#lp").value); }
    catch (e) { $("#lerr").textContent = /invalid|wrong|not-found|credential/.test(e.code || "") ? "Wrong email or password." : /too-many/.test(e.code || "") ? "Too many tries — wait a few minutes." : /network/.test(e.code || "") ? "No internet connection." : "Couldn't sign in (" + (e.code || e) + ")"; $("#lb").disabled = false; }
  };
  $("#lr").onclick = async () => {
    const em = $("#le").value.trim(); if (!em) { $("#lerr").textContent = "Type your email first."; return; }
    try { await window.Cloud.resetPassword(em); $("#lerr").textContent = "If that email has a login, a reset link is on its way."; } catch { $("#lerr").textContent = "If that email has a login, a reset link is on its way."; }
  };
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  if (ev.target.closest("[data-close]")) { closeSheet(); return; }
  if (ev.target.id === "scrim") { closeSheet(); return; }
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "pay") {
    ev.stopPropagation();
    const it = monthItems(S.month).find(i => i.id === t.dataset.id); if (!it) return;
    w(Store.setMonth(S.bid, S.month, { paid: { [it.id]: !it.paid } }));
    if (!it.paid) toast(`${it.name} paid ✓`);
    return;
  }
  ({
    tab: () => { S.view = t.dataset.v; if (S.view === "year") S.year = +S.month.slice(0, 4); render(); window.scrollTo(0, 0); },
    prev: () => { if (S.view === "year") S.year--; else S.month = mk(mi(S.month) - 1); render(); },
    next: () => { if (S.view === "year") S.year++; else S.month = mk(mi(S.month) + 1); render(); },
    now: () => { S.month = thisMonth(); S.year = today().getFullYear(); render(); },
    ymonth: () => { S.month = t.dataset.m; S.view = "month"; render(); window.scrollTo(0, 0); },
    add: () => openEntry(null, t.dataset.type),
    edit: () => openEntry(t.dataset.id),
    hide: () => { S.hide = !S.hide; render(); },
    settings: openSettings,
    budgets: openBudgets,
    goal: () => openGoal(t.dataset.id),
    gmove: () => openMove(t.dataset.id, +t.dataset.dir),
    sort: () => { const order = ["due", "unpaid", "amount", "name"]; const n = order[(order.indexOf(look().billSort) + 1) % order.length];
      S.profile.look = { ...look(), billSort: n }; render(); w(Store.saveProfile({ look: { billSort: n } })); },
  })[a]?.();
});
let noteT;
document.addEventListener("input", ev => {
  if (ev.target.id !== "note") return;
  const v = ev.target.value, m = S.month, bid = S.bid;
  clearTimeout(noteT); noteT = setTimeout(() => w(Store.setMonth(bid, m, { note: v || null })), 600);
});
// don't let a re-render wipe the note while typing: keep focus by re-rendering only when not typing
const _render = render;
render = function () { const a = document.activeElement; if (a && a.id === "note" && S.view === "month") return; _render(); };
document.addEventListener("focusout", ev => { if (ev.target.id === "note") setTimeout(_render, 0); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#scrim").hidden) closeSheet();
  if (ev.key === "Enter" && !$("#scrim").hidden && ev.target.matches(".sheet input:not([type=checkbox])")) { const s = $("#scrim").querySelector(".actions .btn.pri"); if (s) { ev.preventDefault(); s.click(); } }
});
// month rolls over at midnight while the app is open
setInterval(() => { if (S.ready) _render(); }, 60 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.ready && !document.activeElement?.matches("#note")) _render(); });

/* ---------- boot ---------- */
if (LOCAL) { Store = makeLocalStore(); start({ uid: "local", email: "" }); }
else {
  $("#app").innerHTML = `<div class="login muted">Loading…</div>`;
  window.addEventListener("cloud-auth", e => {
    if (e.detail) { if (S.user?.uid === e.detail.uid) return; Store = window.Cloud; start(e.detail); }
    else { if (S.ready) signOut(); showLogin(); }
  });
  window.addEventListener("cloud-failed", () => { $("#app").innerHTML = `<div class="login"><h2>Can't reach the budget server</h2><p class="muted">Check the internet connection and try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>`; });
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
