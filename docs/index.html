<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5b5fd6">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="config.js?v=20261123c" as="script">
<link rel="preload" href="calculations.js?v=20261123c" as="script">
<script type="module" src="cloud.js?v=20261123c"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the font loads without holding up the first paint -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!-- start fetching Firebase right away, in parallel with the page -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<script>
// apply the saved look before anything paints (no flash of the wrong theme)
try { const l = JSON.parse(localStorage.getItem("budget.look") || "{}");
  if (l.theme && l.theme !== "auto") document.documentElement.dataset.theme = l.theme;
  if (l.size) document.documentElement.dataset.size = l.size;
  if (l.accentHex) document.documentElement.style.setProperty("--accent", l.accentHex); } catch {}
</script>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --card2:#f5f6fa; --text:#1b1d29; --muted:#62677b; --line:#e8eaf1;
  --accent:#5b5fd6; --accent-soft:color-mix(in srgb,var(--accent) 13%,transparent); --on-accent:#fff;
  --head1:var(--accent); --head2:color-mix(in srgb,var(--accent) 55%,#a5f3fc);
  --good:#16a34a; --bad:#e2574c; --warn:#d97706; --out:#f08a6c; --spend:#f6b84a; --save:#a78bfa;
  --shadow:0 1px 2px #1b1d290a, 0 6px 20px #1b1d290d;
  --r:18px; --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#0e1016; --card:#171a23; --card2:#1f2330; --text:#eceef5; --muted:#a3a8bb; --line:#272b38;
    --head1:color-mix(in srgb,var(--accent) 70%,#0e1016); --head2:color-mix(in srgb,var(--accent) 35%,#0e1016);
    --good:#4ade80; --bad:#fb7185; --warn:#fbbf24; --shadow:none;
  }
}
:root[data-theme=dark]{
  --bg:#0e1016; --card:#171a23; --card2:#1f2330; --text:#eceef5; --muted:#a3a8bb; --line:#272b38;
  --head1:color-mix(in srgb,var(--accent) 70%,#0e1016); --head2:color-mix(in srgb,var(--accent) 35%,#0e1016);
  --good:#4ade80; --bad:#fb7185; --warn:#fbbf24; --shadow:none;
}
:root[data-size=large]{--fs:17px} :root[data-size=xl]{--fs:19px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:500 var(--fs)/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(30px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.money small{font-size:.72em;font-weight:inherit;opacity:.85}
body.hide .money{filter:blur(.42em);user-select:none}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:.9em}

/* ---------- coloured header ---------- */
.head{background:linear-gradient(150deg,var(--head1),var(--head2));color:#fff;padding-top:env(safe-area-inset-top)}
.head.tall{padding-bottom:16px}
.head.short{padding-bottom:20px}
.topin{display:flex;align-items:center;gap:8px;padding:14px 0 6px}
.bsel{display:flex;align-items:center;gap:10px;border:none;background:none;color:#fff;padding:4px 8px 4px 4px;margin-left:-4px;border-radius:14px;min-width:0;text-align:left}
.bsel:hover{background:#ffffff1f}
.bsel .av{width:38px;height:38px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-size:1.2em;flex:none}
.bsel .t{display:block;font-weight:800;font-size:1.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsel .s{display:block;font-size:.78em;opacity:.85;font-weight:600}
.sp{flex:1}
.gb{border:none;background:#ffffff2b;color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;padding:0;flex:none}
.gb:hover{background:#ffffff45}
.gb svg{width:20px;height:20px}
.tabs{display:flex;gap:6px;margin:10px 0 0}
.tab{border:none;background:#ffffff26;color:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:.92em}
.tab.on{background:#fff;color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 0}
.nav .lbl{font-weight:800;font-size:1.05em;min-width:160px;text-align:center}
.nav .gb{width:34px;height:34px;font-size:1.1em}
.pill{border:none;background:#ffffff2b;color:#fff;border-radius:999px;padding:5px 12px;font-size:.82em;font-weight:700}
.pill:hover{background:#ffffff45}
main.wrap{margin-top:18px;position:relative}
.head.short + main.wrap{margin-top:18px}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media (min-width:880px){ .grid.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start} }
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{padding:4px 16px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 8px;font-size:.74em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec .lk{border:none;background:none;color:var(--accent);font-weight:700;font-size:1.25em;letter-spacing:0;text-transform:none;padding:2px 4px}
.sec .lk+.lk{margin-left:6px}
.total{position:relative}
.total .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
.total .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.total .lbl{font-weight:700}
.total .big{font-size:2.1em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.total .eq{color:var(--muted);font-size:.86em;margin-top:2px}
.brk{margin-top:10px}
.brk .r{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.brk .r:first-child{border-top:none}
.brk .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.05em;flex:none}
.brk .n{flex:1;font-weight:600}
.brk .v{font-weight:800}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--card2);margin:12px 0 2px;gap:2px}
.stack i{display:block;height:100%;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:.78em;color:var(--muted);font-weight:700}
.tile .v{font-weight:800;font-size:1.12em;margin-top:2px}
.tile .s{font-size:.76em;color:var(--muted)}
@media (max-width:520px){ .tiles{grid-template-columns:1fr 1fr} .tiles .tile:nth-child(3){grid-column:1/-1} }
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:center}
.ring svg{width:74px;height:74px;display:block;margin:0 auto 8px}
.ring .k{font-size:.8em;color:var(--muted);font-weight:700}
.ring .v{font-weight:800;font-size:1.2em}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:.74em;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);margin-top:4px}
.chip.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:none}
.item:hover .name{color:var(--accent)}
.emo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.15em;flex:none}
.item .main{flex:1;min-width:0}
.item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;white-space:nowrap;text-align:right}
.item .amt .sub{display:block;font-weight:600;font-size:.74em;color:var(--muted)}
.item .amt .was{display:block;font-weight:500;font-size:.74em;color:var(--muted);text-decoration:line-through}
.item.skipped{opacity:.5} .item.skipped .amt{text-decoration:line-through}
.item.paid .name{color:var(--muted)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;color:#fff}
.chk svg{width:15px;height:15px;opacity:0}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on svg{opacity:1}
.chk.late{border-color:var(--bad)}
.tag{display:inline-block;font-size:.7em;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--card2);color:var(--muted);margin-left:5px;vertical-align:1px}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:12px 0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--warn) 12%,var(--card));font-size:.92em}
.alert.bad{background:color-mix(in srgb,var(--bad) 11%,var(--card))}
/* limits */
.lim{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.lim:first-child{border-top:none}
.lim .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lim .nm{font-weight:800}
.lim .lft{font-weight:800;text-align:right}
.lim .lft .sub{display:block;font-size:.74em;color:var(--muted);font-weight:600}
.bar2{position:relative;height:10px;background:var(--card2);border-radius:5px;overflow:hidden;margin:8px 0 6px;display:flex}
.bar2 i{display:block;height:100%}
.lim .st{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:.82em;color:var(--muted);font-weight:600}
.healthy{display:flex;align-items:center;justify-content:space-between}
.healthy .n{font-size:1.5em;font-weight:800}
/* donut + legend */
.donutwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:420px){ .donutwrap{grid-template-columns:1fr} .donutwrap svg{margin:0 auto} }
.donutwrap svg{width:150px;height:150px;display:block}
.leg{display:flex;flex-direction:column;gap:7px;font-size:.9em}
.leg .l{display:flex;align-items:center;gap:8px}
.leg .l b{width:10px;height:10px;border-radius:3px;flex:none}
.leg .l .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .l .v{font-weight:800}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8em;flex:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dang{color:var(--bad)}
.btn.dang:hover{border-color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{padding:5px 11px;font-size:.86em}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px;resize:vertical}
.welcome{text-align:center;padding:26px 16px}
.welcome .e{font-size:2.6em}
.goal .bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;margin:10px 0 6px}
.goal .bar i{display:block;height:100%;border-radius:5px}
.goal .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart svg{width:100%;height:auto;display:block}
.chart .m{cursor:pointer}
.chart .m:hover rect.bg{fill:var(--card2)}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:.92em}
.hbar .tr{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px}
.hbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{text-align:center;margin-top:22px}

/* bottom bar + add button (phones) */
.bnav{display:none}
.fab{display:none}
@media (max-width:699px){
  .tabs{display:none}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7em;font-weight:700;color:var(--muted);padding:4px 0}
  .bnav button svg{width:22px;height:22px}
  .bnav button.on{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;
    border:none;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:#0a0c1499;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:22px;max-height:88vh} .sheet::before{display:none} }
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 14px;font-size:1.2em;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto}
.sheet h4{margin:20px 0 8px;font-size:.74em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;padding:0;flex:none}
.ib:hover{border-color:var(--accent)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:.84em;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input:not([type=checkbox]):not([type=radio]):not([type=file]),.f select,.inp{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.f input.amount{font-size:1.6em;font-weight:800;text-align:right}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:8px 4px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px #0002}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 11px;font-size:.9em;font-weight:600}
.chip2.on{border-color:var(--accent);background:var(--accent-soft);font-weight:800}
.check{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.box{background:var(--card2);border-radius:14px;padding:12px;margin:8px 0 14px}
.sheet .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet .actions .btn{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--text)}
.catrow{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;margin-bottom:8px}
.catrow input{text-align:center}
.catrow input+input{text-align:left}
.limrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;margin-bottom:8px}
.limrow input{text-align:right}
.brow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;width:100%;background:var(--card);text-align:left}
.brow.on{border-color:var(--accent);background:var(--accent-soft)}
.brow .main{flex:1}
.code{font-family:ui-monospace,Consolas,monospace;font-size:.86em;word-break:break-all;background:var(--card2);padding:8px 10px;border-radius:10px;display:block}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:14px;z-index:40;font-weight:700;max-width:90vw;box-shadow:0 6px 20px #0004}
.toast[hidden]{display:none}

/* login */
.loginbg{min-height:100vh;background:linear-gradient(150deg,var(--head1),var(--head2));padding:12vh 16px 0}
.login{max-width:380px;margin:0 auto;background:var(--card);border-radius:24px;padding:26px 22px;box-shadow:0 20px 50px #0003}
.login .logo{width:58px;height:58px;border-radius:16px;margin-bottom:10px}
.err{color:var(--bad);font-size:.9em;min-height:1.2em;margin:4px 0 8px}
.demo{background:#00000030;color:#fff;font-size:.78em;font-weight:700;text-align:center;padding:5px 10px}

/* ---------- v2 layout (template-inspired, same colours) ---------- */
.segpill{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow);margin:0 auto 14px;max-width:420px}
.segpill button{flex:1;border:none;background:none;border-radius:999px;padding:9px 6px;font-weight:700;color:var(--muted)}
.segpill button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.gaugecard{text-align:center;padding-bottom:14px}
.gaugecard svg{width:100%;max-width:340px;height:auto;display:block;margin:4px auto 0}
.gaugecard .gl{font-weight:700;color:var(--muted);font-size:.86em;margin-top:-58px}
.gaugecard .gv{font-size:2.15em;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.gaugecard .gs{color:var(--muted);font-size:.82em;margin-top:2px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:16px;font-size:.8em;font-weight:600;color:var(--muted)}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.mbar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;margin:10px 0 8px}
.mbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#7dd3fc))}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow .k{font-size:.8em;color:var(--muted);font-weight:700}
.mrow .v{font-weight:800;font-size:1.15em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.kpi .kh{display:flex;align-items:center;gap:8px;font-size:.82em;font-weight:700;color:var(--muted)}
.kpi .kh span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--card2);font-size:.95em}
.kpi .kv{font-weight:800;font-size:1.25em;margin:10px 0 2px}
.kpi .ks{font-size:.76em;color:var(--muted);font-weight:600}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.ttl b{font-size:1.02em}
.ttl .lk{border:none;background:none;color:var(--accent);font-weight:700;font-size:.88em;padding:2px 0}
.row2{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.row2:first-of-type{border-top:none}
.row2 .ci{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.15em;flex:none}
.row2 .mn{flex:1;min-width:0}
.row2 .mn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .mn span{font-size:.8em;color:var(--muted);font-weight:600}
.row2 .rt{text-align:right;white-space:nowrap}
.row2 .rt b{display:block}
.row2 .st{font-size:.76em;font-weight:800}
.st.ok{color:var(--good)} .st.due{color:var(--warn)} .st.late{color:var(--bad)} .st.mute{color:var(--muted)}
.thin{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.thin i{display:block;height:100%;border-radius:3px}
.goalmini .mrow{margin-top:4px}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 13%,var(--card));font-size:.9em;font-weight:600}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.banner .btn{margin-left:auto;flex:none}
/* savings v2 */
.gcard{cursor:pointer}
.gcard .top{display:flex;align-items:center;gap:12px}
.gcard .top b{flex:1;font-size:1.05em}
.gcard .big{font-size:1.55em;font-weight:800;margin:12px 0 0}
.gcard .of{color:var(--muted);font-weight:600;font-size:.86em}
.gcard .bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin:10px 0 8px}
.gcard .bar i{display:block;height:100%;border-radius:4px}
.gcard .ft{display:flex;justify-content:space-between;align-items:center;font-size:.82em;color:var(--muted);font-weight:600}
/* add sheet v2 */
.amtwrap{text-align:center;margin:6px 0 16px}
.amtwrap input{border:none!important;background:none!important;font-size:2.6em!important;font-weight:800;text-align:center!important;width:100%;min-height:0!important;padding:4px!important;outline:none}
.amtwrap .cur{color:var(--muted);font-weight:700;font-size:.82em}
.amtwrap .ul{height:2px;width:60%;margin:0 auto;background:var(--line);border-radius:1px}
.amtwrap input:focus + .ul{background:var(--accent)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip2{flex:none;white-space:nowrap}
/* with a mouse there's no sideways swipe: show all categories on several lines instead */
@media (pointer:fine){ .hscroll{flex-wrap:wrap;overflow:visible;padding-bottom:2px} }
#fSDL{display:none}
.more{border:none;background:none;color:var(--accent);font-weight:700;padding:4px 0;margin:2px 0 8px}
/* floating bottom bar (all sizes) */
.fnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:8;display:flex;align-items:center;gap:4px;
  background:var(--card);border-radius:999px;padding:6px;box-shadow:0 10px 30px #1b1d2933, 0 1px 3px #1b1d291a;width:min(440px,calc(100% - 24px))}
.fnav button{flex:1;border:none;background:none;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-weight:700;font-size:.7em;min-width:0}
.fnav button svg{width:21px;height:21px;flex:none}
.fnav button .lb{display:block;white-space:nowrap}
.fnav button.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7dd3fc));color:#fff}
.fnav .plus{flex:none;width:54px;background:var(--text);color:var(--bg);font-size:26px;font-weight:600}
body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.bnav,.fab,.tabs{display:none!important}
@media (max-width:420px){ .kpi .kv{font-size:1.1em} .gaugecard .gv{font-size:1.85em} }

/* stage 5 */
.fc{display:flex;flex-direction:column;gap:6px;font-size:.9em}
.fc div{display:flex;justify-content:space-between;gap:10px}
.fc span{color:var(--muted);font-weight:600}
.fc i{font-style:normal;font-size:.9em}
.ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:.92em}
.ttl + .ins{border-top:none}
.ins b{font-weight:800}
.ins.t-good b{color:var(--good)} .ins.t-warn b{color:var(--warn)} .ins.t-bad b{color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.72em;font-weight:800;color:var(--muted);padding-bottom:2px}
.cd{border:none;background:var(--card2);border-radius:12px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;color:var(--text);min-width:0}
.cd b{font-size:.86em}
.cd i{display:flex;gap:2px;height:6px}
.cd em{width:6px;height:6px;border-radius:50%;display:block}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.sel{background:var(--accent);color:#fff}
.cd.sel em{box-shadow:0 0 0 1.5px #fff}
.cd:hover{filter:brightness(.97)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);padding:8px 11px;border-radius:10px;font-size:.82em;font-weight:700;white-space:pre-line;box-shadow:0 6px 20px #0004}
.tip[hidden]{display:none}
.savempty{max-width:520px;margin:10px auto 0;position:relative;overflow:hidden;padding:34px 22px}
.savempty::before,.savempty::after{content:"";position:absolute;border-radius:50%;background:var(--accent-soft);z-index:0}
.savempty::before{width:180px;height:180px;top:-70px;right:-60px}
.savempty::after{width:120px;height:120px;bottom:-50px;left:-40px;background:color-mix(in srgb,var(--save) 18%,transparent)}
.savempty>*{position:relative;z-index:1}
.savempty .e{font-size:3.2em}

/* polish: bigger secondary text, goal history bars */
.item .meta,.row2 .mn span,.kpi .ks,.tile .s,.gs,.ks{font-size:.86em}
.kpi .kh,.mrow .k,.fc span{font-size:.88em}
.gbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:118px;padding:4px 2px 0}
.gbars>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.gbars i{display:block;width:70%;border-radius:6px}
.gbars b{font-size:.74em;color:var(--muted)}
.gbars .gv2{font-size:.7em;font-weight:800;color:var(--muted);white-space:nowrap}
.row2 .mn .atx{font-size:.95em;color:var(--text);font-weight:600;line-height:1.4}
.row2 .mn .atx b{display:inline;font-weight:800}

/* Responsive dashboard */
:root { --r:14px; --shell:#083831; --hero:#14262c; }
:root[data-theme=light] { --bg:#eef4f1; --card:#fff; --card2:#e5efea; --line:#dbe7e0; --text:#142520; --muted:#52645c; }
@media (prefers-color-scheme:light) {
  :root:not([data-theme=dark]) { --bg:#eef4f1; --card:#fff; --card2:#e5efea; --line:#dbe7e0; --text:#142520; --muted:#52645c; }
}
.card { border:1px solid var(--line); box-shadow:0 2px 4px #0a392b08, 0 10px 24px #0a392b0a; }
#app .head { background:var(--bg); color:var(--text); padding-bottom:0; }
#app .topin { background:var(--shell); color:white; margin-inline:-16px; padding:8px 16px; }
.brand { font-weight:800; font-size:1.2em; letter-spacing:-.035em; }
#app .bsel { margin-left:0; border:1px solid #ffffff42; border-radius:10px; padding:6px 9px; min-height:42px; }
#app .bsel .t { font-size:.87em; }
#app .bsel .av { width:24px; height:24px; background:none; }
#app .nav { justify-content:flex-start; flex-wrap:wrap; }
#app .nav .lbl { text-align:left; min-width:0; font-size:clamp(1.05em, 3vw, 1.65em); }
#app .nav .gb { background:var(--card2); color:var(--text); border-radius:9px; width:44px; height:44px; }
.head .pill { color:var(--text); background:var(--card2); }
.head .now-actions { margin-top:6px; }
.desktop-add { display:none; }
.home-grid { display:grid; gap:12px; }
.home-grid > * { min-width:0; }
.home-hero { background:var(--hero); color:#fafefb; padding:clamp(16px,3vw,28px); }
.home-hero h1 { font-size:clamp(1.85em,6vw,3.3em); line-height:1.15; letter-spacing:-.045em; margin:.1em 0 .25em; overflow-wrap:anywhere; }
.home-hero h1 .money { white-space:normal; }
.home-hero h1.bad { color:#ffadb2; }
.home-hero .hero-caption { color:#cbe5d8; font-weight:700; }
.home-hero .hero-totals { display:flex; gap:6px 20px; flex-wrap:wrap; margin:0 0 8px; }
.home-hero .lk { color:#a0edc5; min-height:44px; padding:0; text-align:left; }
.home-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,8.8rem),1fr)); gap:12px; }
.home-metric { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; text-align:left; color:var(--text); min-width:0; }
.home-metric .money { white-space:normal; }
.home-metric strong { display:block; font-size:clamp(1.1em,3vw,1.75em); margin:4px 0; }
button.home-metric:hover { border-color:var(--accent); }
.home-card-title { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:4px 10px; margin-bottom:8px; }
.home-card-title h2, .details-heading { font-size:1.15em; margin:0; letter-spacing:-.02em; }
.home-card-title .lk { min-height:44px; }
.budget-shell .lk { border:0; background:none; font-weight:750; }
.home-card-title .lk, .budget-shell main > .lk { color:var(--accent); }
.home-bill { display:grid; grid-template-columns:minmax(0,1fr) auto 44px; align-items:center; gap:7px; padding:6px 0; border-top:1px solid var(--line); }
.home-bill-name { display:flex; align-items:center; gap:8px; background:none; border:0; padding:4px 0; text-align:left; min-height:44px; min-width:0; }
.home-bill-name span:last-child { min-width:0; overflow-wrap:anywhere; }
.home-bill-name .small { display:block; }
.home-bill-date, .home-bill-head { display:none; }
.home-pay { width:44px; height:44px; border:0; background:none; display:grid; place-items:center; border-radius:10px; }
.home-pay::before { content:""; border:1.5px solid var(--muted); width:19px; height:19px; border-radius:5px; }
.home-pay:hover, .home-pay:focus-visible { background:var(--card2); }
.home-bill .money { white-space:normal; text-align:right; }
.home-spend-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 8px; align-items:center; width:100%; border:0; background:none; padding:9px 4px; text-align:left; border-radius:8px; }
.home-spend-row:hover, .home-spend-row:focus-visible { background:var(--card2); }
.home-spend-row .thin { grid-column:2/-1; margin:0; height:7px; }
.home-spend-row .thin i { background:var(--accent); }
.details-heading { margin:4px 0 12px; }
#billsCard { scroll-margin-top:12px; }
#app .fnav { background:var(--shell); border:0; }
#app .fnav button { color:#e1f4ea; }
#app .fnav button.on, #app .fnav .plus { background:#167052; color:white; }
@media (max-width:859px) {
  #app .fnav { left:0; right:0; bottom:0; width:auto; max-width:none; transform:none; border-radius:0; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
  #app .fnav button { border-radius:10px; }
  #app .fnav .plus { font-size:1em; width:auto; order:2; }
  #app .topin .gb { width:34px; height:38px; }
}
@media (min-width:860px) {
  #app .budget-shell { padding-left:192px; min-height:100vh; }
  #app .head { padding-top:6px; }
  #app .topin { position:fixed; width:192px; margin:0; top:0; left:0; z-index:9; align-items:flex-start; display:grid; grid-template-columns:1fr auto; padding:20px 14px; gap:12px 4px; }
  #app .topin .sp { display:none; }
  #app .topin .gb { grid-area:1/2; width:28px; height:30px; }
  #app .bsel { grid-column:1/-1; }
  #app .fnav { inset:0 auto 0 0; width:192px; max-width:none; border-radius:0; transform:none; flex-direction:column; align-items:stretch; justify-content:flex-start; padding:130px 14px 12px;
    background:radial-gradient(ellipse 145% 38% at 120% 104%, #176c57 0%, #0b493d 63%, transparent 64%), var(--shell); }
  #app .fnav button { flex:none; flex-direction:row; justify-content:flex-start; gap:9px; height:46px; padding:0 12px; font-size:.92em; border-radius:9px; }
  #app .fnav .plus { display:none; }
  .desktop-add { display:inline-block; margin-left:auto; }
  .wrap { max-width:1440px; padding-inline:clamp(16px,2.1vw,30px); }
  #app .home-grid { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start; gap:16px; }
  #app .home-hero, #app .home-metrics { align-self:stretch; }
}
@media (min-width:1120px) {
  .home-bill, .home-bill-head { display:grid; grid-template-columns:minmax(0,1fr) 5.5em 6em 44px; align-items:center; gap:8px; }
  .home-bill-head { color:var(--muted); padding:6px 0; font-size:.84em; }
  .home-bill-date { display:block; }
  .home-bill-name .small { display:none; }
}
@media (min-width:860px) { body { padding-bottom:24px; } }
.beta-mark { padding:2px 6px; border:1px solid #ffffff55; border-radius:5px; font-size:.67em; align-self:center; }
.balance-flow .good { color:#08794a; }
.balance-flow .bad { color:#bf3446; }
.balance-flow .fc b .money { color:inherit; }
:root[data-theme=dark] .balance-flow .good { color:var(--good); }
:root[data-theme=dark] .balance-flow .bad { color:var(--bad); }
@media (prefers-color-scheme:dark) {
  :root:not([data-theme=light]) .balance-flow .good { color:var(--good); }
  :root:not([data-theme=light]) .balance-flow .bad { color:var(--bad); }
}
.limit-status { --status:var(--accent); padding:10px 0; border-top:1px solid var(--line); }
.limit-status.close { --status:#bd5b08; }
.limit-status.critical { --status:#c2344b; }
.limit-status .thin i { background:var(--status); }
.limit-status .limit-label { color:var(--status); font-weight:800; }
:root[data-theme=dark] .limit-status.close { --status:#ffbc69; }
:root[data-theme=dark] .limit-status.critical { --status:#ff8798; }
@media (prefers-color-scheme:dark) {
  :root:not([data-theme=light]) .limit-status.close { --status:#ffbc69; }
  :root:not([data-theme=light]) .limit-status.critical { --status:#ff8798; }
}
.settings-page { max-width:760px; }
.settings-page h2 { font-size:1.08em; margin:0 0 14px; }
.settings-page .card + .card { margin-top:12px; }
.settings-page .actions { flex-wrap:wrap; }
.year-month { cursor:pointer; }
.year-month:is(:hover,:focus-visible) .bg { fill:var(--accent-soft); stroke:var(--accent); stroke-width:.8; }
.year-month:is(:hover,:focus-visible) .year-bar { fill:var(--accent); }
.tip.year-tip { background:var(--card); color:var(--text); border:1px solid var(--line); padding:12px; min-width:174px; max-width:calc(100vw - 16px); white-space:normal; }
.year-tip strong { display:block; margin-bottom:6px; }
.year-tip-row { display:flex; justify-content:space-between; gap:14px; padding:2px 0; }
.year-tip-row:last-of-type { border-top:1px solid var(--line); margin-top:4px; padding-top:5px; }
.year-tip .tip-hint { display:block; margin-top:6px; font-size:.9em; }
.home-hero, .year-hero, .savings-hero {
  background:radial-gradient(ellipse 85% 80% at 110% 120%, #1b8069 0%, #115849 65%, transparent 65.5%),
    radial-gradient(ellipse 65% 90% at 110% 106%, #155749 0%, transparent 75%), #083831;
  color:#f4fcf8;
}
.year-hero { --chart-grid:#ffffff24; --chart-text:#d4eae1; --chart-hover:#ffffff18; padding:clamp(16px,3vw,26px); }
.year-hero .muted { color:#d4eae1; }
.year-hero .year-total { font-size:clamp(1.8em,4vw,2.6em); }
.year-total { margin:2px 0 4px; font-size:1.7em; font-weight:800; letter-spacing:-.04em; }
.year-svg { display:block; width:100%; height:auto; margin-top:12px; overflow:visible; }
.year-axis { fill:var(--chart-text,var(--muted)); font-size:13px; }
.year-gridline { stroke:var(--chart-grid,var(--line)); }
.year-hover { fill:transparent; stroke:none; }
.year-month:is(:hover,:focus-visible) .year-hover { fill:var(--chart-hover,var(--accent-soft)); stroke:var(--accent); }
.year-month:is(:hover,:focus-visible) .year-column { stroke:var(--chart-text,var(--text)); stroke-width:1.5; }
.year-svg .current .year-column { stroke:var(--chart-text,var(--text)); stroke-width:1.5; }
.year-svg .planned .year-column { fill:transparent; stroke:var(--chart-text,var(--muted)); stroke-dasharray:3 3; }
.year-svg .year-avg { stroke:var(--out); stroke-width:1.5; stroke-dasharray:5 4; pointer-events:none; }
.year-legend { display:flex; flex-wrap:wrap; gap:3px 12px; margin-top:8px; }
.savings-hero svg { max-width:280px; }
.savings-hero { --card2:#426b60; }
.savings-hero .gl { margin-top:-47px; }
.savings-hero .gs, .savings-hero .gl { color:#d4eae1; }
.savings-summary { align-items:stretch; }
.savings-breakdown-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px 12px; align-items:center; border:0; border-bottom:1px solid var(--line); padding:10px 0; width:100%; min-height:44px; background:none; text-align:left; }
.savings-breakdown-row:hover { background:var(--card2); }
.goal-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
.look-preview { display:grid; grid-template-columns:22% minmax(0,1fr); min-height:164px; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
.look-preview-rail { background:var(--shell); color:white; padding:10px 5px; text-align:center; font-weight:800; font-size:.72em; }
.look-preview-body { background:var(--bg); display:grid; gap:8px; padding:10px; }
.look-preview-body strong { display:block; background:var(--hero); color:white; padding:9px; border-radius:7px; }
.look-preview-body .thin { margin:0; }
.look-preview-body .thin i { width:58%; background:var(--accent); }
.bill-filters { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px; }
.bill-filters .btn[aria-pressed="true"] { background:var(--accent-soft); color:var(--text); border-color:var(--accent); }
.category-detail { max-width:800px; }
.category-total { margin:0 0 14px; }
.toast-undo { border:0; background:none; color:inherit; min-height:44px; padding:0 8px; margin-left:10px; text-decoration:underline; font-weight:800; }
.settings-title { margin:0; font-size:clamp(1.85em,3.2vw,2.85em); letter-spacing:-.045em; line-height:1.12; }
.budget-shell .home-details-button { border-radius:999px; padding:0 15px; background:#217b6866; }
.budget-shell .home-details-button:hover { background:#217b68a6; }
.home-metric-link { position:relative; }
.home-metric-link > .muted:first-child { padding-right:13px; }
.home-metric-chevron { position:absolute; top:12px; right:12px; color:var(--accent); font-size:1.5em; font-weight:800; line-height:1; }
.budget-shell .month-details .lk,
.budget-shell .month-details .bill-filters .btn,
.budget-shell .month-details .card > .btn {
  border:1px solid var(--line); border-radius:999px; padding:5px 12px; min-height:34px;
  background:var(--card2); color:var(--text); font-weight:750;
}
.budget-shell .month-details .lk:hover,
.budget-shell .month-details .card > .btn:hover,
.budget-shell .month-details .bill-filters .btn:is(:hover,[aria-pressed="true"]) {
  border-color:var(--accent); background:var(--accent-soft);
}
.month-details > .lk { margin-bottom:8px; }
.month-details .sec > span:last-child { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:4px; }
.month-details .sec .lk { font-size:1.1em; }
.month-details .sec .lk + .lk { margin-left:0; }
.home-hero { grid-area:balance; }
.home-metrics { grid-area:metrics; }
.home-bills { grid-area:bills; }
.home-pace { grid-area:pace; }
.home-spending { grid-area:spending; }
.home-recent { grid-area:recent; }

/* ---------- demo store (no Firebase): same API as Cloud, kept in this browser ---------- */
function makeLocalStore() {
  const K = "budget.demo.v1";
  let db = null; try { db = JSON.parse(localStorage.getItem(K)); } catch {}
  db = db || { profile: {}, budgets: {}, items: {}, months: {} };
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch {} subs.forEach(f => f()); };
  const on = f => { subs.add(f); setTimeout(f); return () => subs.delete(f); };
  const clone = o => JSON.parse(JSON.stringify(o ?? null));
  const merge = (t, p) => { for (const [k, v] of Object.entries(p)) {
    if (v === null) delete t[k];
    else if (v && typeof v === "object" && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== "object") t[k] = {}; merge(t[k], v); }
    else t[k] = v; } return t; };
  const listOf = o => Object.entries(o || {}).map(([id, x]) => ({ ...clone(x), id }));
  const ok = Promise.resolve();
  return {
    version: APP_VERSION,
    watchProfile: cb => on(() => cb(clone(db.profile))),
    saveProfile: p => { merge(db.profile, p); persist(); return ok; },
    watchBudgets: cb => on(() => cb(listOf(db.budgets), { fromCache: false })),
    createBudget: d => { const id = rid(); db.budgets[id] = { ...d, owner: "local", members: ["local"], createdAt: Date.now() }; persist(); return { id, done: ok }; },
    updateBudget: (b, p) => { merge(db.budgets[b], p); persist(); return ok; },
    replaceBudgetField: (b, f, v) => { db.budgets[b][f] = clone(v); persist(); return ok; },
    deleteBudget: b => { delete db.budgets[b]; delete db.items[b]; delete db.months[b]; persist(); return ok; },
    leaveBudget: () => ok,
    watchBudget: (b, o) => on(() => { const it = db.items[b] || {}; o.entries(listOf(it.entries)); o.months(clone(db.months[b] || {})); o.goals(listOf(it.goals)); }),
    saveItem: (b, c, id, d) => { id = id || rid(); ((db.items[b] ||= {})[c] ||= {})[id] = clone(d); persist(); return { id, done: ok }; },
    deleteItem: (b, c, id) => { if (db.items[b]?.[c]) delete db.items[b][c][id]; persist(); return ok; },
    setMonth: (b, m, p) => { merge((db.months[b] ||= {})[m] ||= {}, p); persist(); return ok; },
    addActivity: (b, d) => { ((db.items[b] ||= {}).activity ||= {})[rid()] = clone(d); persist(); return ok; },
    watchActivity: (b, cb) => on(() => cb(listOf(db.items[b]?.activity).sort((x, z) => z.at - x.at).slice(0, 80))),
  };
}

function avatar(uid) {

  return `<span class="av" style="background:${PALETTE[h % PALETTE.length]}" title="${esc(n)}">${esc(n.trim().slice(0, 1).toUpperCase() || "?")}</span>`;

function money(n, opt = {}) {
  const b = B() || {};
  const loc = (NUMSTYLES[b.numStyle] || NUMSTYLES.dot)[0];
  let f;
  try { f = new Intl.NumberFormat(loc, { style: "currency", currency: b.currency || "EUR", minimumFractionDigits: opt.round ? 0 : 2, maximumFractionDigits: opt.round ? 0 : 2 }); }
  catch { f = new Intl.NumberFormat(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  const v = opt.abs ? Math.abs(n) : n;
  if (opt.raw) return f.format(v);
  const html = f.formatToParts(v).map(p => p.type === "decimal" || p.type === "fraction" ? `<small>${esc(p.value)}</small>` : esc(p.value)).join("");
  return `<span class="money">${html}</span>`;
}

/* ---------- budget maths ---------- */
// short, plain-language observations from the budget's own numbers (max 4)
function insights(m) {
  const out = [], cur = outByCat(m), pm = mk(mi(m) - 1), prev = outByCat(pm), t = totals(m), p = totals(pm);
  const hasPrev = Object.keys(prev).length > 0, R = v => money(Math.abs(v), { round: true });
  if (hasPrev) {
    const diffs = [...new Set([...Object.keys(cur), ...Object.keys(prev)])].map(id => ({ id, d: r2((cur[id] || 0) - (prev[id] || 0)), was: prev[id] || 0 }));
    const up = diffs.filter(x => x.d >= 20 && (x.was === 0 || x.d / x.was >= .1)).sort((a, z) => z.d - a.d)[0];
    const down = diffs.filter(x => x.d <= -20 && x.was > 0 && -x.d / x.was >= .1).sort((a, z) => a.d - z.d)[0];
    if (up) out.push({ key: "up:" + up.id, icon: "📈", tone: "warn", html: `Spending on <b>${esc(cat(up.id).name)}</b> is ${R(up.d)} higher than last month.` });
    if (down) out.push({ key: "down:" + down.id, icon: "📉", tone: "good", html: `Spending on <b>${esc(cat(down.id).name)}</b> is ${R(down.d)} lower than last month.` });
    const pct = change(t.out, p.out);
    if (pct != null && Math.abs(pct) >= 5) out.push({ key: "out", icon: pct < 0 ? "✅" : "⚠️", tone: pct < 0 ? "good" : "warn", html: `Everything going out is <b>${pct < 0 ? "down" : "up"} ${Math.abs(pct)}%</b> on last month.` });
    const sv = r2(t.saved - p.saved);
    if (sv >= 20) out.push({ key: "saved", icon: "🐷", tone: "good", html: `You've saved <b>${R(sv)} more</b> than last month.` });
  }
  for (const L of limitsFor(m)) {
    const f = L.used / L.limit;
    if (f > 1) out.push({ key: "over:" + L.id, icon: "🚦", tone: "bad", html: `<b>${esc(L.c.name)}</b> is ${R(L.used - L.limit)} over its limit.` });
    else if (f >= .8) out.push({ key: "near:" + L.id, icon: "⏳", tone: "warn", html: `You're at <b>${Math.round(f * 100)}%</b> of your ${esc(L.c.name)} limit.` });
  }
  const top = Object.entries(cur).sort((a, z) => z[1] - a[1])[0];
  if (top && t.out > 0) out.push({ key: "top:" + top[0], icon: "🏠", tone: "", html: `<b>${esc(cat(top[0]).name)}</b> takes ${Math.round(top[1] / t.out * 100)}% of everything going out this month.` });
  // the one that leads to a decision comes first: where this month is heading
  const fc = forecast(m);
  if (fc && (fc.income || fc.bills || fc.spent)) out.unshift(fc.end >= 0
    ? { key: "fc", icon: "🎯", tone: "good", html: `You're on track to finish ${esc(monthName(m, { month: "long" }))} with <b>${R(fc.end)} left</b>.` }
    : { key: "fc", icon: "⚠️", tone: "bad", html: `At this rate ${esc(monthName(m, { month: "long" }))} ends <b>${R(fc.end)} short</b>. Holding back on spending would close the gap.` });
  return out.slice(0, 5);
}

function timeAgo(at) {
  const d = Date.now() - at, min = Math.round(d / 60000);
  if (min < 1) return "just now"; if (min < 60) return `${min} min ago`;
  const h = Math.round(min / 60); if (h < 24 && new Date(at).getDate() === new Date().getDate()) return `${h} h ago`;
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (new Date(at).toDateString() === y.toDateString()) return "yesterday";
  return new Date(at).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

const change = (now, before) => before > 0 ? Math.round((now - before) / before * 100) : null;
function chip(pct, lowerIsGood) {
  if (pct == null || !isFinite(pct)) return "";
  const good = lowerIsGood ? pct <= 0 : pct >= 0;
  return `<span class="chip ${pct === 0 ? "" : good ? "good" : "bad"}">${pct > 0 ? "▲" : pct < 0 ? "▼" : "•"} ${Math.abs(pct)}%</span>`;
}
function ring(frac, color, size = 74, stroke = 9) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${f * c} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}
function donut(segs, center, sub) {
  const size = 150, stroke = 18, r = (size - stroke) / 2, c = 2 * Math.PI * r, tot = sum(segs, s => s.v) || 1, gap = segs.length > 1 ? 3 : 0;
  let off = 0;
  const arcs = segs.map(s => { const len = Math.max(0, s.v / tot * c - gap);
    const a = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(s.t || "")}</title></circle>`;
    off += s.v / tot * c; return a; }).join("");
  return `<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${stroke}"/>${arcs}
    <text x="75" y="${sub ? 72 : 80}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text)" class="money">${esc(center)}</text>
    ${sub ? `<text x="75" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">${esc(sub)}</text>` : ""}</svg>`;
}
