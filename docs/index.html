<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5b5fd6">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the font loads without holding up the first paint -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!-- start fetching Firebase right away, in parallel with the page -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<script>
// apply the saved look before anything paints (no flash of the wrong theme)
try { const l = JSON.parse(localStorage.getItem("budget.look") || "{}");
  if (l.theme && l.theme !== "auto") document.documentElement.dataset.theme = l.theme;
  if (l.size) document.documentElement.dataset.size = l.size;
  if (l.accentHex) document.documentElement.style.setProperty("--accent", l.accentHex); } catch {}
</script>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --card2:#f5f6fa; --text:#1b1d29; --muted:#62677b; --line:#e8eaf1;
  --accent:#5b5fd6; --accent-soft:color-mix(in srgb,var(--accent) 13%,transparent); --on-accent:#fff;
  --head1:var(--accent); --head2:color-mix(in srgb,var(--accent) 55%,#a5f3fc);
  --good:#16a34a; --bad:#e2574c; --warn:#d97706; --out:#f08a6c; --spend:#f6b84a; --save:#a78bfa;
  --shadow:0 1px 2px #1b1d290a, 0 6px 20px #1b1d290d;
  --r:18px; --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#0e1016; --card:#171a23; --card2:#1f2330; --text:#eceef5; --muted:#a3a8bb; --line:#272b38;
    --head1:color-mix(in srgb,var(--accent) 70%,#0e1016); --head2:color-mix(in srgb,var(--accent) 35%,#0e1016);
    --good:#4ade80; --bad:#fb7185; --warn:#fbbf24; --shadow:none;
  }
}
:root[data-theme=dark]{
  --bg:#0e1016; --card:#171a23; --card2:#1f2330; --text:#eceef5; --muted:#a3a8bb; --line:#272b38;
  --head1:color-mix(in srgb,var(--accent) 70%,#0e1016); --head2:color-mix(in srgb,var(--accent) 35%,#0e1016);
  --good:#4ade80; --bad:#fb7185; --warn:#fbbf24; --shadow:none;
}
:root[data-size=large]{--fs:17px} :root[data-size=xl]{--fs:19px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:500 var(--fs)/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(30px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.money small{font-size:.72em;font-weight:inherit;opacity:.85}
body.hide .money{filter:blur(.42em);user-select:none}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:.9em}

/* ---------- coloured header ---------- */
.head{background:linear-gradient(150deg,var(--head1),var(--head2));color:#fff;padding-top:env(safe-area-inset-top)}
.head.tall{padding-bottom:16px}
.head.short{padding-bottom:20px}
.topin{display:flex;align-items:center;gap:8px;padding:14px 0 6px}
.bsel{display:flex;align-items:center;gap:10px;border:none;background:none;color:#fff;padding:4px 8px 4px 4px;margin-left:-4px;border-radius:14px;min-width:0;text-align:left}
.bsel:hover{background:#ffffff1f}
.bsel .av{width:38px;height:38px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-size:1.2em;flex:none}
.bsel .t{display:block;font-weight:800;font-size:1.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsel .s{display:block;font-size:.78em;opacity:.85;font-weight:600}
.sp{flex:1}
.gb{border:none;background:#ffffff2b;color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;padding:0;flex:none}
.gb:hover{background:#ffffff45}
.gb svg{width:20px;height:20px}
.tabs{display:flex;gap:6px;margin:10px 0 0}
.tab{border:none;background:#ffffff26;color:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:.92em}
.tab.on{background:#fff;color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 0}
.nav .lbl{font-weight:800;font-size:1.05em;min-width:160px;text-align:center}
.nav .gb{width:34px;height:34px;font-size:1.1em}
.pill{border:none;background:#ffffff2b;color:#fff;border-radius:999px;padding:5px 12px;font-size:.82em;font-weight:700}
.pill:hover{background:#ffffff45}
main.wrap{margin-top:18px;position:relative}
.head.short + main.wrap{margin-top:18px}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media (min-width:880px){ .grid.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start} }
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{padding:4px 16px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 8px;font-size:.74em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec .lk{border:none;background:none;color:var(--accent);font-weight:700;font-size:1.25em;letter-spacing:0;text-transform:none;padding:2px 4px}
.sec .lk+.lk{margin-left:6px}
.total{position:relative}
.total .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
.total .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.total .lbl{font-weight:700}
.total .big{font-size:2.1em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.total .eq{color:var(--muted);font-size:.86em;margin-top:2px}
.brk{margin-top:10px}
.brk .r{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.brk .r:first-child{border-top:none}
.brk .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.05em;flex:none}
.brk .n{flex:1;font-weight:600}
.brk .v{font-weight:800}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--card2);margin:12px 0 2px;gap:2px}
.stack i{display:block;height:100%;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:.78em;color:var(--muted);font-weight:700}
.tile .v{font-weight:800;font-size:1.12em;margin-top:2px}
.tile .s{font-size:.76em;color:var(--muted)}
@media (max-width:520px){ .tiles{grid-template-columns:1fr 1fr} .tiles .tile:nth-child(3){grid-column:1/-1} }
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:center}
.ring svg{width:74px;height:74px;display:block;margin:0 auto 8px}
.ring .k{font-size:.8em;color:var(--muted);font-weight:700}
.ring .v{font-weight:800;font-size:1.2em}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:.74em;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);margin-top:4px}
.chip.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:none}
.item:hover .name{color:var(--accent)}
.emo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.15em;flex:none}
.item .main{flex:1;min-width:0}
.item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;white-space:nowrap;text-align:right}
.item .amt .sub{display:block;font-weight:600;font-size:.74em;color:var(--muted)}
.item .amt .was{display:block;font-weight:500;font-size:.74em;color:var(--muted);text-decoration:line-through}
.item.skipped{opacity:.5} .item.skipped .amt{text-decoration:line-through}
.item.paid .name{color:var(--muted)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;color:#fff}
.chk svg{width:15px;height:15px;opacity:0}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on svg{opacity:1}
.chk.late{border-color:var(--bad)}
.tag{display:inline-block;font-size:.7em;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--card2);color:var(--muted);margin-left:5px;vertical-align:1px}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:12px 0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--warn) 12%,var(--card));font-size:.92em}
.alert.bad{background:color-mix(in srgb,var(--bad) 11%,var(--card))}
/* limits */
.lim{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.lim:first-child{border-top:none}
.lim .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lim .nm{font-weight:800}
.lim .lft{font-weight:800;text-align:right}
.lim .lft .sub{display:block;font-size:.74em;color:var(--muted);font-weight:600}
.bar2{position:relative;height:10px;background:var(--card2);border-radius:5px;overflow:hidden;margin:8px 0 6px;display:flex}
.bar2 i{display:block;height:100%}
.lim .st{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:.82em;color:var(--muted);font-weight:600}
.healthy{display:flex;align-items:center;justify-content:space-between}
.healthy .n{font-size:1.5em;font-weight:800}
/* donut + legend */
.donutwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:420px){ .donutwrap{grid-template-columns:1fr} .donutwrap svg{margin:0 auto} }
.donutwrap svg{width:150px;height:150px;display:block}
.leg{display:flex;flex-direction:column;gap:7px;font-size:.9em}
.leg .l{display:flex;align-items:center;gap:8px}
.leg .l b{width:10px;height:10px;border-radius:3px;flex:none}
.leg .l .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .l .v{font-weight:800}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8em;flex:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dang{color:var(--bad)}
.btn.dang:hover{border-color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{padding:5px 11px;font-size:.86em}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px;resize:vertical}
.welcome{text-align:center;padding:26px 16px}
.welcome .e{font-size:2.6em}
.goal .bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;margin:10px 0 6px}
.goal .bar i{display:block;height:100%;border-radius:5px}
.goal .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart svg{width:100%;height:auto;display:block}
.chart .m{cursor:pointer}
.chart .m:hover rect.bg{fill:var(--card2)}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:.92em}
.hbar .tr{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px}
.hbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{text-align:center;margin-top:22px}

/* bottom bar + add button (phones) */
.bnav{display:none}
.fab{display:none}
@media (max-width:699px){
  .tabs{display:none}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7em;font-weight:700;color:var(--muted);padding:4px 0}
  .bnav button svg{width:22px;height:22px}
  .bnav button.on{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;
    border:none;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:#0a0c1499;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:22px;max-height:88vh} .sheet::before{display:none} }
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 14px;font-size:1.2em;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto}
.sheet h4{margin:20px 0 8px;font-size:.74em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;padding:0;flex:none}
.ib:hover{border-color:var(--accent)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:.84em;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input:not([type=checkbox]):not([type=radio]):not([type=file]),.f select,.inp{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.f input.amount{font-size:1.6em;font-weight:800;text-align:right}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:8px 4px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px #0002}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 11px;font-size:.9em;font-weight:600}
.chip2.on{border-color:var(--accent);background:var(--accent-soft);font-weight:800}
.check{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.box{background:var(--card2);border-radius:14px;padding:12px;margin:8px 0 14px}
.sheet .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet .actions .btn{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--text)}
.catrow{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;margin-bottom:8px}
.catrow input{text-align:center}
.catrow input+input{text-align:left}
.limrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;margin-bottom:8px}
.limrow input{text-align:right}
.brow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;width:100%;background:var(--card);text-align:left}
.brow.on{border-color:var(--accent);background:var(--accent-soft)}
.brow .main{flex:1}
.code{font-family:ui-monospace,Consolas,monospace;font-size:.86em;word-break:break-all;background:var(--card2);padding:8px 10px;border-radius:10px;display:block}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:14px;z-index:40;font-weight:700;max-width:90vw;box-shadow:0 6px 20px #0004}
.toast[hidden]{display:none}

/* login */
.loginbg{min-height:100vh;background:linear-gradient(150deg,var(--head1),var(--head2));padding:12vh 16px 0}
.login{max-width:380px;margin:0 auto;background:var(--card);border-radius:24px;padding:26px 22px;box-shadow:0 20px 50px #0003}
.login .logo{width:58px;height:58px;border-radius:16px;margin-bottom:10px}
.err{color:var(--bad);font-size:.9em;min-height:1.2em;margin:4px 0 8px}
.demo{background:#00000030;color:#fff;font-size:.78em;font-weight:700;text-align:center;padding:5px 10px}

/* ---------- v2 layout (template-inspired, same colours) ---------- */
.segpill{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow);margin:0 auto 14px;max-width:420px}
.segpill button{flex:1;border:none;background:none;border-radius:999px;padding:9px 6px;font-weight:700;color:var(--muted)}
.segpill button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.gaugecard{text-align:center;padding-bottom:14px}
.gaugecard svg{width:100%;max-width:340px;height:auto;display:block;margin:4px auto 0}
.gaugecard .gl{font-weight:700;color:var(--muted);font-size:.86em;margin-top:-58px}
.gaugecard .gv{font-size:2.15em;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.gaugecard .gs{color:var(--muted);font-size:.82em;margin-top:2px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:16px;font-size:.8em;font-weight:600;color:var(--muted)}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.mbar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;margin:10px 0 8px}
.mbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#7dd3fc))}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow .k{font-size:.8em;color:var(--muted);font-weight:700}
.mrow .v{font-weight:800;font-size:1.15em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}

};

/* ---------- defaults & options ---------- */
const ACCENTS = { indigo: "#5b5fd6", teal: "#0d9488", blue: "#2563eb", green: "#16a34a", purple: "#8b5cf6", rose: "#e11d48", orange: "#ea580c", graphite: "#475569" };
const CURRENCIES = ["EUR", "USD", "GBP", "CHF", "SEK", "NOK", "DKK", "PLN", "CZK", "HUF", "RON", "BAM", "RSD", "CAD", "AUD"];
const NUMSTYLES = { dot: ["de-DE", "1.234,56"], comma: ["en-GB", "1,234.56"], space: ["fr-FR", "1 234,56"] };
const PALETTE = ["#6366f1", "#14b8a6", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#0ea5e9", "#f97316", "#22c55e", "#84cc16", "#06b6d4", "#a855f7", "#64748b", "#d946ef"];
const DEFAULT_CATS = [
  ["in", "💼", "Salary"], ["in", "🏖️", "Pension"], ["in", "🎁", "Gifts & extra"], ["in", "📥", "Other income"],
  ["out", "🏠", "Housing"], ["out", "💡", "Utilities"], ["out", "📱", "Phone & internet"], ["out", "🛡️", "Insurance"],
  ["out", "🚗", "Car & transport"], ["out", "🛒", "Groceries"], ["out", "🍽️", "Eating out"], ["out", "📺", "Subscriptions"],
  ["out", "💊", "Health"], ["out", "🏦", "Loans"], ["out", "🎉", "Fun & hobbies"], ["out", "👕", "Clothes"], ["out", "📦", "Other"],
].map(([kind, emoji, name], i) => ({ id: "c" + i, kind, emoji, name, color: PALETTE[i % PALETTE.length] }));
const TYPES = { income: "Income", bill: "Bill", spend: "Spending" };

/* ---------- demo store (no Firebase): same API as Cloud, kept in this browser ---------- */
function makeLocalStore() {
  const K = "budget.demo.v1";
  let db = null; try { db = JSON.parse(localStorage.getItem(K)); } catch {}
  db = db || { profile: {}, budgets: {}, items: {}, months: {} };
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch {} subs.forEach(f => f()); };
  const on = f => { subs.add(f); setTimeout(f); return () => subs.delete(f); };
  const clone = o => JSON.parse(JSON.stringify(o ?? null));
  const merge = (t, p) => { for (const [k, v] of Object.entries(p)) {
    if (v === null) delete t[k];
    else if (v && typeof v === "object" && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== "object") t[k] = {}; merge(t[k], v); }
    else t[k] = v; } return t; };
  const listOf = o => Object.entries(o || {}).map(([id, x]) => ({ ...clone(x), id }));
  const ok = Promise.resolve();
  return {
    version: APP_VERSION,
    watchProfile: cb => on(() => cb(clone(db.profile))),
    saveProfile: p => { merge(db.profile, p); persist(); return ok; },
    watchBudgets: cb => on(() => cb(listOf(db.budgets), { fromCache: false })),
    createBudget: d => { const id = rid(); db.budgets[id] = { ...d, owner: "local", members: ["local"], createdAt: Date.now() }; persist(); return { id, done: ok }; },
    updateBudget: (b, p) => { merge(db.budgets[b], p); persist(); return ok; },
    replaceBudgetField: (b, f, v) => { db.budgets[b][f] = clone(v); persist(); return ok; },
    deleteBudget: b => { delete db.budgets[b]; delete db.items[b]; delete db.months[b]; persist(); return ok; },
    leaveBudget: () => ok,
    watchBudget: (b, o) => on(() => { const it = db.items[b] || {}; o.entries(listOf(it.entries)); o.months(clone(db.months[b] || {})); o.goals(listOf(it.goals)); }),
    saveItem: (b, c, id, d) => { id = id || rid(); ((db.items[b] ||= {})[c] ||= {})[id] = clone(d); persist(); return { id, done: ok }; },
    deleteItem: (b, c, id) => { if (db.items[b]?.[c]) delete db.items[b][c][id]; persist(); return ok; },
    setMonth: (b, m, p) => { merge((db.months[b] ||= {})[m] ||= {}, p); persist(); return ok; },
    addActivity: (b, d) => { ((db.items[b] ||= {}).activity ||= {})[rid()] = clone(d); persist(); return ok; },
    watchActivity: (b, cb) => on(() => cb(listOf(db.items[b]?.activity).sort((x, z) => z.at - x.at).slice(0, 80))),
  };
}

/* ---------- state ---------- */
let Store = null;
const S = { user: null, profile: {}, budgets: [], bid: null, entries: [], months: {}, goals: [], month: thisMonth(), year: today().getFullYear(),
  view: "month", sub: "summary", hide: false, activity: [], ready: false, loaded: false, dataStamp: 0 };
let unsub = [], unsubBudget = null, creatingPersonal = false;
const B = () => S.budgets.find(b => b.id === S.bid);
const look = () => ({ theme: "auto", accent: "indigo", size: "normal", start: "month", hideOnStart: false, billSort: "due", ...(S.profile.look || {}) });
const cats = () => (B()?.categories?.length ? B().categories : DEFAULT_CATS);
const cat = id => cats().find(c => c.id === id) || { id, emoji: "📦", name: "Other", color: "#64748b" };
const {
  num, r2, sum, monthItems, goalMoves, firstMonth, totals, carryIn,
  limitsFor, safeToSpend, outByCat, forecast, billsPlan, goalSaved, goalMonths, clearCarryCache,
} = makeBudgetCalculations({ state: S, budget: B, category: cat, today, thisMonth });
const w = p => { (p && p.catch ? p : Promise.resolve()).catch(e => { console.error(e); toast("Couldn't save: " + (e.code || e.message || e)); }); return p; };
const myName = () => S.profile.name || (S.user?.email || "").split("@")[0] || "Me";
const whoName = uid => uid === S.user?.uid ? "you" : (B()?.memberNames?.[uid] || "someone");
const nameOf = uid => uid === S.user?.uid ? myName() : (B()?.memberNames?.[uid] || "Someone");
function avatar(uid) {
  const n = nameOf(uid); let h = 0; for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="av" style="background:${PALETTE[h % PALETTE.length]}" title="${esc(n)}">${esc(n.trim().slice(0, 1).toUpperCase() || "?")}</span>`;
}

function money(n, opt = {}) {
  const b = B() || {};
  const loc = (NUMSTYLES[b.numStyle] || NUMSTYLES.dot)[0];
  let f;
  try { f = new Intl.NumberFormat(loc, { style: "currency", currency: b.currency || "EUR", minimumFractionDigits: opt.round ? 0 : 2, maximumFractionDigits: opt.round ? 0 : 2 }); }
  catch { f = new Intl.NumberFormat(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  const v = opt.abs ? Math.abs(n) : n;
  if (opt.raw) return f.format(v);
  const html = f.formatToParts(v).map(p => p.type === "decimal" || p.type === "fraction" ? `<small>${esc(p.value)}</small>` : esc(p.value)).join("");
  return `<span class="money">${html}</span>`;
}

/* ---------- budget maths ---------- */
// short, plain-language observations from the budget's own numbers (max 4)
function insights(m) {
  const out = [], cur = outByCat(m), pm = mk(mi(m) - 1), prev = outByCat(pm), t = totals(m), p = totals(pm);
  const hasPrev = Object.keys(prev).length > 0, R = v => money(Math.abs(v), { round: true });
  if (hasPrev) {
    const diffs = [...new Set([...Object.keys(cur), ...Object.keys(prev)])].map(id => ({ id, d: r2((cur[id] || 0) - (prev[id] || 0)), was: prev[id] || 0 }));
    const up = diffs.filter(x => x.d >= 20 && (x.was === 0 || x.d / x.was >= .1)).sort((a, z) => z.d - a.d)[0];
    const down = diffs.filter(x => x.d <= -20 && x.was > 0 && -x.d / x.was >= .1).sort((a, z) => a.d - z.d)[0];
    if (up) out.push({ key: "up:" + up.id, icon: "📈", tone: "warn", html: `Spending on <b>${esc(cat(up.id).name)}</b> is ${R(up.d)} higher than last month.` });
    if (down) out.push({ key: "down:" + down.id, icon: "📉", tone: "good", html: `Spending on <b>${esc(cat(down.id).name)}</b> is ${R(down.d)} lower than last month.` });
    const pct = change(t.out, p.out);
    if (pct != null && Math.abs(pct) >= 5) out.push({ key: "out", icon: pct < 0 ? "✅" : "⚠️", tone: pct < 0 ? "good" : "warn", html: `Everything going out is <b>${pct < 0 ? "down" : "up"} ${Math.abs(pct)}%</b> on last month.` });
    const sv = r2(t.saved - p.saved);
    if (sv >= 20) out.push({ key: "saved", icon: "🐷", tone: "good", html: `You've saved <b>${R(sv)} more</b> than last month.` });
  }
  for (const L of limitsFor(m)) {
    const f = L.used / L.limit;
    if (f > 1) out.push({ key: "over:" + L.id, icon: "🚦", tone: "bad", html: `<b>${esc(L.c.name)}</b> is ${R(L.used - L.limit)} over its limit.` });
    else if (f >= .8) out.push({ key: "near:" + L.id, icon: "⏳", tone: "warn", html: `You're at <b>${Math.round(f * 100)}%</b> of your ${esc(L.c.name)} limit.` });
  }
  const top = Object.entries(cur).sort((a, z) => z[1] - a[1])[0];
  if (top && t.out > 0) out.push({ key: "top:" + top[0], icon: "🏠", tone: "", html: `<b>${esc(cat(top[0]).name)}</b> takes ${Math.round(top[1] / t.out * 100)}% of everything going out this month.` });
  // the one that leads to a decision comes first: where this month is heading
  const fc = forecast(m);

function timeAgo(at) {

    off += s.v / tot * c; return a; }).join("");

// half-circle gauge: segments [{v, color, t}] out of `total`; the rest of the arc stays grey
function gauge(segs, total) {
  const cx = 160, cy = 160, r = 128, sw = 24, gap = (sw / r) + 0.05;
  const P = t => { const a = Math.PI * (1 - t); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const arc = (t0, t1, color, title) => { if (t1 - t0 <= 0.001) return ""; const [x0, y0] = P(t0), [x1, y1] = P(t1);
    return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"><title>${esc(title || "")}</title></path>`; };
  const tot = Math.max(total, sum(segs, s => s.v), 1), g = gap / Math.PI;
  let t = 0, out = "";
  const vis = segs.filter(s => s.v > 0);
  vis.forEach((s, i) => { const len = s.v / tot; const a = t + (i ? g / 2 : 0), z = t + len - (i < vis.length - 1 || t + len < 1 ? g / 2 : 0);
    out += z > a ? arc(a, z, s.color, s.t) : arc(a, a + 0.002, s.color, s.t); t += len; });
  return `<svg viewBox="0 0 320 178" role="img" aria-label="Where this month's money goes">${arc(0, 1, "var(--card2)")}${out}</svg>`;
}

function renderMonth() {

function renderSummary(m, t, items, l, b) {

  </div>`;

  // one clear bar: how much of the money is used

  const moneyCard = `<div class="card">
    <div class="ttl"><b>This month's money</b><span class="muted small">${Math.round(frac * 100)}% used</span></div>
    <div class="mrow"><span><span class="k">Going out</span><br><span class="v">${money(used)}</span></span><span style="text-align:right"><span class="k">Coming in</span><br><span class="v">${money(pot)}</span></span></div>

    <div class="small" style="font-weight:600">${t.left >= 0 ? `<b class="good">${money(t.left)}</b> left after bills, spending and savings.` : `<b class="bad">${money(-t.left)}</b> more going out than coming in.`}</div>
  </div>`;

  // two key numbers
  const topCat = (() => { const by = {}; for (const i of items) if (!i.skipped && i.type === "spend") by[i.category] = (by[i.category] || 0) + i.amt; const e = Object.entries(by).sort((a, z) => z[1] - a[1])[0]; return e && { c: cat(e[0]), v: e[1], id: e[0] }; })();
  const topPrev = topCat ? sum(prevItems.filter(i => !i.skipped && i.type === "spend" && i.category === topCat.id), i => i.amt) : 0;
  const kpis = `<div class="kpis">
    <div class="kpi"><div class="kh"><span>🧾</span>Still to pay</div><div class="kv ${t.unpaid ? "warn" : t.billCount ? "good" : ""}">${t.unpaid ? money(t.unpaid) : t.billCount ? "All paid ✓" : "No bills yet"}</div><div class="ks">${t.unpaidCount ? `${t.unpaidCount} of ${t.billCount} bills` : t.billCount ? `${t.billCount} bills paid` : "no bills"}</div></div>
    ${isNow ? `<div class="kpi"><div class="kh"><span>💳</span>Safe to spend</div><div class="kv">${money(safeToSpend(m).perDay)}</div><div class="ks">a day · ${daysLeft} day${daysLeft > 1 ? "s" : ""} left</div></div>`
      : topCat ? `<div class="kpi"><div class="kh"><span>🏆</span>Top spending</div><div class="kv" style="font-size:1.05em">${esc(topCat.c.emoji)} ${esc(topCat.c.name)}</div><div class="ks">${money(topCat.v, { round: true })} ${chip(change(topCat.v, topPrev), true)}</div></div>`

  const upCard = up.length ? `<div class="card"><div class="ttl"><b>${isNow ? "Upcoming payments" : "Bills"}</b><button class="lk" data-act="sub" data-v="details">See all</button></div>
    ${up.map(i => { const c = cat(i.category); return `<div class="row2" data-act="edit" data-id="${esc(i.id)}"><span class="ci" style="background:${c.color}1f">${esc(c.emoji)}</span>
      <span class="mn"><b>${esc(i.name)}</b><span>${i.auto ? "Autopay" : "Pay by hand"}${i.due ? " · " + ord(i.due) : ""}</span></span>
      <span class="rt"><b>${money(i.amt)}</b>${status(i)}</span></div>`; }).join("")}</div>` : "";

  // categories (with limits folded in): top 4
  const byCat = {}, byPrev = {};
  for (const i of items) if (!i.skipped && i.type !== "income") byCat[i.category] = r2((byCat[i.category] || 0) + i.amt);
  for (const i of prevItems) if (!i.skipped && i.type !== "income") byPrev[i.category] = r2((byPrev[i.category] || 0) + i.amt);
  const L = b?.limits || {};
  const catIds = [...new Set([...Object.keys(byCat), ...Object.keys(L).filter(k => num(L[k]) > 0)])]

  const healthy = lims.filter(x => x.used <= x.limit * .85).length;
  const catRow = id => { const c = cat(id), v = byCat[id] || 0, lim = num(L[id]);
    const sub = lim ? (v <= lim ? `${money(lim - v)} left to spend` : `<span class="bad">${money(v - lim)} over the limit</span>`) : byPrev[id] ? `${money(byPrev[id], { round: true })} last month` : "new this month";
    const col = !lim ? c.color : v > lim ? "var(--bad)" : v >= lim * .85 ? "var(--warn)" : "var(--accent)";
    return `<div class="row2" data-act="${lim ? "limits" : "sub"}" data-v="details"><span class="ci" style="background:${c.color}1f">${esc(c.emoji)}</span>
      <span class="mn"><b>${esc(c.name)}</b><span>${sub}</span>${lim ? `<div class="thin"><i style="width:${Math.min(100, v / lim * 100)}%;background:${col}"></i></div>` : ""}</span>
      <span class="rt"><b>${money(v)}</b>${chip(change(v, byPrev[id] || 0), true)}</span></div>`; };
  const catCard = catIds.length ? `<div class="card"><div class="ttl"><b>Categories</b>${lims.length ? `<span class="chip ${healthy === lims.length ? "good" : "bad"}" style="margin:0 auto 0 8px">${healthy}/${lims.length} limits on track</span>` : ""}<button class="lk" data-act="allcats">See all</button></div>
    ${catIds.slice(0, 4).map(catRow).join("")}
    ${lims.length ? "" : `<button class="btn sm" style="margin-top:8px" data-act="limits">+ Set a spending limit</button>`}</div>` : "";

  // one savings goal: the one with a date soonest, otherwise the closest to its target
  const gs = S.goals.filter(g => num(g.target) > goalSaved(g));
  const g = gs.sort((a, z) => (a.by || "9999") .localeCompare(z.by || "9999") || goalSaved(z) / num(z.target) - goalSaved(a) / num(a.target))[0];
  const goalCard = g ? `<div class="card goalmini" data-act="tab" data-v="goals" style="cursor:pointer"><div class="ttl"><b>🎯 Savings goal</b><span class="muted small">${Math.round(goalSaved(g) / num(g.target) * 100)}%</span></div>
    <div class="mrow"><span style="font-weight:700">${esc(g.emoji || "🐷")} ${esc(g.name)}</span><span class="v" style="font-size:1em">${money(goalSaved(g), { round: true })} <span class="muted small">of ${money(num(g.target), { round: true })}</span></span></div>
    <div class="mbar"><i style="width:${Math.min(100, goalSaved(g) / num(g.target) * 100)}%;background:${g.color || "var(--save)"}"></i></div>
    <div class="small muted" style="font-weight:600">You're ${money(num(g.target) - goalSaved(g), { round: true })} away from reaching it${g.by ? " by " + esc(monthName(g.by, { month: "short", year: "numeric" })) : ""}.</div></div>` : "";

  // month-end forecast (this month)
  const fc = forecast(m);
  const fcCard = fc ? `<div class="card"><div class="ttl"><b>🔮 Month-end forecast</b><span class="muted small">estimate</span></div>
    <div class="mrow" style="margin-bottom:6px"><span class="k">Likely left on the ${ord(daysIn(m))}</span><span class="v ${fc.end < 0 ? "bad" : "good"}" style="font-size:1.4em">${money(fc.end)}</span></div>
    <div class="fc">
      <div><span>Coming in</span><b>${money(fc.income + fc.carry)}</b></div>
      <div><span>Bills${fc.unpaid ? ` <i>(${money(fc.unpaid, { round: true })} still to pay)</i>` : ""}</span><b>− ${money(fc.bills)}</b></div>
      <div><span>Spent so far</span><b>− ${money(fc.spent)}</b></div>
      ${fc.saved ? `<div><span>Into savings</span><b>− ${money(fc.saved)}</b></div>` : ""}
      <div><span>Likely spending in the last ${fc.restDays} day${fc.restDays === 1 ? "" : "s"}</span><b>− ${money(fc.more)}</b></div>
    </div>
    <div class="muted small" style="margin-top:8px">${fc.usual != null ? `Based on your usual spending of about ${money(fc.usual, { round: true })} a month.` : `Based on how fast you've spent so far this month.`}</div></div>` : "";
  // insights
  const ins = insights(m);
  const insCard = `<div class="card"><div class="ttl"><b>💡 Insights</b></div>${ins.length ? ins.map(x => `<div class="ins t-${x.tone}"><span>${x.icon}</span><span>${x.html}</span></div>`).join("")
    : `<p class="muted small" style="margin:4px 0">Insights show up here once there's spending to look at — like which categories went up or down compared with last month.</p>`}</div>`;
  // empty states that explain themselves
  const upAny = items.some(i => i.type === "bill");
  const upEmpty = !upCard ? (upAny ? `<div class="card"><div class="ttl"><b>Upcoming payments</b><button class="lk" data-act="sub" data-v="details">See all</button></div><p class="muted small" style="margin:4px 0">All bills for ${esc(monthName(m, { month: "long" }))} are paid 🎉</p></div>`
    : `<div class="card"><div class="ttl"><b>Upcoming payments</b></div><p class="muted small" style="margin:4px 0 10px">No bills in ${esc(monthName(m, { month: "long" }))} yet. Add your regular bills once and they repeat by themselves.</p><button class="btn sm" data-act="add" data-type="bill">+ Add a bill</button></div>`) : upCard;
  const catEmpty = catCard || `<div class="card"><div class="ttl"><b>Categories</b></div><p class="muted small" style="margin:4px 0 10px">No spending recorded in ${esc(monthName(m, { month: "long" }))} yet. What you add shows up here by category, with its limit.</p><button class="btn sm" data-act="add" data-type="spend">+ Add spending</button></div>`;
  return `<div class="grid two">
    <div class="grid">${gaugeCard}${banners.join("")}${kpis}${moneyCard}${fcCard}</div>
    <div class="grid">${insCard}${upEmpty}${catEmpty}${goalCard}${b?.kind === "shared" ? `<div class="card"><div class="ttl"><b>👥 Recent activity</b>${(S.activity || []).length ? `<button class="lk" data-act="activity">See all</button>` : ""}</div>
      ${(S.activity || []).length ? S.activity.slice(0, 5).map(r => actRow(r, timeAgo(r.at))).join("") : `<p class="muted small" style="margin:4px 0">When anyone in this budget adds, changes or pays something, it shows up here.</p>`}</div>` : ""}</div>
  </div>`;
}

// month calendar: dots for bills / income / spending / savings; tap a day to see it
function renderCalendar(m, items) {
  const [y, mo] = m.split("-").map(Number), dim = daysIn(m), first = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const isNow = m === thisMonth(), td = today().getDate();
  const byDay = {}, noDay = [];
  for (const i of items) { if (i.skipped) continue; if (i.due) (byDay[Math.min(i.due, dim)] ||= []).push(i); else noDay.push(i); }
  for (const d of goalMoves(m)) { const day = +d.d.slice(8, 10); (byDay[day] ||= []).push({ type: "save", name: d.goal.name, amt: num(d.a), emoji: d.goal.emoji, goal: d.goal }); }
  if (S.calDay && S.calDay > dim) S.calDay = dim;
  const sel = S.calDay || (isNow ? td : null);
  const dot = i => i.type === "income" ? "var(--accent)" : i.type === "spend" ? "var(--spend)" : i.type === "save" ? "var(--save)"
    : (!i.paid && ((isNow && i.due < td) || m < thisMonth())) ? "var(--bad)" : "var(--out)";
  const cells = [];
  for (let k = 0; k < first; k++) cells.push(`<span></span>`);
  for (let d = 1; d <= dim; d++) { const its = byDay[d] || [];
    cells.push(`<button class="cd ${d === sel ? "sel" : ""} ${isNow && d === td ? "today" : ""}" data-act="calday" data-d="${d}"><b>${d}</b><i>${its.slice(0, 4).map(i => `<em style="background:${dot(i)}"></em>`).join("")}</i></button>`); }
  const list = sel ? (byDay[sel] || []) : [];
  const row = i => { if (i.type === "save") return `<div class="row2" data-act="gview" data-id="${esc(i.goal.id)}"><span class="ci" style="background:color-mix(in srgb,var(--save) 18%,transparent)">${esc(i.emoji || "🐷")}</span><span class="mn"><b>${esc(i.name)}</b><span>${i.amt >= 0 ? "Into savings" : "Out of savings"}</span></span><span class="rt"><b>${money(i.amt)}</b></span></div>`;
    const c = cat(i.category); return `<div class="row2" data-act="edit" data-id="${esc(i.id)}"><span class="ci" style="background:${c.color}1f">${esc(c.emoji)}</span><span class="mn"><b>${esc(i.name)}</b><span>${TYPES[i.type]}${i.type === "bill" ? (i.paid ? " · paid" : i.auto ? " · autopay" : " · to pay") : ""}</span></span><span class="rt"><b>${money(i.amt)}</b></span></div>`; };
  const selLabel = sel ? new Date(y, mo - 1, sel).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) : "";
  return `<div><div class="sec"><span>Calendar</span></div><div class="card">
    <div class="cal">${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map(w => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="dots" style="margin-top:10px"><span><i style="background:var(--out)"></i>Bill</span><span><i style="background:var(--bad)"></i>Overdue</span><span><i style="background:var(--accent)"></i>Income</span><span><i style="background:var(--spend)"></i>Spending</span><span><i style="background:var(--save)"></i>Savings</span></div>
    ${sel ? `<div class="ttl" style="margin-top:14px"><b>${esc(selLabel)}</b>${list.length ? `<span class="muted small" style="font-weight:700">${(() => { const inn = sum(list.filter(i => i.type === "income"), i => i.amt), outv = sum(list.filter(i => i.type !== "income"), i => i.amt); return [inn ? `<span class="good">+${money(inn, { raw: true })}</span>` : "", outv ? `−${money(outv, { raw: true })}` : ""].filter(Boolean).join(" · "); })()}</span>` : ""}</div>${list.length ? list.map(row).join("") : `<p class="muted small" style="margin:2px 0">Nothing on this day.</p>`}` : `<p class="muted small" style="margin:12px 0 0">Tap a day to see what's on it.</p>`}
    ${noDay.length ? `<p class="muted small" style="margin:12px 0 0"><b>No set day:</b> ${noDay.slice(0, 8).map(i => esc(i.name)).join(", ")}${noDay.length > 8 ? ` and ${noDay.length - 8} more` : ""}</p>` : ""}
  </div></div>`;
}

function renderDetails(m, t, items, l, b) {
  const inc = items.filter(i => i.type === "income").sort((a, z) => z.amt - a.amt);
  const sorters = { due: (a, z) => (a.due || 99) - (z.due || 99) || a.name.localeCompare(z.name), amount: (a, z) => z.amt - a.amt, name: (a, z) => (a.name || "").localeCompare(z.name || ""), unpaid: (a, z) => a.paid - z.paid || (a.due || 99) - (z.due || 99) };
  const bills = items.filter(i => i.type === "bill").sort(sorters[l.billSort] || sorters.due);
  const spend = items.filter(i => i.type === "spend").sort((a, z) => (z.due || 0) - (a.due || 0) || (z.createdAt || 0) - (a.createdAt || 0));
  const moves = goalMoves(m);
  const section = (title, list, type, total, id, extra = "") => `<div id="${id}"><div class="sec"><span>${title} · ${money(total, { round: true })}</span><span>${extra}<button class="lk" data-act="add" data-type="${type}">+ Add</button></span></div>
    <div class="card flat">${list.length ? list.map(i => itemRow(i, m)).join("") : `<div class="empty">Nothing here this month.</div>`}</div></div>`;
  let whoCard = "";
  if (b?.kind === "shared") {
    const by = {};
    for (const i of items) if (!i.skipped && i.type !== "income" && i.by) by[i.by] = r2((by[i.by] || 0) + i.amt);
    const rows = Object.entries(by).sort((a, z) => z[1] - a[1]);
    if (rows.length) whoCard = `<div><div class="sec">Added by</div><div class="card flat">${rows.map(([u, v]) =>
      `<div class="item" style="cursor:default">${avatar(u)}<div class="main"><div class="name">${esc(nameOf(u))}</div></div><div class="amt">${money(v)}</div></div>`).join("")}</div></div>`;
  }
  const md = S.months[m] || {};
  const glance = `<div><div class="sec"><span>${esc(monthName(m, { month: "long" }))} at a glance</span></div><div class="card"><div class="fc" style="font-size:.95em">
      <div><span>Coming in</span><b class="good">${money(t.income + t.carry)}</b></div>
      <div><span>Bills (${t.billCount - t.unpaidCount} of ${t.billCount} paid)</span><b>− ${money(t.bills)}</b></div>
      <div><span>Spending (${spend.length} item${spend.length === 1 ? "" : "s"})</span><b>− ${money(t.spend)}</b></div>
      ${t.saved ? `<div><span>Into savings</span><b>− ${money(t.saved)}</b></div>` : ""}
      <div style="border-top:1px solid var(--line);padding-top:6px"><span style="color:var(--text);font-weight:800">Left</span><b class="${t.left < 0 ? "bad" : "good"}">${money(t.left)}</b></div>
    </div></div></div>`;
  const notes = `<div><div class="sec">Notes for ${esc(monthName(m, { month: "long" }))}</div><div class="card"><textarea id="note" placeholder="Anything to remember this month…">${esc(md.note || "")}</textarea></div></div>`;
  return `<div class="grid two">
    <div class="grid">${renderCalendar(m, items)}</div>
    <div class="grid">${glance}${notes}</div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="grid">
      ${section("Bills", bills, "bill", t.bills, "billsCard", bills.length ? `<button class="lk" data-act="sort">${({ due: "By date", amount: "By amount", name: "A–Z", unpaid: "Unpaid first" })[l.billSort] || "By date"}</button>` : "")}
      ${section("Spending", spend, "spend", t.spend, "spendCard")}
    </div>
    <div class="grid">
      ${section("Income", inc, "income", t.income, "incCard", `<button class="lk" data-act="backfill" data-type="income">Earlier months</button>`)}
      ${moves.length ? `<div><div class="sec"><span>Into savings · ${money(t.saved, { round: true })}</span></div><div class="card flat">${moves.map(d => `<div class="item" data-act="gview" data-id="${esc(d.goal.id)}"><div class="emo" style="background:${d.goal.color || "#8b5cf6"}1f">${esc(d.goal.emoji || "🐷")}</div><div class="main"><div class="name">${esc(d.goal.name)}</div><div class="meta">${esc(new Date(d.d).toLocaleDateString("en-GB", { day: "numeric", month: "short" }))}${b?.kind === "shared" && d.by ? " · by " + esc(whoName(d.by)) : ""}</div></div><div class="amt">${money(num(d.a))}</div></div>`).join("")}</div></div>` : ""}
      ${whoCard}
    </div>
  </div>`;
}

function renderYear() {
  const cy = today().getFullYear();
  const y = S.year, ms = Array.from({ length: 12 }, (_, i) => y + "-" + pad(i + 1)), cur = thisMonth();
  const T = ms.map(m => ({ m, ...totals(m) }));
  const P = Array.from({ length: 12 }, (_, i) => totals((y - 1) + "-" + pad(i + 1)));
  const inc = sum(T, t => t.income), out = sum(T, t => t.out), saved = sum(T, t => t.saved);
  const fm = firstMonth(), fullPrev = fm && fm <= (y - 1) + "-01";
  const pinc = fullPrev ? sum(P, t => t.income) : 0, pout = fullPrev ? sum(P, t => t.out) : 0;
  const past = T.filter(t => t.m <= cur);
  // small bars: income per month (current month highlighted)
  const mini = (vals, colorOn, key) => { const mx = Math.max(...vals.map(v => v.v), 1);
    return `<svg viewBox="0 0 240 70" style="width:100%;max-width:260px;height:auto;display:block">${vals.map((v, i) => { const h = Math.max(3, v.v / mx * 52), x = i * 20 + 3;
      return `<g class="m" data-act="ymonth" data-m="${v.m}" style="cursor:pointer" data-tip="${esc(monthName(v.m) + "\nIncome: " + money(v.v, { raw: true }))}"><rect x="${x}" y="${56 - h}" width="14" height="${h}" rx="5" fill="${v.m === cur ? colorOn : v.m > cur ? "var(--card2)" : `color-mix(in srgb,${colorOn} 28%,var(--card2))`}"/>
        <text x="${x + 7}" y="68" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-weight="${v.m === cur ? 800 : 600}">${monthName(v.m, { month: "narrow" })}</text></g>`; }).join("")}</svg>`; };
  const W = 720, H = 300, pb = 34, cw = W / 12, bw = cw * .5;
  const max = Math.max(...T.map(t => t.out), 1);
  const bars = T.map((t, i) => { const x = i * cw, ho = (t.out / max) * (H - pb - 16), on = t.m === cur;
    return `<g class="m" data-act="ymonth" data-m="${t.m}" data-tip="${esc(`${monthName(t.m)}\nIn: ${money(t.income, { raw: true })}\nOut: ${money(t.out, { raw: true })}\nLeft: ${money(t.left, { raw: true })}${t.m > cur ? "\n(planned)" : ""}`)}">
      <rect class="bg" x="${x + 2}" y="0" width="${cw - 4}" height="${H}" rx="10" fill="transparent"/>
      <rect x="${x + (cw - bw) / 2}" y="${H - pb - ho}" width="${bw}" height="${Math.max(ho, 2)}" rx="10" fill="${on ? "var(--out)" : t.m > cur ? "color-mix(in srgb,var(--out) 22%,var(--card2))" : "color-mix(in srgb,var(--out) 55%,var(--card2))"}"/>
      <text x="${x + cw / 2}" y="${H - 10}" text-anchor="middle" font-size="15" fill="${on ? "var(--text)" : "var(--muted)"}" font-weight="${on ? 800 : 600}">${monthName(t.m, { month: "short" })}</text></g>`; }).join("");
  const byCat = {};
  for (const m of ms) for (const i of monthItems(m)) if (!i.skipped && i.type !== "income") byCat[i.category] = r2((byCat[i.category] || 0) + i.amt);
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const best = past.length ? past.reduce((a, b) => b.left > a.left ? b : a) : null;
  const bigBills = {};
  for (const m of ms) for (const i of monthItems(m)) if (!i.skipped && i.type === "bill") { const o = (bigBills[i.id] ||= { name: i.name, c: i.category, v: 0 }); o.v = r2(o.v + i.amt); }
  const topBills = Object.values(bigBills).sort((a, b) => b.v - a.v).slice(0, 5);
  return `<div class="grid two">
    <div class="grid">
      <div class="card"><div class="ttl"><b>Income in ${y}</b>${pinc ? chip(change(inc, pinc), false) : ""}</div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap"><span class="gaugecard" style="padding:0"><span class="gv" style="font-size:1.7em">${money(inc, { round: true })}</span><br><span class="muted small">${pinc ? `vs ${money(pinc, { round: true })} in ${y - 1}` : `${money(inc / 12, { round: true })} a month on average`}</span></span>
        ${mini(T.map(t => ({ m: t.m, v: t.income })), "var(--accent)")}</div></div>
      <div class="kpis">
        <div class="kpi"><div class="kh"><span>↙️</span>Left over</div><div class="kv ${inc - out - saved < 0 ? "bad" : "good"}">${money(inc - out - saved, { round: true })}</div><div class="ks">after bills, spending & savings</div></div>
        <div class="kpi"><div class="kh"><span>🐷</span>Into savings</div><div class="kv">${money(saved, { round: true })}</div><div class="ks">avg ${money(past.length ? sum(past, t => t.left) / past.length : 0, { round: true })} left a month</div></div>
      </div>
      <div class="card"><div class="ttl"><b>Going out</b>${pout ? chip(change(out, pout), true) : `<span class="muted small">${y}</span>`}</div>
        <div class="gv" style="font-size:1.7em;font-weight:800">${money(out, { round: true })}</div>
        ${out > 0 ? `<div class="chart" style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money going out per month">${bars}</svg></div>` : `<p class="muted small" style="margin:8px 0 0">Nothing has gone out in ${y} yet. Once bills and spending are added, each month gets a bar here — hover over one (or tap it) to see its numbers.</p>`}
        ${best && best.left > 0 ? `<p class="muted small" style="text-align:center;margin:6px 0 0">Best month so far: <b>${monthName(best.m, { month: "long" })}</b> with ${money(best.left, { round: true })} left. Tap a month to open it.</p>` : ""}
      </div>
    </div>
    <div class="grid">
      ${(() => { const np = billsPlan(cy + 1); return `<div class="card" data-act="billplan" style="cursor:pointer"><div class="ttl"><b>🧾 Next year's bills</b><span class="lk" style="color:var(--accent);font-weight:700">Plan for them ›</span></div>
        ${np.total ? `<div class="mrow"><span class="v" style="font-size:1.4em">${money(np.total, { round: true })}</span><span class="muted small">≈ ${money(np.total / 12, { round: true })} a month</span></div><div class="muted small" style="margin-top:4px">${np.items.length} bills in ${cy + 1}. See how much to put aside each month to have it ready.</div>`
          : `<p class="muted small" style="margin:4px 0">No bills planned for ${cy + 1} yet. Bills that repeat show up here automatically.</p>`}</div>`; })()}
      <div class="card"><div class="ttl"><b>Categories</b><span class="muted small">${y}</span></div>${catRows.length ? catRows.slice(0, 7).map(([id, v]) => { const c = cat(id);
        return `<div class="row2" style="cursor:default"><span class="ci" style="background:${c.color}1f">${esc(c.emoji)}</span><span class="mn"><b>${esc(c.name)}</b><span>${Math.round(v / (out || 1) * 100)}% of everything going out</span><div class="thin"><i style="width:${v / catRows[0][1] * 100}%;background:${c.color}"></i></div></span><span class="rt"><b>${money(v, { round: true })}</b></span></div>`; }).join("") : `<p class="muted small" style="margin:4px 0">No spending categories recorded in ${y} yet. Bills and spending you add show up here, biggest first.</p>`}</div>
      <div class="card"><div class="ttl"><b>Biggest bills</b></div>${topBills.length ? topBills.map(x => { const c = cat(x.c);
        return `<div class="row2" style="cursor:default"><span class="ci" style="background:${c.color}1f">${esc(c.emoji)}</span><span class="mn"><b>${esc(x.name || c.name)}</b><span>${money(x.v / 12, { round: true })} a month on average</span></span><span class="rt"><b>${money(x.v, { round: true })}</b></span></div>`; }).join("") : `<p class="muted small" style="margin:4px 0">No bills recorded in ${y} yet. Each bill you add shows here with its total for the year.</p>`}</div>
    </div>
  </div>`;
}

function renderGoals() {
  const gs = [...S.goals].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const total = sum(gs, goalSaved), target = sum(gs, g => num(g.target));
  return `<div class="grid">
    ${gs.length ? `<div class="card gaugecard">${gauge(gs.map(g => ({ v: goalSaved(g), color: g.color || "var(--save)", t: g.name })), Math.max(target, total))}
      <div class="gl">Saved in total</div><div class="gv">${money(total)}</div>
      <div class="gs">${target ? `${Math.round(Math.min(1, total / target) * 100)}% of ${money(target, { round: true })} across ${gs.length} goal${gs.length > 1 ? "s" : ""}` : `${gs.length} goal${gs.length > 1 ? "s" : ""}`}</div></div>` : ""}
    ${gs.length ? `<div class="card" data-act="billplan" style="cursor:pointer;display:flex;align-items:center;gap:12px"><span class="emo" style="background:color-mix(in srgb,#f97316 16%,transparent)">🧾</span><span style="flex:1"><b>Plan for next year's bills</b><br><span class="muted small">How much to put aside each month so next year's bills are covered</span></span><span style="color:var(--accent);font-weight:800">›</span></div>` : ""}
    ${gs.length ? `<div class="grid two" style="align-items:stretch">${gs.map(g => {
      const s = goalSaved(g), tg = num(g.target), pct = tg ? Math.min(100, s / tg * 100) : 0;
      return `<div class="card gcard" data-act="gview" data-id="${esc(g.id)}">
        <div class="top"><span class="emo" style="background:${g.color || "#8b5cf6"}1f">${esc(g.emoji || "🐷")}</span><b>${esc(g.name)}</b>${tg && s >= tg ? "🎉" : ""}</div>

// one goal, everything about it
function openGoalView(id) {

    <div class="gaugecard" style="padding:0">${tg ? gauge([{ v: s, color: g.color || "var(--save)", t: g.name }], tg) + `<div class="gl">Saved</div>` : `<div class="gl" style="margin-top:0">Saved</div>`}
      <div class="gv">${money(s)}</div><div class="gs">${tg ? `${Math.round(Math.min(1, s / tg) * 100)}% of ${money(tg)}` : "no target set"}</div></div>

    ${(g.moves || []).length ? `<h4>History</h4><div>${[...g.moves].sort((a, b) => b.d.localeCompare(a.d)).slice(0, 12).map(d => `<div class="item" style="cursor:default"><div class="main"><div class="name">${num(d.a) >= 0 ? "Put in" : "Took out"}</div><div class="meta">${esc(new Date(d.d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }))}${d.by && B()?.kind === "shared" ? " · " + esc(whoName(d.by)) : ""}</div></div><div class="amt ${num(d.a) < 0 ? "bad" : ""}">${money(num(d.a))}</div></div>`).join("")}</div>` : ""}
    <div class="actions"><button class="btn" data-act="goal" data-id="${esc(g.id)}">Edit goal</button></div>`);
}

function openBillPlan() {
  const cur = thisMonth(), cy = today().getFullYear();
  let year = cy + 1, only = false, picked = null;
  openSheet(`${head("🧾 Plan for next year's bills")}
    <p class="muted small" style="margin-top:-6px">Adds up what your bills will cost in a year and works out how much to put aside each month so the money is there in time.</p>
    <div class="cols"><label class="f"><span>Bills of</span><select id="bpY">${[cy + 1, cy + 2, cy].map(y => `<option ${y === year ? "selected" : ""}>${y}</option>`).join("")}</select></label>
      <div class="f"><span>Which bills</span><div class="seg" id="bpO" style="margin:0"><button type="button" data-o="all" class="on">All</button><button type="button" data-o="irr">Not monthly</button></div></div></div>
    <div id="bpL"></div>
    <div class="f"><span>Have it saved by the end of</span>${monthSel("bpB", (year - 1) + "-12")}</div>
    <div id="bpR"></div>
    <div class="actions"><button class="btn pri" id="bpG">Make it a savings goal</button></div>`, sh => {
    const draw = () => {
      const plan = billsPlan(year);
      const list = plan.items.filter(x => !only || x.repeat !== "monthly");
      if (!picked) picked = new Set(plan.items.map(x => x.id));
      const total = sum(list.filter(x => picked.has(x.id)), x => x.total);
      sh.querySelector("#bpL").innerHTML = list.length ? `<div class="f"><span>${list.length} bill${list.length > 1 ? "s" : ""} in ${year} — untick any you don't want to save for</span>${list.map(x => { const c = cat(x.category);
        const when = x.repeat === "monthly" ? `every month · ${money(x.total / x.count, { round: true, raw: true })}`
          : repeatDays(x.repeat) ? `${REPEATS[x.repeat][0].toLowerCase()} · ${x.count} scheduled`
          : x.months.map(n => new Date(2000, n - 1, 1).toLocaleDateString("en-GB", { month: "short" })).join(", ");
        return `<label class="check" style="margin:0;padding:9px 0;border-top:1px solid var(--line)"><input type="checkbox" data-bp="${esc(x.id)}" ${picked.has(x.id) ? "checked" : ""}>
          <span style="flex:1;min-width:0"><b>${esc(c.emoji)} ${esc(x.name)}</b><br><span class="muted small">${esc(when)}</span></span><b>${money(x.total, { round: true })}</b></label>`; }).join("")}</div>`
        : `<p class="muted">${only ? "No bills that come less often than monthly in " + year + "." : "No bills in " + year + " yet. Add your regular bills first — repeating ones count automatically."}</p>`;
      const by = readMonthSel(sh, "bpB"), pm = perMonth(total, cur, by), even = perMonth(total, year + "-01", year + "-12");
      const n = mi(by) - mi(cur) + 1;
      sh.querySelector("#bpR").innerHTML = total > 0 ? `<div class="box">
        <div class="mrow"><span class="k">Bills to cover in ${year}</span><span class="v">${money(total)}</span></div>
        <div style="margin-top:10px;font-weight:600">${pm != null ? `Put aside <b class="good" style="font-size:1.2em">${money(pm)} a month</b> for the next ${n} month${n > 1 ? "s" : ""} (${esc(monthName(cur, { month: "short", year: "numeric" }))} – ${esc(monthName(by, { month: "short", year: "numeric" }))}) to have it all by then.` : `<span class="bad">Pick a month from now on.</span>`}</div>
        <div class="muted small" style="margin-top:8px">Or spread over ${year} itself: ${money(even)} a month — that's what these bills cost on average.</div></div>` : "";
      sh.querySelector("#bpG").disabled = !(total > 0 && pm != null);
    };
    draw();
    sh.querySelector("#bpY").onchange = ev => { year = +ev.target.value; picked = null; draw(); };
    sh.querySelector("#bpO").onclick = ev => { const b = ev.target.closest("[data-o]"); if (!b) return; only = b.dataset.o === "irr"; sh.querySelectorAll("#bpO button").forEach(x => x.classList.toggle("on", x === b)); draw(); };
    sh.querySelector("#bpL").addEventListener("change", ev => { const c = ev.target.closest("[data-bp]"); if (!c) return; c.checked ? picked.add(c.dataset.bp) : picked.delete(c.dataset.bp); draw(); });
    sh.querySelector("#bpBM").onchange = sh.querySelector("#bpBY").onchange = draw;
    sh.querySelector("#bpG").onclick = () => {
      const plan = billsPlan(year), total = sum(plan.items.filter(x => (!only || x.repeat !== "monthly") && picked.has(x.id)), x => x.total), by = readMonthSel(sh, "bpB");
      const name = `Bills ${year}`, old = S.goals.find(g => g.name === name);
      w(Store.saveItem(S.bid, "goals", old?.id || null, { ...(old ? strip(old) : { moves: [], createdAt: Date.now(), color: "#f97316" }), name, emoji: "🧾", target: total, by }).done);
      logAct("plan", { n: name, a: total });
      closeSheet(); toast(old ? `“${name}” updated` : `Savings goal “${name}” made — put money in each month`);
      S.view = "goals"; _render(); window.scrollTo(0, 0);
    };
  });
}

function openActivity() {
  const list = S.activity || [];
  const day = at => { const d = new Date(at), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    return d.toDateString() === t.toDateString() ? "Today" : d.toDateString() === y.toDateString() ? "Yesterday" : d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }); };

  for (const r of list) { const g = day(r.at); if (g !== last) { html += `<h4>${esc(g)}</h4>`; last = g; }
    html += actRow(r, new Date(r.at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })); }
  openSheet(`${head("Activity")}
    <p class="muted small" style="margin-top:-6px">Every change in “${esc(B()?.name || "")}”: who did it and when. Nobody can edit or delete this history.</p>
    ${list.length ? html : `<p class="muted">Nothing yet. Changes made from now on show up here.</p>`}
    ${list.length >= 80 ? `<p class="muted small">Showing the latest 80 changes.</p>` : ""}`);
}

/* ---------- sheets ---------- */
function openSheet(html, mount) {
  const sc = $("#scrim");
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  sc.hidden = false; document.body.classList.add("noscroll");
  const sh = sc.firstElementChild;
  mount && mount(sh);
  const f = sh.querySelector("[autofocus]"); if (f && matchMedia("(pointer:fine)").matches) f.focus();
  return sh;
}
function closeSheet() { const sc = $("#scrim"); sc.hidden = true; sc.innerHTML = ""; document.body.classList.remove("noscroll"); }
const head = t => `<h3>${t}<button class="ib x" data-close title="Close">✕</button></h3>`;
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

// categories, the ones used most recently first (up to 4), then the rest in their usual order
function recentCats(kind) {
  const all = cats().filter(c => c.kind === kind), seen = [];
  for (const e of [...S.entries].sort((a, z) => (z.updatedAt || z.createdAt || 0) - (a.updatedAt || a.createdAt || 0)))
    if ((e.type === "income") === (kind === "in") && e.category && !seen.includes(e.category) && all.some(c => c.id === e.category)) { seen.push(e.category); if (seen.length === 4) break; }
  return [...seen.map(id => all.find(c => c.id === id)), ...all.filter(c => !seen.includes(c.id))];
}
function catChips(kind, sel) {
  return recentCats(kind).map(c => `<button type="button" class="chip2 ${c.id === sel ? "on" : ""}" data-cat="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("");
}

function openEntry(id, type) {
  const e = id ? S.entries.find(x => x.id === id) : null;
  if (id && !e) return;
  const m = S.month, md = S.months[m] || {};
  const f = e ? { ...e } : { type: type || "bill", name: "", amount: "", repeat: type === "spend" ? "once" : "monthly", start: m, until: "", due: "", auto: false, note: "",
    category: (cats().find(c => c.kind === (type === "income" ? "in" : "out") && (type !== "spend" || c.name === "Groceries")) || cats().find(c => c.kind === (type === "income" ? "in" : "out")) || {}).id };
  const repeating = e && e.repeat && e.repeat !== "once";
  const showMore = !!(e && (e.until || e.note));
  const cur = (B()?.currency || "EUR");
  openSheet(`
    ${head(e ? "Edit " + TYPES[e.type].toLowerCase() : "Add")}
    <div class="segpill" id="tsel" style="box-shadow:none;background:var(--card2)">${Object.entries(TYPES).map(([k, v]) => `<button type="button" data-t="${k}" class="${f.type === k ? "on" : ""}">${v}</button>`).join("")}</div>
    <div class="amtwrap"><div class="cur">${esc(cur)}</div><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(e ? String(e.amount).replace(".", ",") : "")}" autofocus><div class="ul"></div></div>
    <label class="f"><span>Name</span><input type="text" id="fName" maxlength="60" placeholder="e.g. Rent, Electricity, Salary" value="${esc(f.name)}"></label>
    <div class="f"><span>Category</span><div class="hscroll" id="fCats"></div></div>
    <div class="f"><span id="fStartL">Date</span>${dateSel("fS", f.start, f.due)}<span class="muted small" id="fDayHint" style="display:block;margin-top:4px;font-weight:600"></span></div>
    <label class="f"><span>How often</span><select id="fRep">${Object.entries(REPEATS).map(([k, [t]]) => `<option value="${k}" ${f.repeat === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <label class="check" id="autoRow"><input type="checkbox" id="fAuto" ${f.auto ? "checked" : ""}> Autopay (direct debit) — ticks itself on the due day</label>
    <button type="button" class="more" id="moreBtn">${showMore ? "− Fewer options" : "+ More options"}</button>
    <div id="moreBox" ${showMore ? "" : "hidden"}>
      <div class="f" id="untilF"><span>Last month (leave “keeps going” if it never ends)</span>${monthSel("fU", f.until, true)}</div>
      <label class="f"><span>Note</span><input type="text" id="fNote" maxlength="120" placeholder="e.g. account number, who pays it" value="${esc(f.note || "")}"></label>
    </div>
    ${repeating ? `<h4>Just for ${esc(monthName(m))}</h4><div class="box">
      <p class="muted small" id="fMonthHint" hidden>Changes here apply to every occurrence in this month.</p>
      <label class="f" style="margin-bottom:8px"><span>Different amount this month only</span><input type="text" id="fOver" inputmode="decimal" placeholder="usual: ${esc(money(num(e.amount), { raw: true }))}" value="${md.amounts?.[e.id] != null ? esc(String(md.amounts[e.id]).replace(".", ",")) : ""}"></label>
      <label class="check" style="margin:0"><input type="checkbox" id="fSkip" ${md.skip?.[e.id] ? "checked" : ""}> Skip it this month</label></div>` : ""}
    <div class="actions"><button class="btn pri" id="save">Save</button></div>
    ${e ? `<div class="actions">${repeating && m > e.start ? `<button class="btn" id="stop">Stop from ${esc(monthName(m, { month: "short" }))} on</button>` : ""}<button class="btn dang" id="del">Delete${repeating ? " from every month" : ""}</button></div>` : ""}
  `, sh => {
    const sync = () => {
      sh.querySelectorAll("#tsel button").forEach(b => b.classList.toggle("on", b.dataset.t === f.type));
      const kind = f.type === "income" ? "in" : "out";
      if (!cats().some(c => c.id === f.category && c.kind === kind)) f.category = (cats().find(c => c.kind === kind) || {}).id;
      const box = sh.querySelector("#fCats"), keep = box.scrollLeft;
      box.innerHTML = catChips(kind, f.category); box.scrollLeft = keep;
      sh.querySelector("#autoRow").style.display = f.type === "bill" ? "" : "none";
      const frequency = sh.querySelector("#fRep").value;
      const rep = frequency !== "once", weekly = !!repeatDays(frequency);
      const day = sh.querySelector("#fSD");
      day.options[0].disabled = weekly;
      day.required = weekly;
      const monthHint = sh.querySelector("#fMonthHint");
      if (monthHint) monthHint.hidden = !weekly;
      sh.querySelector("#untilF").style.display = rep ? "" : "none";
      sh.querySelector("#fStartL").textContent = weekly ? "First occurrence" : rep ? "Starting from" : (f.type === "bill" ? "Due date" : "Date");
      sh.querySelector("#fSDL").textContent = rep && !weekly ? (f.type === "bill" ? "Due on day" : f.type === "income" ? "Paid on day" : "On day") : "Day";
      sh.querySelector("#fDayHint").textContent = weekly ? "Choose the first date. Each occurrence uses the amount above."
        : rep ? "The day is optional. It repeats on that day each time." : "The day is optional. Leave it on “—” to just use the month.";
    };
    sync();
    const sel = sh.querySelector("#fCats .on"); if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
    sh.querySelector("#tsel").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; f.type = b.dataset.t;
      if (!e) sh.querySelector("#fRep").value = f.type === "spend" ? "once" : "monthly"; sync(); };
    sh.querySelector("#fRep").onchange = sync;
    sh.querySelector("#fSM").onchange = sh.querySelector("#fSY").onchange = () => { fixDays(sh, "fS"); sync(); };
    sh.querySelector("#moreBtn").onclick = () => { const mb = sh.querySelector("#moreBox"); mb.hidden = !mb.hidden; sh.querySelector("#moreBtn").textContent = mb.hidden ? "+ More options" : "− Fewer options"; };
    sh.querySelector("#fCats").onclick = ev => { const b = ev.target.closest("[data-cat]"); if (!b) return; f.category = b.dataset.cat; sync(); };
    sh.querySelector("#save").onclick = () => {
      const amount = num(sh.querySelector("#fAmt").value);
      if (!amount) { toast("Enter an amount"); sh.querySelector("#fAmt").focus(); return; }
      const repeat = sh.querySelector("#fRep").value;
      const start = readMonthSel(sh, "fS") || m;
      const until = repeat === "once" ? null : readMonthSel(sh, "fU");
      if (until && until < start) { toast("The last month is before the start"); return; }
      const due = parseInt(sh.querySelector("#fSD").value) || null;
      if (repeatDays(repeat) && !due) { toast("Choose the first day"); sh.querySelector("#fSD").focus(); return; }
      const data = { type: f.type, name: sh.querySelector("#fName").value.trim() || cat(f.category).name, amount, category: f.category || null,
        repeat, start, until, due, auto: f.type === "bill" && sh.querySelector("#fAuto").checked, note: sh.querySelector("#fNote").value.trim(),
        by: e?.by || S.user.uid, createdAt: e?.createdAt || Date.now(), updatedAt: Date.now() };
      w(Store.saveItem(S.bid, "entries", e?.id || null, data).done);
      if (!e) logAct("add", { n: data.name, a: amount, t: data.type });
      else if (["type", "name", "amount", "category", "repeat", "start", "until", "due", "auto", "note"].some(k => (e[k] ?? null) !== (data[k] ?? null) && !(k === "amount" && num(e.amount) === amount)))
        logAct("edit", { n: data.name, a: num(e.amount) !== amount ? amount : null, t: data.type });
      if (repeating) {
        const ov = sh.querySelector("#fOver").value.trim(), skip = sh.querySelector("#fSkip").checked;
        w(Store.setMonth(S.bid, m, { amounts: { [e.id]: ov === "" ? null : num(ov) }, skip: { [e.id]: skip ? true : null } }));
        const oldOv = md.amounts?.[e.id] ?? null, newOv = ov === "" ? null : num(ov);
        if ((oldOv == null ? null : num(oldOv)) !== newOv) logAct("month", { n: data.name, m, x: newOv == null ? "back to the usual amount" : `${money(newOv, { raw: true })} instead of ${money(amount, { raw: true })}` });
        if (!!md.skip?.[e.id] !== skip) logAct("month", { n: data.name, m, x: skip ? "skipped" : "not skipped any more" });
      }
      closeSheet();
      if (!e && !occurs(data, S.month)) toast("Added to " + monthName(start));
      else toast(e ? "Saved" : (data.repeat !== "once" ? `Added — repeats ${REPEATS[data.repeat][0].toLowerCase()}` : "Added"));
    };
    const st = sh.querySelector("#stop");
    if (st) st.onclick = () => { if (!confirm(`Stop "${e.name}" from ${monthName(m)} on? Earlier months stay as they are.`)) return;
      w(Store.saveItem(S.bid, "entries", e.id, { ...strip(e), until: mk(mi(m) - 1), updatedAt: Date.now() }).done); logAct("stop", { n: e.name, m }); closeSheet(); toast("Stopped"); };
    const dl = sh.querySelector("#del");
    if (dl) dl.onclick = () => { if (!confirm(repeating ? `Delete "${e.name}" from every month, including past ones?\n\nTip: use "Stop from … on" to keep the history.` : `Delete "${e.name}"?`)) return;
      w(Store.deleteItem(S.bid, "entries", e.id)); logAct("delete", { n: e.name, t: e.type }); closeSheet(); toast("Deleted"); };
  });
}
const strip = o => { const { id, ...r } = o; return r; };

function openQuick() {
  openSheet(`${head("Add")}

// month + year dropdowns (work the same in every browser, no typing)
function monthSel(id, val, optional, noneLabel = "— keeps going") {
  const none = optional && !val;
  const [vy, vm] = (val || thisMonth()).split("-").map(Number), cy = today().getFullYear();
  const years = []; for (let y = Math.min(vy, cy - 6); y <= Math.max(vy, cy + 6); y++) years.push(y);
  return `<div class="cols" style="gap:6px"><label class="f" style="margin:0"><select id="${id}M">${optional ? `<option value="" ${none ? "selected" : ""}>${noneLabel}</option>` : ""}${Array.from({ length: 12 }, (_, i) =>
    `<option value="${pad(i + 1)}" ${!none && i + 1 === vm ? "selected" : ""}>${new Date(2000, i, 1).toLocaleDateString("en-GB", { month: "long" })}</option>`).join("")}</select></label>
    <label class="f" style="margin:0"><select id="${id}Y">${years.map(y => `<option ${y === vy ? "selected" : ""}>${y}</option>`).join("")}</select></label></div>`;
}
const readMonthSel = (sh, id) => { const mm = sh.querySelector(`#${id}M`).value; return mm ? sh.querySelector(`#${id}Y`).value + "-" + mm : null; };
// optional day + month + year
function dateSel(id, month, day) {
  return `<div style="display:grid;grid-template-columns:minmax(74px,.7fr) 2fr;gap:6px;align-items:end">
    <label class="f" style="margin:0"><span id="${id}DL" style="font-size:.78em">Day</span><select id="${id}D"><option value="">—</option>${Array.from({ length: daysIn(month || thisMonth()) }, (_, i) =>
      `<option value="${i + 1}" ${i + 1 === Number(day) ? "selected" : ""}>${i + 1}</option>`).join("")}</select></label>
    ${monthSel(id, month)}</div>`;
}
function fixDays(sh, id) {   // keep the day list right for the chosen month (28-31 days)
  const sel = sh.querySelector(`#${id}D`), keep = sel.value, n = daysIn(readMonthSel(sh, id));
  sel.innerHTML = `<option value="">—</option>` + Array.from({ length: n }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("");
  sel.value = keep && +keep <= n ? keep : (keep ? String(n) : "");
}

// earliest start on or after `from` that keeps the item's rhythm (a quarterly bill stays on its quarters)
function openBackfill(type = "income", from) {
  let kind = type;
  const fromDefault = from || mk(mi(thisMonth()) - 6);
  openSheet(`${head("Fill in earlier months")}
    <p class="muted small" style="margin-top:-6px">Picks up what you have now and makes it count in earlier months too — handy when you start using the app mid-year and want the past months (and the Year view) to be right.</p>
    <div class="seg" id="bkT">${[["income", "Income"], ["bill", "Bills"]].map(([k, t]) => `<button type="button" data-k="${k}" class="${k === kind ? "on" : ""}">${t}</button>`).join("")}</div>
    <div class="f"><span>Count them from</span>${monthSel("bkF", fromDefault)}</div>
    <div id="bkL"></div>
    <div class="actions"><button class="btn pri" id="bkS">Fill in</button></div>`, sh => {
    const draw = () => {
      const f = readMonthSel(sh, "bkF");
      const list = S.entries.filter(e => e.type === kind && e.repeat && e.repeat !== "once" && e.start > f && (!e.until || e.until >= f))
        .sort((a, b) => num(b.amount) - num(a.amount));
      sh.querySelector("#bkL").innerHTML = list.length ? `<div class="f"><span>${kind === "income" ? "Your income" : "Your bills"} that start after ${esc(monthName(f))}</span>${list.map(e => {
        const { start } = backfillSchedule(e, f), c = cat(e.category);
        return `<label class="check" style="margin:0;padding:9px 0;border-top:1px solid var(--line)"><input type="checkbox" data-bk="${esc(e.id)}" checked>
          <span style="flex:1"><b>${esc(c.emoji)} ${esc(e.name)}</b> · ${money(num(e.amount))}<br><span class="muted small">${esc(REPEATS[e.repeat][0].toLowerCase())} · now from ${esc(monthName(e.start, { month: "short", year: "numeric" }))} → from ${esc(monthName(start, { month: "short", year: "numeric" }))}</span></span></label>`; }).join("")}</div>
        ${kind === "bill" ? `<p class="muted small">Bills in months before this one are ticked as paid.</p>` : ""}`
        : `<p class="muted">Nothing to fill in — all your repeating ${kind === "income" ? "income" : "bills"} already ${kind === "income" ? "counts" : "count"} from ${esc(monthName(f))} or earlier.</p>`;
      sh.querySelector("#bkS").disabled = !list.length;
    };
    draw();
    sh.querySelector("#bkT").onclick = ev => { const b = ev.target.closest("[data-k]"); if (!b) return; kind = b.dataset.k; sh.querySelectorAll("#bkT button").forEach(x => x.classList.toggle("on", x === b)); draw(); };
    sh.querySelector("#bkFM").onchange = draw; sh.querySelector("#bkFY").onchange = draw;
    sh.querySelector("#bkS").onclick = () => {
      const picked = [...sh.querySelectorAll("[data-bk]:checked")];
      if (!picked.length) { toast("Tick at least one"); return; }
      const cur = thisMonth();
      for (const box of picked) {
        const e = S.entries.find(x => x.id === box.dataset.bk); if (!e) continue;
        const updated = { ...e, ...backfillSchedule(e, readMonthSel(sh, "bkF")), updatedAt: Date.now() };
        w(Store.saveItem(S.bid, "entries", e.id, strip(updated)).done);
        if (e.type === "bill" && !e.auto) {
          const end = Math.min(mi(e.start), mi(cur) - 1);
          for (let i = mi(updated.start); i <= end; i++) {
            const month = mk(i);
            const existing = new Set(scheduledItems(e, month).map(item => item.paymentKey));
            const added = scheduledItems(updated, month).filter(item => !existing.has(item.paymentKey));
            const paid = Object.fromEntries(added.map(item => [item.paymentKey, true]));
            if (Object.keys(paid).length) w(Store.setMonth(S.bid, month, { paid }));
          }
        }
      }
      logAct("backfill", { m: readMonthSel(sh, "bkF"), x: `${picked.length} ${kind === "income" ? "income" : "bill"}${picked.length > 1 && kind !== "income" ? "s" : ""}` });
      closeSheet(); toast(`${picked.length} filled in from ${monthName(readMonthSel(sh, "bkF"), { month: "short", year: "numeric" })}`);
    };
  });
}
