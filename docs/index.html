// half-circle gauge: segments [{v, color, t}] out of `total`; the rest of the arc stays grey
function gauge(segs, total) {
  const cx = 160, cy = 160, r = 128, sw = 24, gap = (sw / r) + 0.05;
  const P = t => { const a = Math.PI * (1 - t); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const arc = (t0, t1, color, title) => { if (t1 - t0 <= 0.001) return ""; const [x0, y0] = P(t0), [x1, y1] = P(t1);
    return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"><title>${esc(title || "")}</title></path>`; };
  const tot = Math.max(total, sum(segs, s => s.v), 1), g = gap / Math.PI;
  let t = 0, out = "";
  const vis = segs.filter(s => s.v > 0);
  vis.forEach((s, i) => { const len = s.v / tot; const a = t + (i ? g / 2 : 0), z = t + len - (i < vis.length - 1 || t + len < 1 ? g / 2 : 0);
    out += z > a ? arc(a, z, s.color, s.t) : arc(a, a + 0.002, s.color, s.t); t += len; });
  return `<svg viewBox="0 0 320 178" role="img" aria-label="Where this month's money goes">${arc(0, 1, "var(--card2)")}${out}</svg>`;
}

function renderMonth() {
  const m = S.month, t = totals(m), items = monthItems(m), l = look(), b = B();
  if (S.categoryDetail !== null) return renderCategoryDetail(m, items, S.categoryDetail);
  if (S.sub === "transactions") return `<section class="category-detail">
    <button class="lk" data-act="sub" data-v="summary">‹ Back to Home</button><h1 class="details-heading" tabindex="-1">Transactions</h1>
    <div class="card flat">${recentTransactions(m, items).map(i => homeTransactionRow(i, m)).join("") || '<p class="muted small">No transactions this month.</p>'}</div></section>`;
  if (!S.entries.length && !S.goals.length) return `<div class="card welcome">
    <div class="e">👋</div><h2 style="margin:6px 0">Let's set up ${esc(b?.name || "your budget")}</h2>
    <p class="muted">Add your income and your regular bills once. Bills that repeat show up every month on their own — you just tick them off when they're paid.</p>
    <div class="addrow" style="justify-content:center"><button class="btn pri" data-act="add" data-type="income">+ Add income</button><button class="btn pri" data-act="add" data-type="bill">+ Add a bill</button></div></div>`;
  return S.sub === "details"
    ? `<div class="month-details"><button class="lk" data-act="sub" data-v="summary">‹ Back to Home</button>
      <h1 class="details-heading" tabindex="-1">Month Details</h1>${renderDetails(m, t, items, l, b)}${renderMonthInsights(m, t, b)}</div>`
    : renderSummary(m, t, items);
}

function recentTransactions(m, items) {
  if (m > thisMonth()) return [];
  const day = m === thisMonth() ? today().getDate() : daysIn(m);
  const orderDay = i => {
    if (i.due) return Math.min(i.due, daysIn(m));
    const added = i.createdAt ? isoDay(new Date(i.createdAt)) : "";
    return added.startsWith(m + "-") ? Number(added.slice(8)) : 0;
  };
  return items.filter(i => !i.skipped && (i.type !== "bill" || i.paid) && (!i.due || orderDay(i) <= day))
    .sort((a, b) => orderDay(b) - orderDay(a) || (b.createdAt || 0) - (a.createdAt || 0));
}

function homeTransactionRow(i, m) {
  const c = cat(i.category);
  const details = i.due ? ` · ${i.type === "bill" ? "Due " : ""}${shortBillDate(m, i.due)}` : " · No date set";
  return `<button class="home-spend-row" data-act="edit" data-id="${esc(i.id)}">
    <span class="ci" aria-hidden="true">${esc(c.emoji)}</span><span><b>${esc(i.name)}</b><br><span class="muted small">${TYPES[i.type]}${esc(details)}</span></span>
    <span>${money(i.amt)} <span aria-hidden="true">›</span></span></button>`;
}

function shortBillDate(m, day) {
  if (!day) return monthName(m, { month:"short", year:"numeric" });
  return new Date(+m.slice(0, 4), +m.slice(5) - 1, Math.min(day, daysIn(m))).toLocaleDateString("en-GB", { day:"numeric", month:"short" });
}

function nextScheduledBill(m) {
  const current = mi(m);
  const candidates = new Set(Array.from({ length:12 }, (_, index) => current + index + 1));
  for (const e of S.entries) if (e.type === "bill" && e.start && mi(e.start) > current + 12) candidates.add(mi(e.start));
  for (const index of [...candidates].sort((a, b) => a - b)) {
    const month = mk(index);
    const bill = monthItems(month).filter(i => i.type === "bill" && !i.skipped && !i.paid)
      .sort((a, b) => (a.due || 99) - (b.due || 99))[0];
    if (bill) return { month, bill };
  }
  return null;
}

function renderSpendingPace(m, items) {
  const p = spendingPace(m, items), target = p.comparison?.label === "Monthly target";
  const line = p.comparison?.values || [];
  const low = Math.min(0, ...p.actual, ...line), high = Math.max(1, ...p.actual, ...line);
  const interval = (high - low) / 3;
  const magnitude = Math.max(1, 10 ** Math.floor(Math.log10(interval)));
  const step = magnitude * [1, 2, 5, 10].find(n => n * magnitude >= interval);
  const min = Math.floor(low / step) * step, max = Math.ceil(high / step) * step;
  const ticks = Array.from({ length:(max - min) / step + 1 }, (_, i) => max - i * step);
  const x = day => day / p.days * 100, y = value => (max - value) / (max - min) * 100;
  const path = (values, linear = false) => values.reduce((d, v, day) => day === 0
    ? `M0 ${y(v)}`
    : d + (linear ? ` L${x(day)} ${y(v)}` : ` H${x(day)} V${y(v)}`), "");
  const delta = p.difference;
  const comparisonText = delta === null ? "" : delta === 0 ? (target ? "On target to date" : "Same as last month at this point")
    : `${money(Math.abs(delta))} ${delta < 0 ? "below" : "above"} ${target ? "target to date" : "last month at this point"}`;
  return `<section class="card home-pace">
    <div class="home-card-title"><h2>Spending pace</h2>${comparisonText ? `<strong class="pace-status small ${delta > 0 ? "bad" : "good"}">${comparisonText}</strong>` : ""}</div>
    ${p.actual.length ? `<div class="pace-layout muted small">
      <div class="pace-scale" aria-hidden="true">${S.hide ? "" : ticks.map(v => `<span>${esc(money(v, { raw:true, round:true }))}</span>`).join("")}</div>
      <div class="pace-plot">
        <svg class="home-pace-chart" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Cumulative spending from dated transactions">
          <defs><linearGradient id="pace-fill" x2="0" y2="1"><stop stop-color="var(--accent)" stop-opacity=".28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity=".03"/></linearGradient></defs>
          ${ticks.map(v => `<line x1="0" x2="100" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join("")}
          <path d="${path(p.actual)} V${y(0)} H0 Z" fill="url(#pace-fill)"/>
          ${line.length ? `<path d="${path(line, target)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>` : ""}
          <path d="${path(p.actual)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
        <span class="pace-marker" style="left:${x(p.through)}%;top:${y(p.actual.at(-1))}%" aria-hidden="true"></span>
      </div>
      <div class="pace-dates" aria-hidden="true">${[1, 8, 15, 22, p.days].map((day, i) => `<span style="left:${x(i === 0 ? 0 : day)}%">${day} ${esc(monthName(m, { month:"short" }))}</span>`).join("")}</div>
    </div>
    <div class="pace-caption muted small"><span class="pace-key">Dated spending · ${money(p.actual.at(-1))}</span>${p.comparison ? `<span class="pace-key pace-reference">${p.comparison.label}</span>` : "<span>No dated comparison for this point last month</span>"}</div>`
    : '<p class="muted small">Add dates to spending entries to see how it builds through the month.</p>'}
    ${p.undated || (p.comparison && p.priorUndated) ? '<p class="pace-note muted small">Entries without a date are included in the monthly total, but left out of this chart.</p>' : ""}
  </section>`;
}

function renderSummary(m, t, items) {
  const upcoming = items.filter(i => i.type === "bill" && !i.skipped && !i.paid)
    .sort((a, b) => (a.due || 99) - (b.due || 99)).slice(0, 3);
  const safe = safeToSpend(m);
  const next = upcoming.length ? null : nextScheduledBill(m);
  const recent = recentTransactions(m, items).slice(0, 4);
  const spending = {};
  for (const i of items) if (i.type === "spend" && !i.skipped) spending[i.category] = r2((spending[i.category] || 0) + i.amt);
  const categories = Object.entries(spending).filter(([, value]) => value > 0).sort((a, b) => b[1] - a[1]);
  const top = categories.slice(0, 3);
  const goal = S.goals.filter(g => num(g.target) > 0 && goalSaved(g) < num(g.target))
    .sort((a, b) => (a.by || "9999").localeCompare(b.by || "9999"))[0];
  const billRows = upcoming.map(i => {
    const c = cat(i.category);
    const date = i.due ? new Date(+m.slice(0, 4), +m.slice(5) - 1, Math.min(i.due, daysIn(m)))
      .toLocaleDateString("en-GB", { day:"numeric", month:"short" }) : "No date";
    const late = m < thisMonth() || (m === thisMonth() && i.due && Math.min(i.due, daysIn(m)) < today().getDate());
    return `<div class="home-bill">
      <button class="home-bill-name" data-act="edit" data-id="${esc(i.id)}"><span class="ci" aria-hidden="true">${esc(c.emoji)}</span>
        <span><b>${esc(i.name)}</b><span class="muted small" title="${esc(dueText(i, m))}">${esc(date)}${late ? " · Overdue" : ""}</span></span></button>
      <span class="home-bill-date muted small" title="${esc(dueText(i, m))}">${esc(date)}${late ? ' <span class="bad">Overdue</span>' : ""}</span>
      <b>${money(i.amt)}</b><button class="home-pay" data-act="pay" data-id="${esc(i.paymentKey)}"
        aria-label="Mark ${esc(i.name)} on ${esc(date)} as paid" title="Mark as paid"></button>
    </div>`;
  }).join("");
  return `<div class="home-grid">
    <section class="card home-hero">
      <div class="hero-caption">Left after bills</div>
      <h1 class="${t.afterBills < 0 ? "bad" : ""}">${money(t.afterBills)}</h1>
      <div class="hero-totals"><span>Income <b>${money(t.income)}</b></span><span>Bills <b>${money(t.bills)}</b></span>
        ${t.carry ? `<span>Carried over <b>${money(t.carry)}</b></span>` : ""}</div>
      <button class="lk home-details-button" data-act="sub" data-v="details">View month details <span aria-hidden="true">→</span></button>
    </section>
    <div class="home-metrics">
      <button class="card home-metric home-metric-link" data-act="sub" data-v="details" data-to="billsCard" data-filter="unpaid">
        <span class="muted">Still to pay</span><strong>${money(t.unpaid)}</strong>
        <span class="muted small">${t.unpaidCount ? `${t.unpaidCount} bill${t.unpaidCount === 1 ? "" : "s"} outstanding` : t.billCount ? "All bills paid" : "No bills this month"}</span>
        <span class="home-metric-chevron" aria-hidden="true">›</span>
      </button>
      <section class="card home-metric">
        <span class="muted">${safe ? "Safe to spend" : "Left after everything"}</span>
        <strong>${money(safe ? safe.perDay : t.left)}</strong>
        <span class="muted small">${safe ? `Per day · ${safe.days} day${safe.days === 1 ? "" : "s"} left` : "Bills, spending and savings included"}</span>
      </section>
    </div>
    <div class="home-stack home-primary">
    ${renderSpendingPace(m, items)}
    <section class="card home-bills ${billRows ? "" : "compact"}">
      <div class="home-card-title"><h2>${billRows ? "Upcoming bills" : t.billCount ? "All bills paid" : "No bills this month"}</h2><button class="lk" data-act="sub" data-v="details" data-to="billsCard">View bills</button></div>
      ${billRows ? `<div class="home-bill-head" aria-hidden="true"><span>Bill</span><span>Due</span><span>Amount</span><span>Paid</span></div>${billRows}`
        : next ? `<button class="home-spend-row home-next-bill" data-act="ymonth" data-m="${next.month}">
          <span class="ci" aria-hidden="true">${esc(cat(next.bill.category).emoji)}</span><span><b>${esc(next.bill.name)}</b><br><span class="muted small">Next bill · ${esc(shortBillDate(next.month, next.bill.due))}</span></span>
          <span>${money(next.bill.amt)} <span aria-hidden="true">›</span></span></button>` : ""}
    </section>
    ${goal ? `<section class="card home-goal">
      <div class="home-card-title"><h2>${esc(goal.name)}</h2><button class="lk" data-act="gview" data-id="${esc(goal.id)}">View goal</button></div>
      <b>${money(goalSaved(goal))}</b> <span class="muted small">of ${money(num(goal.target))}</span>
      <div class="mbar" aria-hidden="true"><i style="width:${Math.max(0, goalSaved(goal) / num(goal.target) * 100)}%"></i></div>
    </section>` : ""}
    </div>
    <div class="home-stack home-secondary">
    <section class="card home-spending">
      <div class="home-card-title"><h2>Spending this month</h2><b>${money(t.spend)}</b></div>
      ${top.length ? top.map(([id, value]) => {
        const c = cat(id);
        return `<button class="home-spend-row" data-act="category-detail" data-id="${esc(id)}" aria-label="View transactions for ${esc(c.name)}"><span class="ci" aria-hidden="true">${esc(c.emoji)}</span>
          <b>${esc(c.name)}</b><span>${money(value)} <span aria-hidden="true">›</span></span>
          <span class="thin" aria-hidden="true"><i style="width:${100 * value / sum(categories, row => row[1])}%"></i></span></button>`;
      }).join("") : '<p class="muted small">No spending recorded this month.</p>'}
    </section>
    <section class="card home-recent">
      <div class="home-card-title"><h2>Recent transactions</h2><button class="lk" data-act="sub" data-v="transactions">View all</button></div>
      ${recent.length ? recent.map(i => homeTransactionRow(i, m)).join("") : '<p class="muted small">No completed transactions to show this month.</p>'}
    </section>
    </div>
  </div>`;
}

const spendingOrder = (a, b) => (b.due || 0) - (a.due || 0) || (b.createdAt || 0) - (a.createdAt || 0);

function renderCategoryDetail(m, items, id) {
  const category = cat(id);
  const transactions = items.filter(i => i.type === "spend" && !i.skipped && String(i.category) === id).sort(spendingOrder);
  return `<section class="category-detail">
    <button class="lk" data-act="sub" data-v="summary">‹ Back to Home</button>
    <h1 class="details-heading" tabindex="-1">${esc(category.name)}</h1>
    <div class="card category-total"><span class="muted">Spent this month</span><div class="gv">${money(sum(transactions, i => i.amt))}</div></div>
    <h2 class="details-heading">Transactions</h2>
    <div class="card flat">${transactions.length ? transactions.map(i => itemRow(i, m)).join("") : '<p class="muted small">No transactions in this category this month.</p>'}</div>
  </section>`;
}

function flowMoney(value, signed = true) {
  return `<b class="${value > 0 ? "good" : value < 0 ? "bad" : ""}">${signed && value ? (value > 0 ? "+" : "−") : value < 0 ? "−" : ""}${money(Math.abs(value))}</b>`;
}

function renderMonthInsights(m, t, b) {
  const prev = totals(mk(mi(m) - 1));
  const pot = t.income + Math.max(0, t.carry);
  // one clear bar: how much of the money is used
  const used = t.out + t.saved, frac = pot > 0 ? Math.min(1, used / pot) : (used ? 1 : 0);
  const moneyCard = `<div class="card">
    <div class="ttl"><b>This month's money</b><span class="muted small">${Math.round(frac * 100)}% used</span></div>
    <div class="mrow"><span><span class="k">Going out</span><br><span class="v">${money(used)}</span></span><span style="text-align:right"><span class="k">Coming in</span><br><span class="v">${money(pot)}</span></span></div>
    <div class="mbar"><i style="width:${frac * 100}%;${t.left < 0 ? "background:var(--bad)" : ""}"></i></div>
    ${prev.income || prev.out ? `<div class="muted small" style="margin-bottom:6px">Last month: ${money(prev.out + prev.saved, { round: true })} out of ${money(prev.income + Math.max(0, prev.carry), { round: true })} · ${money(prev.left, { round: true })} left ${chip(change(t.left, prev.left), false)}</div>` : ""}
    <div class="small" style="font-weight:600">${t.left >= 0 ? `<b class="good">${money(t.left)}</b> left after bills, spending and savings.` : `<b class="bad">${money(-t.left)}</b> more going out than coming in.`}</div>
  </div>`;

  // month-end forecast (this month)
  const fc = forecast(m);
  const fcCard = fc ? `<div class="card balance-flow"><div class="ttl"><b>🔮 Month-end forecast</b><span class="muted small">estimate</span></div>
    <div class="mrow" style="margin-bottom:6px"><span class="k">Likely left on the ${ord(daysIn(m))}</span><span class="v ${fc.end < 0 ? "bad" : "good"}" style="font-size:1.4em">${money(fc.end)}</span></div>
    <div class="fc">
      <div><span>Coming in</span>${flowMoney(fc.income + fc.carry)}</div>
      <div><span>Bills${fc.unpaid ? ` <i>(${money(fc.unpaid, { round: true })} still to pay)</i>` : ""}</span>${flowMoney(-fc.bills)}</div>
      <div><span>Spent so far</span>${flowMoney(-fc.spent)}</div>
      ${fc.saved ? `<div><span>${fc.saved > 0 ? "Into savings" : "From savings"}</span>${flowMoney(-fc.saved)}</div>` : ""}
      <div><span>Likely spending in the last ${fc.restDays} day${fc.restDays === 1 ? "" : "s"}</span>${flowMoney(-fc.more)}</div>
    </div>
    <div class="muted small" style="margin-top:8px">${fc.usual != null ? `Based on your usual spending of about ${money(fc.usual, { round: true })} a month.` : `Based on how fast you've spent so far this month.`}</div></div>` : "";
  // insights
  const ins = insights(m);
  const insCard = `<div class="card"><div class="ttl"><b>💡 Insights</b></div>${ins.length ? ins.map(x => `<div class="ins t-${x.tone}"><span>${x.icon}</span><span>${x.html}</span></div>`).join("")
    : `<p class="muted small" style="margin:4px 0">Insights show up here once there's spending to look at — like which categories went up or down compared with last month.</p>`}</div>`;
  const limits = limitsFor(m);
  const categoriesCard = `<div class="card"><div class="home-card-title"><h2>Categories and limits</h2>
    <button class="lk" data-act="allcats">View all categories</button></div>
    ${limits.length ? limits.map(x => {
      const ratio = x.used / x.limit;
      const tone = ratio >= .95 ? "critical" : ratio >= .8 ? "close" : "";
      const label = ratio > 1 ? "Over limit" : ratio === 1 ? "At limit" : ratio >= .95 ? "Nearly at limit" : ratio >= .8 ? "Close to limit" : "On track";
      return `<div class="limit-status ${tone}">
        <div class="mrow"><b>${esc(x.c.name)}</b><span class="limit-label small">${label}</span></div>
        <div class="small muted">${money(x.used)} of ${money(x.limit)}</div>
        <div class="thin" aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, ratio * 100))}%"></i></div>
      </div>`;
    }).join("") : '<p class="muted small">No spending limits set.</p>'}
    <button class="btn sm" data-act="limits">Edit spending limits</button></div>`;
  return `<div class="grid two" style="margin-top:14px">
    <div class="grid">${moneyCard}${fcCard}${categoriesCard}</div><div class="grid">${insCard}${b?.kind === "shared" ? `<div class="card"><div class="ttl"><b>👥 Recent activity</b>${(S.activity || []).length ? `<button class="lk" data-act="activity">See all</button>` : ""}</div>
      ${(S.activity || []).length ? S.activity.slice(0, 5).map(r => actRow(r, timeAgo(r.at))).join("") : `<p class="muted small" style="margin:4px 0">When anyone in this budget adds, changes or pays something, it shows up here.</p>`}</div>` : ""}</div>
  </div>`;
}

// month calendar: dots for bills / income / spending / savings; tap a day to see it
function renderCalendar(m, items) {
  const [y, mo] = m.split("-").map(Number), dim = daysIn(m), first = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const isNow = m === thisMonth(), td = today().getDate();
  const byDay = {}, noDay = [];
  for (const i of items) { if (i.skipped) continue; if (i.due) (byDay[Math.min(i.due, dim)] ||= []).push(i); else noDay.push(i); }
  for (const d of goalMoves(m)) { const day = +d.d.slice(8, 10); (byDay[day] ||= []).push({ type: "save", name: d.goal.name, amt: num(d.a), emoji: d.goal.emoji, goal: d.goal }); }
  if (S.calDay && S.calDay > dim) S.calDay = dim;
  const sel = S.calDay || (isNow ? td : null);
  const dot = i => i.type === "income" ? "var(--accent)" : i.type === "spend" ? "var(--spend)" : i.type === "save" ? "var(--save)"
    : (!i.paid && ((isNow && i.due < td) || m < thisMonth())) ? "var(--bad)" : "var(--out)";
  const cells = [];
  for (let k = 0; k < first; k++) cells.push(`<span></span>`);
  for (let d = 1; d <= dim; d++) { const its = byDay[d] || [];
    cells.push(`<button class="cd ${d === sel ? "sel" : ""} ${isNow && d === td ? "today" : ""}" data-act="calday" data-d="${d}"><b>${d}</b><i>${its.slice(0, 4).map(i => `<em style="background:${dot(i)}"></em>`).join("")}</i></button>`); }
  const list = sel ? (byDay[sel] || []) : [];
  const row = i => { if (i.type === "save") return `<div class="row2" data-act="gview" data-id="${esc(i.goal.id)}"><span class="ci" style="background:color-mix(in srgb,var(--save) 18%,transparent)">${esc(i.emoji || "🐷")}</span><span class="mn"><b>${esc(i.name)}</b><span>${i.amt >= 0 ? "Into savings" : "Out of savings"}</span></span><span class="rt"><b>${money(i.amt)}</b></span></div>`;
    const c = cat(i.category); return `<div class="row2" data-act="edit" data-id="${esc(i.id)}"><span class="ci" style="background:${c.color}1f">${esc(c.emoji)}</span><span class="mn"><b>${esc(i.name)}</b><span>${TYPES[i.type]}${i.type === "bill" ? (i.paid ? " · paid" : i.auto ? " · autopay" : " · to pay") : ""}</span></span><span class="rt"><b>${money(i.amt)}</b></span></div>`; };
  const selLabel = sel ? new Date(y, mo - 1, sel).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) : "";
  return `<div><div class="sec"><span>Calendar</span></div><div class="card">
    <div class="cal">${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map(w => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="dots" style="margin-top:10px"><span><i style="background:var(--out)"></i>Bill</span><span><i style="background:var(--bad)"></i>Overdue</span><span><i style="background:var(--accent)"></i>Income</span><span><i style="background:var(--spend)"></i>Spending</span><span><i style="background:var(--save)"></i>Savings</span></div>
    ${sel ? `<div class="ttl" style="margin-top:14px"><b>${esc(selLabel)}</b>${list.length ? `<span class="muted small" style="font-weight:700">${(() => { const inn = sum(list.filter(i => i.type === "income"), i => i.amt), outv = sum(list.filter(i => i.type !== "income"), i => i.amt); return [inn ? `<span class="good">+${money(inn, { raw: true })}</span>` : "", outv ? `−${money(outv, { raw: true })}` : ""].filter(Boolean).join(" · "); })()}</span>` : ""}</div>${list.length ? list.map(row).join("") : `<p class="muted small" style="margin:2px 0">Nothing on this day.</p>`}` : `<p class="muted small" style="margin:12px 0 0">Tap a day to see what's on it.</p>`}
    ${noDay.length ? `<p class="muted small" style="margin:12px 0 0"><b>No set day:</b> ${noDay.slice(0, 8).map(i => esc(i.name)).join(", ")}${noDay.length > 8 ? ` and ${noDay.length - 8} more` : ""}</p>` : ""}
  </div></div>`;
}

function renderDetails(m, t, items, l, b) {
  const inc = items.filter(i => i.type === "income").sort((a, z) => z.amt - a.amt);
  const sorters = { due: (a, z) => (a.due || 99) - (z.due || 99) || a.name.localeCompare(z.name), amount: (a, z) => z.amt - a.amt, name: (a, z) => (a.name || "").localeCompare(z.name || ""), unpaid: (a, z) => a.paid - z.paid || (a.due || 99) - (z.due || 99) };
  const bills = items.filter(i => i.type === "bill").sort(sorters[l.billSort] || sorters.due);
  const spend = items.filter(i => i.type === "spend").sort(spendingOrder);
  const filteredBills = bills.filter(i => S.billFilter === "all" || (!i.skipped && i.paid === (S.billFilter === "paid")));
  const billFilters = `<div class="bill-filters" role="group" aria-label="Filter bills">${["All", "Unpaid", "Paid"].map(label => {
    const value = label.toLowerCase();
    return `<button class="btn sm" data-act="bill-filter" data-v="${value}" aria-pressed="${S.billFilter === value}">${label}</button>`;
  }).join("")}</div>`;
  const moves = goalMoves(m);
  const section = (title, list, type, total, id, extra = "", filters = "", empty = "Nothing here this month.") => `<div id="${id}" tabindex="-1"><div class="sec"><span>${title} · ${money(total, { round: true })}</span><span>${extra}<button class="lk" data-act="add" data-type="${type}">+ Add</button></span></div>
    ${filters}<div class="card flat">${list.length ? list.map(i => itemRow(i, m)).join("") : `<div class="empty">${empty}</div>`}</div></div>`;
  let whoCard = "";
  if (b?.kind === "shared") {
    const by = {};
    for (const i of items) if (!i.skipped && i.type !== "income" && i.by) by[i.by] = r2((by[i.by] || 0) + i.amt);
    const rows = Object.entries(by).sort((a, z) => z[1] - a[1]);
    if (rows.length) whoCard = `<div><div class="sec">Added by</div><div class="card flat">${rows.map(([u, v]) =>
      `<div class="item" style="cursor:default">${avatar(u)}<div class="main"><div class="name">${esc(nameOf(u))}</div></div><div class="amt">${money(v)}</div></div>`).join("")}</div></div>`;
  }
  const md = S.months[m] || {};
  const glance = `<div><div class="sec"><span>${esc(monthName(m, { month: "long" }))} at a glance</span></div><div class="card balance-flow"><div class="fc" style="font-size:.95em">
      <div><span>Coming in</span>${flowMoney(t.income + t.carry)}</div>
      <div><span>Bills (${t.billCount - t.unpaidCount} of ${t.billCount} paid)</span>${flowMoney(-t.bills)}</div>
      <div><span>Spending (${spend.length} item${spend.length === 1 ? "" : "s"})</span>${flowMoney(-t.spend)}</div>
      ${t.saved ? `<div><span>${t.saved > 0 ? "Into savings" : "From savings"}</span>${flowMoney(-t.saved)}</div>` : ""}
      <div style="border-top:1px solid var(--line);padding-top:6px"><span style="color:var(--text);font-weight:800">Left</span>${flowMoney(t.left, false)}</div>
    </div></div></div>`;
  const notes = `<div><div class="sec">Notes for ${esc(monthName(m, { month: "long" }))}</div><div class="card"><textarea id="note" placeholder="Anything to remember this month…">${esc(md.note || "")}</textarea></div></div>`;
  return `<nav class="details-shortcuts" aria-label="Jump to entries">
    <a class="lk" href="#incCard">Income</a>
    <a class="lk" href="#spendCard">Spending</a>
    <a class="lk" href="#billsCard">Bills</a>
  </nav>
  <div class="grid two details-overview">
    <div class="details-glance">${glance}</div>
    <div class="details-calendar">${renderCalendar(m, items)}</div>
    <div class="details-notes">${notes}</div>
  </div>
  <div class="grid two details-entries" style="margin-top:14px">
    <div class="grid">
      ${section(S.billFilter === "unpaid" ? "Still to pay" : S.billFilter === "paid" ? "Paid bills" : "Bills", filteredBills, "bill",
        S.billFilter === "unpaid" ? t.unpaid : S.billFilter === "paid" ? sum(filteredBills, i => i.amt) : t.bills, "billsCard",
        bills.length ? `<button class="lk" data-act="sort">${({ due: "By date", amount: "By amount", name: "A–Z", unpaid: "Unpaid first" })[l.billSort] || "By date"}</button>` : "",
        billFilters, S.billFilter === "unpaid" ? "No unpaid bills this month." : S.billFilter === "paid" ? "No paid bills this month." : undefined)}
      ${section("Spending", spend, "spend", t.spend, "spendCard")}
    </div>
    <div class="grid">
      ${section("Income", inc, "income", t.income, "incCard", `<button class="lk" data-act="backfill" data-type="income">Earlier months</button>`)}
      ${moves.length ? `<div><div class="sec"><span>Into savings · ${money(t.saved, { round: true })}</span></div><div class="card flat">${moves.map(d => `<div class="item" data-act="gview" data-id="${esc(d.goal.id)}"><div class="emo" style="background:${d.goal.color || "#8b5cf6"}1f">${esc(d.goal.emoji || "🐷")}</div><div class="main"><div class="name">${esc(d.goal.name)}</div><div class="meta">${esc(new Date(d.d).toLocaleDateString("en-GB", { day: "numeric", month: "short" }))}${b?.kind === "shared" && d.by ? " · by " + esc(whoName(d.by)) : ""}</div></div><div class="amt">${money(num(d.a))}</div></div>`).join("")}</div></div>` : ""}
      ${whoCard}
    </div>
  </div>`;
}

function yearChart(months, metric, current, average) {
  const mini = metric === "income";
  const width = 480, height = mini ? 77 : 183;
  const left = mini ? 0 : 63, right = width - 2, baseline = height - 23, top = 8;
  const stride = (right - left) / 12, barWidth = Math.min(27, stride * .64);
  const rawMax = Math.max(1, ...months.map(t => t[metric]));
  const rough = rawMax / 6, magnitude = 10 ** Math.floor(Math.log10(rough));
  const step = Math.max(1, magnitude * [1, 2, 2.5, 5, 10].find(n => n * magnitude >= rough));
  const topTick = Math.ceil(rawMax / step);
  const max = mini ? rawMax * 1.08 : step * topTick;
  const y = amount => baseline - Math.max(0, amount) / max * (baseline - top);
  const grid = mini ? "" : Array.from({ length:topTick + 1 }, (_, i) => `<line class="year-gridline" x1="${left}" x2="${right}" y1="${y(i * step)}" y2="${y(i * step)}"/>
    ${S.hide ? "" : `<text class="year-axis" x="${left - 6}" y="${y(i * step) + 4}" text-anchor="end">${esc(money(i * step, { raw:true, round:true }))}</text>`}`).join("");
  const bars = months.map((t, i) => {
    const x = left + i * stride, mid = x + stride / 2;
    const h = Math.max(2, baseline - y(t[metric]));
    const active = t.m === current, planned = t.m > current;
    const label = monthName(t.m) + (planned ? ", planned" : active ? ", in progress" : "");
    const fill = mini ? (active ? "#03b99d" : "url(#year-income-fill)") : active ? "#ed7554" : "url(#year-out-fill)";
    return `<g class="year-month ${planned ? "planned" : active ? "current" : ""}" role="button" tabindex="0"
      aria-label="Open ${esc(label)}" data-act="ymonth" data-m="${t.m}"
      data-year-tip="${esc(JSON.stringify([t.income, t.out, t.left, average]))}">
      <rect class="year-hover" x="${x + 1}" y="0" width="${stride - 2}" height="${height}" rx="6"/>
      <rect class="year-column" x="${mid - barWidth / 2}" y="${baseline - h}" width="${barWidth}" height="${h}" rx="6" fill="${fill}"/>
      <text class="year-axis" x="${mid}" y="${height - 5}" text-anchor="middle" font-weight="${active ? 800 : 600}">${monthName(t.m, { month:mini ? "narrow" : "short" })}</text>
    </g>`;
  }).join("");
  return `<svg class="year-svg" viewBox="0 0 ${width} ${height}" role="group" aria-label="${mini ? "Monthly income" : "Money going out per month"}">
    ${mini ? '<defs><linearGradient id="year-income-fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8cd6c4"/><stop offset="100%" stop-color="#449d8c"/></linearGradient></defs>'
      : '<defs><linearGradient id="year-out-fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f7baa6"/><stop offset="100%" stop-color="#ee9c83"/></linearGradient></defs>'}
    ${grid}${bars}${average !== null ? `<line class="year-avg" x1="${left}" x2="${right}" y1="${y(average)}" y2="${y(average)}"/>` : ""}
  </svg>
  <div class="year-legend muted small">
    ${months.some(t => t.m === current) ? '<span>Current month highlighted</span>' : ""}
    ${months.some(t => t.m > current) ? '<span>Outlined bars are planned</span>' : ""}
    ${average !== null ? `<span>Dashed line &middot; Completed-month average ${money(average, { round:true })}</span>` : ""}
  </div>`;
}

function renderYear() {
  const cy = today().getFullYear();
  const y = S.year, ms = Array.from({ length: 12 }, (_, i) => y + "-" + pad(i + 1)), cur = thisMonth();
  const T = ms.map(m => ({ m, ...totals(m) }));
  const P = Array.from({ length: 12 }, (_, i) => totals((y - 1) + "-" + pad(i + 1)));
  const inc = sum(T, t => t.income), out = sum(T, t => t.out), saved = sum(T, t => t.saved);
  const fm = firstMonth(), fullPrev = fm && fm <= (y - 1) + "-01";
  const pinc = fullPrev ? sum(P, t => t.income) : 0, pout = fullPrev ? sum(P, t => t.out) : 0;
  const past = T.filter(t => t.m <= cur);
  const completed = past.filter(t => fm && t.m >= fm && t.m < cur);
  const averageOut = completed.length ? sum(completed, t => t.out) / completed.length : null;
  const incomeChart = yearChart(T, "income", cur, null);
  const outChart = yearChart(T, "out", cur, averageOut);
  const byCat = {};
  for (const m of ms) for (const i of monthItems(m)) if (!i.skipped && i.type !== "income") byCat[i.category] = r2((byCat[i.category] || 0) + i.amt);
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const best = past.length ? past.reduce((a, b) => b.left > a.left ? b : a) : null;
  const bigBills = {};
  for (const m of ms) for (const i of monthItems(m)) if (!i.skipped && i.type === "bill") { const o = (bigBills[i.id] ||= { name: i.name, c: i.category, v: 0 }); o.v = r2(o.v + i.amt); }
  const topBills = Object.values(bigBills).sort((a, b) => b.v - a.v).slice(0, 5);
  return `<div class="grid two year-page">
    <div class="grid">
      <section class="card year-hero">
        <div class="ttl"><b>Income in ${y}</b>${pinc ? chip(change(inc, pinc), false) : ""}</div>
        <div class="year-total">${money(inc, { round: true })}</div>
        <div class="muted small">${pinc ? `vs ${money(pinc, { round: true })} in ${y - 1}` : `${money(inc / 12, { round: true })} a month on average`}</div>
        ${incomeChart}
      </section>
      <div class="kpis">
        <div class="kpi year-stat">${panelIcon(ICON.save)}<div><div class="kh">Left over</div><div class="kv ${inc - out - saved < 0 ? "bad" : "good"}">${money(inc - out - saved, { round: true })}</div><div class="ks">after bills, spending & savings</div></div></div>
        <div class="kpi year-stat">${panelIcon(ICON.pig)}<div><div class="kh">Into savings</div><div class="kv">${money(saved, { round: true })}</div><div class="ks">avg ${money(past.length ? sum(past, t => t.left) / past.length : 0, { round: true })} left a month</div></div></div>
      </div>
      <div class="card"><div class="ttl"><b>Going out</b>${pout ? chip(change(out, pout), true) : `<span class="muted small">${y}</span>`}</div>
        <div class="year-total">${money(out, { round: true })}</div>
        ${out > 0 ? outChart : `<p class="muted small" style="margin:8px 0 0">Nothing has gone out in ${y} yet. Once bills and spending are added, each month gets a bar here.</p>`}
        ${best && best.left > 0 ? `<p class="best-month muted small">${panelIcon(ICON.chart)}<span>Best month so far: <b>${monthName(best.m, { month: "long" })}</b> with ${money(best.left, { round: true })} left. Tap a month to open it.</span></p>` : ""}
      </div>
    </div>
    <div class="grid">
      ${(() => { const np = billsPlan(cy + 1); return `<button class="card year-plan" data-act="billplan"><span class="ttl"><b class="year-plan-heading">${panelIcon(ICON.bill)} Next year’s bills</b><span class="lk" style="color:var(--accent);font-weight:700">Plan for them ›</span></span>
        ${np.total ? `<span class="mrow"><span class="year-total">${money(np.total, { round: true })}</span><span class="muted small">≈ ${money(np.total / 12, { round: true })} a month</span></span><span class="muted small">${np.items.length} bills in ${cy + 1}. See how much to put aside each month.</span>`
          : `<span class="muted small">No bills planned for ${cy + 1} yet. Bills that repeat show up here automatically.</span>`}</button>`; })()}
      <div class="card year-categories"><div class="ttl"><b>Categories</b><span class="muted small">${y}</span></div>${catRows.length ? catRows.slice(0, 7).map(([id, v]) => { const c = cat(id);
        return `<div class="row2" style="cursor:default"><span class="ci" style="background:${c.color}1f">${esc(c.emoji)}</span><span class="mn"><b>${esc(c.name)}</b><span>${Math.round(v / (out || 1) * 100)}% of everything going out</span><div class="thin"><i style="width:${v / catRows[0][1] * 100}%;background:${c.color}"></i></div></span><span class="rt"><b>${money(v, { round: true })}</b></span></div>`; }).join("") : `<p class="muted small" style="margin:4px 0">No spending categories recorded in ${y} yet. Bills and spending you add show up here, biggest first.</p>`}</div>
      <div class="card"><div class="ttl"><b>Biggest bills</b></div>${topBills.length ? topBills.map(x => { const c = cat(x.c);
        return `<div class="row2" style="cursor:default"><span class="ci" style="background:${c.color}1f">${esc(c.emoji)}</span><span class="mn"><b>${esc(x.name || c.name)}</b><span>${money(x.v / 12, { round: true })} a month on average</span></span><span class="rt"><b>${money(x.v, { round: true })}</b></span></div>`; }).join("") : `<p class="muted small" style="margin:4px 0">No bills recorded in ${y} yet. Each bill you add shows here with its total for the year.</p>`}</div>
    </div>
  </div>`;
}

function renderGoals() {
  const gs = [...S.goals].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const total = sum(gs, goalSaved), target = sum(gs, g => num(g.target));
  return `<div class="grid savings-page">
    ${gs.length ? `<div class="grid two savings-summary"><div class="card gaugecard savings-hero">${gauge(gs.map(g => ({ v: goalSaved(g), color: g.color || "var(--save)", t: g.name })), Math.max(target, total))}
      <div class="gl">Saved in total</div><div class="gv">${money(total)}</div>
      <div class="gs">${target ? `${Math.round(Math.min(1, total / target) * 100)}% of ${money(target, { round: true })} across ${gs.length} goal${gs.length > 1 ? "s" : ""}` : `${gs.length} goal${gs.length > 1 ? "s" : ""}`}</div></div>
      <section class="card"><div class="home-card-title"><h2>Savings breakdown</h2><span class="muted small">${gs.length} ${gs.length === 1 ? "goal" : "goals"}</span></div>
        ${gs.map(g => {
          const amount = goalSaved(g);
          const share = total > 0 ? Math.round(amount / total * 100) : null;
          return `<button class="savings-breakdown-row" data-act="gview" data-id="${esc(g.id)}">
            <span><i class="goal-dot" style="background:${esc(g.color || "var(--save)")}" aria-hidden="true"></i>${esc(g.name)}</span>
            <b>${money(amount)}</b><span class="muted small" ${share === null ? "" : `title="${share}% of total savings"`}>${share === null ? "" : share + "%"}</span></button>`;
        }).join("")}
        <div class="mrow" style="margin-top:10px"><b>Total saved</b><b>${money(total)}</b></div>
      </section></div>` : ""}
    ${gs.length ? `<div class="card" data-act="billplan" style="cursor:pointer;display:flex;align-items:center;gap:12px"><span class="emo" style="background:color-mix(in srgb,#f97316 16%,transparent)">🧾</span><span style="flex:1"><b>Plan for next year's bills</b><br><span class="muted small">How much to put aside each month so next year's bills are covered</span></span><span style="color:var(--accent);font-weight:800">›</span></div>` : ""}
    ${gs.length ? `<div class="grid two savings-goals" style="align-items:stretch">${gs.map(g => {
      const s = goalSaved(g), tg = num(g.target), pct = tg > 0 ? Math.max(0, Math.min(100, s / tg * 100)) : 0;
      return `<div class="card gcard" data-act="gview" data-id="${esc(g.id)}">
        <div class="top"><span class="emo" style="background:${g.color || "#8b5cf6"}1f">${esc(g.emoji || "🐷")}</span><b>${esc(g.name)}</b>${tg > 0 ? `<span class="goal-progress small">${Math.round(pct)}% of goal</span>` : ""}</div>
        <div class="big">${money(s)} ${tg ? `<span class="of">of ${money(tg, { round: true })}</span>` : ""}</div>
        ${tg ? `<div class="bar"><i style="width:${pct}%;background:${g.color || "#8b5cf6"}"></i></div>` : ""}
        ${(() => { const now = goalMonths(g, 1)[0].v; return now ? `<div class="muted small" style="margin:-2px 0 8px;font-weight:700"><span class="${now > 0 ? "good" : "bad"}">${now > 0 ? "+" : "−"}${money(Math.abs(now), { round: true })}</span> this month</div>` : ""; })()}
        <div class="ft"><span>${tg ? (s >= tg ? "Reached!" : `${money(tg - s, { round: true })} to go${g.by ? " · by " + esc(monthName(g.by, { month: "short", year: "numeric" })) : ""}`) : "No target"}</span>
          <button class="btn sm pri" data-act="gmove" data-id="${esc(g.id)}" data-dir="1">+ Add money</button></div>
      </div>`; }).join("")}</div>` : `<div class="card welcome savempty"><div class="e">🐷</div><h2 style="margin:6px 0">Saving for something?</h2><p class="muted">A holiday, a new car, an emergency fund… Make a goal, then put money in whenever you can. It shows up in that month's budget too.</p><div class="addrow" style="justify-content:center"><button class="btn pri" data-act="goal">+ New savings goal</button><button class="btn" data-act="billplan">🧾 Plan for next year's bills</button></div></div>`}
  </div>`;
}

// one goal, everything about it
function openGoalView(id) {
  const g = S.goals.find(x => x.id === id); if (!g) return;
  const s = goalSaved(g), tg = num(g.target);
  let plan = "";
  if (tg && s < tg && g.by) { const months = mi(g.by) - mi(thisMonth()) + 1; plan = months > 0 ? `Put aside <b>${money((tg - s) / months)}</b> a month to reach it by ${esc(monthName(g.by, { month: "long", year: "numeric" }))}.` : `<span class="bad">The target date has passed.</span>`; }
  openSheet(`${head(`${esc(g.emoji || "🐷")} ${esc(g.name)}`)}
    <div class="gaugecard" style="padding:0">${tg ? gauge([{ v: s, color: g.color || "var(--save)", t: g.name }], tg) + `<div class="gl">Saved</div>` : `<div class="gl" style="margin-top:0">Saved</div>`}
      <div class="gv">${money(s)}</div><div class="gs">${tg ? `${Math.round(Math.min(1, s / tg) * 100)}% of ${money(tg)}` : "no target set"}</div></div>
    ${plan ? `<p class="small" style="text-align:center">${plan}</p>` : ""}
    <div class="actions"><button class="btn pri" data-act="gmove" data-id="${esc(g.id)}" data-dir="1">+ Put money in</button><button class="btn" data-act="gmove" data-id="${esc(g.id)}" data-dir="-1">− Take out</button></div>
    ${(() => { const gm = goalMonths(g, 6), mx = Math.max(...gm.map(x => Math.abs(x.v)), 1); if (!gm.some(x => x.v)) return "";
      return `<h4>Last 6 months</h4><div class="gbars">${gm.map(x => `<div data-tip="${esc(monthName(x.m) + ": " + money(x.v, { raw: true }))}"><span class="gv2">${x.v ? money(x.v, { round: true, raw: true }) : ""}</span><i style="height:${Math.max(3, Math.abs(x.v) / mx * 70)}px;background:${x.v < 0 ? "var(--bad)" : g.color || "var(--save)"}"></i><b>${monthName(x.m, { month: "short" })}</b></div>`).join("")}</div>`; })()}
    ${(g.moves || []).length ? `<h4>History</h4><div>${[...g.moves].sort((a, b) => b.d.localeCompare(a.d)).slice(0, 12).map(d => `<div class="item" style="cursor:default"><div class="main"><div class="name">${num(d.a) >= 0 ? "Put in" : "Took out"}</div><div class="meta">${esc(new Date(d.d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }))}${d.by && B()?.kind === "shared" ? " · " + esc(whoName(d.by)) : ""}</div></div><div class="amt ${num(d.a) < 0 ? "bad" : ""}">${money(num(d.a))}</div></div>`).join("")}</div>` : ""}
    <div class="actions"><button class="btn" data-act="goal" data-id="${esc(g.id)}">Edit goal</button></div>`);
}

function openBillPlan() {
  const cur = thisMonth(), cy = today().getFullYear();
  let year = cy + 1, only = false, picked = null;
  openSheet(`${head("🧾 Plan for next year's bills")}
    <p class="muted small" style="margin-top:-6px">Adds up what your bills will cost in a year and works out how much to put aside each month so the money is there in time.</p>
    <div class="cols"><label class="f"><span>Bills of</span><select id="bpY">${[cy + 1, cy + 2, cy].map(y => `<option ${y === year ? "selected" : ""}>${y}</option>`).join("")}</select></label>
      <div class="f"><span>Which bills</span><div class="seg" id="bpO" style="margin:0"><button type="button" data-o="all" class="on">All</button><button type="button" data-o="irr">Not monthly</button></div></div></div>
    <div id="bpL"></div>
    <div class="f"><span>Have it saved by the end of</span>${monthSel("bpB", (year - 1) + "-12")}</div>
    <div id="bpR"></div>
    <div class="actions"><button class="btn pri" id="bpG">Make it a savings goal</button></div>`, sh => {
    const draw = () => {
      const plan = billsPlan(year);
      const list = plan.items.filter(x => !only || x.repeat !== "monthly");
      if (!picked) picked = new Set(plan.items.map(x => x.id));
      const total = sum(list.filter(x => picked.has(x.id)), x => x.total);

        const when = x.repeat === "monthly" ? `every month · ${money(x.total / x.count, { round: true, raw: true })}`
          : repeatDays(x.repeat) ? `${REPEATS[x.repeat][0].toLowerCase()} · ${x.count} scheduled`
          : x.months.map(n => new Date(2000, n - 1, 1).toLocaleDateString("en-GB", { month: "short" })).join(", ");
        return `<label class="check" style="margin:0;padding:9px 0;border-top:1px solid var(--line)"><input type="checkbox" data-bp="${esc(x.id)}" ${picked.has(x.id) ? "checked" : ""}>
          <span style="flex:1;min-width:0"><b>${esc(c.emoji)} ${esc(x.name)}</b><br><span class="muted small">${esc(when)}</span></span><b>${money(x.total, { round: true })}</b></label>`; }).join("")}</div>`
        : `<p class="muted">${only ? "No bills that come less often than monthly in " + year + "." : "No bills in " + year + " yet. Add your regular bills first — repeating ones count automatically."}</p>`;
      const by = readMonthSel(sh, "bpB"), pm = perMonth(total, cur, by), even = perMonth(total, year + "-01", year + "-12");
      const n = mi(by) - mi(cur) + 1;
      sh.querySelector("#bpR").innerHTML = total > 0 ? `<div class="box">
        <div class="mrow"><span class="k">Bills to cover in ${year}</span><span class="v">${money(total)}</span></div>
        <div style="margin-top:10px;font-weight:600">${pm != null ? `Put aside <b class="good" style="font-size:1.2em">${money(pm)} a month</b> for the next ${n} month${n > 1 ? "s" : ""} (${esc(monthName(cur, { month: "short", year: "numeric" }))} – ${esc(monthName(by, { month: "short", year: "numeric" }))}) to have it all by then.` : `<span class="bad">Pick a month from now on.</span>`}</div>
        <div class="muted small" style="margin-top:8px">Or spread over ${year} itself: ${money(even)} a month — that's what these bills cost on average.</div></div>` : "";
      sh.querySelector("#bpG").disabled = !(total > 0 && pm != null);
    };
    draw();
    sh.querySelector("#bpY").onchange = ev => { year = +ev.target.value; picked = null; draw(); };
    sh.querySelector("#bpO").onclick = ev => { const b = ev.target.closest("[data-o]"); if (!b) return; only = b.dataset.o === "irr"; sh.querySelectorAll("#bpO button").forEach(x => x.classList.toggle("on", x === b)); draw(); };
    sh.querySelector("#bpL").addEventListener("change", ev => { const c = ev.target.closest("[data-bp]"); if (!c) return; c.checked ? picked.add(c.dataset.bp) : picked.delete(c.dataset.bp); draw(); });
    sh.querySelector("#bpBM").onchange = sh.querySelector("#bpBY").onchange = draw;
    sh.querySelector("#bpG").onclick = () => {
      const plan = billsPlan(year), total = sum(plan.items.filter(x => (!only || x.repeat !== "monthly") && picked.has(x.id)), x => x.total), by = readMonthSel(sh, "bpB");
      const name = `Bills ${year}`, old = S.goals.find(g => g.name === name);
      w(Store.saveItem(S.bid, "goals", old?.id || null, { ...(old ? strip(old) : { moves: [], createdAt: Date.now(), color: "#f97316" }), name, emoji: "🧾", target: total, by }).done);
      logAct("plan", { n: name, a: total });
      closeSheet(); toast(old ? `“${name}” updated` : `Savings goal “${name}” made — put money in each month`);
      S.view = "goals"; _render(); window.scrollTo(0, 0);
    };
  });
}

function openActivity() {
  const list = S.activity || [];
  const day = at => { const d = new Date(at), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    return d.toDateString() === t.toDateString() ? "Today" : d.toDateString() === y.toDateString() ? "Yesterday" : d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }); };
  let last = "", html = "";
  for (const r of list) { const g = day(r.at); if (g !== last) { html += `<h4>${esc(g)}</h4>`; last = g; }

    <p class="muted small" style="margin-top:-6px">Every change in “${esc(B()?.name || "")}”: who did it and when. Nobody can edit or delete this history.</p>

}

/* ---------- sheets ---------- */
function openSheet(html, mount) {
  const sc = $("#scrim");
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  sc.hidden = false; document.body.classList.add("noscroll");
  const sh = sc.firstElementChild;
  mount && mount(sh);
  const f = sh.querySelector("[autofocus]"); if (f && matchMedia("(pointer:fine)").matches) f.focus();
  return sh;
}
function closeSheet() { const sc = $("#scrim"); sc.hidden = true; sc.innerHTML = ""; document.body.classList.remove("noscroll"); }
const head = t => `<h3>${t}<button class="ib x" data-close title="Close">✕</button></h3>`;
let toastT;
function toast(msg, undo) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastT);
  if (undo) {
    const button = Object.assign(document.createElement("button"), { type:"button", className:"toast-undo", textContent:"Undo" });
    button.onclick = undo;
    t.append(button);
  }
  toastT = setTimeout(() => { t.hidden = true; t.replaceChildren(); }, undo ? 8000 : 2800);
}

// categories, the ones used most recently first (up to 4), then the rest in their usual order
function recentCats(kind) {
  const all = cats().filter(c => c.kind === kind), seen = [];
  for (const e of [...S.entries].sort((a, z) => (z.updatedAt || z.createdAt || 0) - (a.updatedAt || a.createdAt || 0)))
    if ((e.type === "income") === (kind === "in") && e.category && !seen.includes(e.category) && all.some(c => c.id === e.category)) { seen.push(e.category); if (seen.length === 4) break; }
  return [...seen.map(id => all.find(c => c.id === id)), ...all.filter(c => !seen.includes(c.id))];
}
function catChips(kind, sel) {
  return recentCats(kind).map(c => `<button type="button" class="chip2 ${c.id === sel ? "on" : ""}" data-cat="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("");
}

function openEntry(id, type) {
  const e = id ? S.entries.find(x => x.id === id) : null;
  if (id && !e) return;
  const m = S.month, md = S.months[m] || {};
  const f = e ? { ...e } : { type: type || "bill", name: "", amount: "", repeat: type === "spend" ? "once" : "monthly", start: m, until: "", due: "", auto: false, note: "",
    category: (cats().find(c => c.kind === (type === "income" ? "in" : "out") && (type !== "spend" || c.name === "Groceries")) || cats().find(c => c.kind === (type === "income" ? "in" : "out")) || {}).id };

  openSheet(`

    <label class="f"><span>How often</span><select id="fRep">${Object.entries(REPEATS).map(([k, [t]]) => `<option value="${k}" ${f.repeat === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>

    <div id="moreBox" ${showMore ? "" : "hidden"}>
      <div class="f" id="untilF"><span>Last month (leave “keeps going” if it never ends)</span>${monthSel("fU", f.until, true)}</div>
      <label class="f"><span>Note</span><input type="text" id="fNote" maxlength="120" placeholder="e.g. account number, who pays it" value="${esc(f.note || "")}"></label>
    </div>
    ${repeating ? `<h4>Just for ${esc(monthName(m))}</h4><div class="box">
      <p class="muted small" id="fMonthHint" hidden>Changes here apply to every occurrence in this month.</p>
      <label class="f" style="margin-bottom:8px"><span>Different amount this month only</span><input type="text" id="fOver" inputmode="decimal" placeholder="usual: ${esc(money(num(e.amount), { raw: true }))}" value="${md.amounts?.[e.id] != null ? esc(String(md.amounts[e.id]).replace(".", ",")) : ""}"></label>
      <label class="check" style="margin:0"><input type="checkbox" id="fSkip" ${md.skip?.[e.id] ? "checked" : ""}> Skip it this month</label></div>` : ""}

  `, sh => {
    const sync = () => {
      sh.querySelectorAll("#tsel button").forEach(b => b.classList.toggle("on", b.dataset.t === f.type));

      day.required = weekly;
      const monthHint = sh.querySelector("#fMonthHint");

      sh.querySelector("#untilF").style.display = rep ? "" : "none";
      sh.querySelector("#fStartL").textContent = weekly ? "First occurrence" : rep ? "Starting from" : (f.type === "bill" ? "Due date" : "Date");
      sh.querySelector("#fSDL").textContent = rep && !weekly ? (f.type === "bill" ? "Due on day" : f.type === "income" ? "Paid on day" : "On day") : "Day";
      sh.querySelector("#fDayHint").textContent = weekly ? "Choose the first date. Each occurrence uses the amount above."

      w(Store.saveItem(S.bid, "entries", e?.id || null, data).done);
      if (!e) logAct("add", { n: data.name, a: amount, t: data.type });
      else if (["type", "name", "amount", "category", "repeat", "start", "until", "due", "auto", "note"].some(k => (e[k] ?? null) !== (data[k] ?? null) && !(k === "amount" && num(e.amount) === amount)))
        logAct("edit", { n: data.name, a: num(e.amount) !== amount ? amount : null, t: data.type });
      if (repeating) {
        const ov = sh.querySelector("#fOver").value.trim(), skip = sh.querySelector("#fSkip").checked;

        if (!!md.skip?.[e.id] !== skip) logAct("month", { n: data.name, m, x: skip ? "skipped" : "not skipped any more" });

      w(Store.deleteItem(S.bid, "entries", e.id)); logAct("delete", { n: e.name, t: e.type }); closeSheet(); toast("Deleted"); };
  });
}

// month + year dropdowns (work the same in every browser, no typing)
function monthSel(id, val, optional, noneLabel = "— keeps going") {
  const none = optional && !val;
  const [vy, vm] = (val || thisMonth()).split("-").map(Number), cy = today().getFullYear();
  const years = []; for (let y = Math.min(vy, cy - 6); y <= Math.max(vy, cy + 6); y++) years.push(y);
  return `<div class="cols" style="gap:6px"><label class="f" style="margin:0"><select id="${id}M">${optional ? `<option value="" ${none ? "selected" : ""}>${noneLabel}</option>` : ""}${Array.from({ length: 12 }, (_, i) =>
    `<option value="${pad(i + 1)}" ${!none && i + 1 === vm ? "selected" : ""}>${new Date(2000, i, 1).toLocaleDateString("en-GB", { month: "long" })}</option>`).join("")}</select></label>
    <label class="f" style="margin:0"><select id="${id}Y">${years.map(y => `<option ${y === vy ? "selected" : ""}>${y}</option>`).join("")}</select></label></div>`;
}
const readMonthSel = (sh, id) => { const mm = sh.querySelector(`#${id}M`).value; return mm ? sh.querySelector(`#${id}Y`).value + "-" + mm : null; };
// optional day + month + year
function dateSel(id, month, day) {
  return `<div style="display:grid;grid-template-columns:minmax(74px,.7fr) 2fr;gap:6px;align-items:end">
    <label class="f" style="margin:0"><span id="${id}DL" style="font-size:.78em">Day</span><select id="${id}D"><option value="">—</option>${Array.from({ length: daysIn(month || thisMonth()) }, (_, i) =>
      `<option value="${i + 1}" ${i + 1 === Number(day) ? "selected" : ""}>${i + 1}</option>`).join("")}</select></label>
    ${monthSel(id, month)}</div>`;
}
function fixDays(sh, id) {   // keep the day list right for the chosen month (28-31 days)
  const sel = sh.querySelector(`#${id}D`), keep = sel.value, n = daysIn(readMonthSel(sh, id));
  sel.innerHTML = `<option value="">—</option>` + Array.from({ length: n }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("");
  sel.value = keep && +keep <= n ? keep : (keep ? String(n) : "");
}

// earliest start on or after `from` that keeps the item's rhythm (a quarterly bill stays on its quarters)
function openBackfill(type = "income", from) {
  let kind = type;
  const fromDefault = from || mk(mi(thisMonth()) - 6);
  openSheet(`${head("Fill in earlier months")}
    <p class="muted small" style="margin-top:-6px">Picks up what you have now and makes it count in earlier months too — handy when you start using the app mid-year and want the past months (and the Year view) to be right.</p>
    <div class="seg" id="bkT">${[["income", "Income"], ["bill", "Bills"]].map(([k, t]) => `<button type="button" data-k="${k}" class="${k === kind ? "on" : ""}">${t}</button>`).join("")}</div>
    <div class="f"><span>Count them from</span>${monthSel("bkF", fromDefault)}</div>
    <div id="bkL"></div>
    <div class="actions"><button class="btn pri" id="bkS">Fill in</button></div>`, sh => {
    const draw = () => {
      const f = readMonthSel(sh, "bkF");
      const list = S.entries.filter(e => e.type === kind && e.repeat && e.repeat !== "once" && e.start > f && (!e.until || e.until >= f))
        .sort((a, b) => num(b.amount) - num(a.amount));
      sh.querySelector("#bkL").innerHTML = list.length ? `<div class="f"><span>${kind === "income" ? "Your income" : "Your bills"} that start after ${esc(monthName(f))}</span>${list.map(e => {
        const { start } = backfillSchedule(e, f), c = cat(e.category);
        return `<label class="check" style="margin:0;padding:9px 0;border-top:1px solid var(--line)"><input type="checkbox" data-bk="${esc(e.id)}" checked>
          <span style="flex:1"><b>${esc(c.emoji)} ${esc(e.name)}</b> · ${money(num(e.amount))}<br><span class="muted small">${esc(REPEATS[e.repeat][0].toLowerCase())} · now from ${esc(monthName(e.start, { month: "short", year: "numeric" }))} → from ${esc(monthName(start, { month: "short", year: "numeric" }))}</span></span></label>`; }).join("")}</div>
        ${kind === "bill" ? `<p class="muted small">Bills in months before this one are ticked as paid.</p>` : ""}`
        : `<p class="muted">Nothing to fill in — all your repeating ${kind === "income" ? "income" : "bills"} already ${kind === "income" ? "counts" : "count"} from ${esc(monthName(f))} or earlier.</p>`;
      sh.querySelector("#bkS").disabled = !list.length;
    };
    draw();
    sh.querySelector("#bkT").onclick = ev => { const b = ev.target.closest("[data-k]"); if (!b) return; kind = b.dataset.k; sh.querySelectorAll("#bkT button").forEach(x => x.classList.toggle("on", x === b)); draw(); };
    sh.querySelector("#bkFM").onchange = draw; sh.querySelector("#bkFY").onchange = draw;
    sh.querySelector("#bkS").onclick = () => {
      const picked = [...sh.querySelectorAll("[data-bk]:checked")];
      if (!picked.length) { toast("Tick at least one"); return; }
      const cur = thisMonth();
      for (const box of picked) {
        const e = S.entries.find(x => x.id === box.dataset.bk); if (!e) continue;
        const updated = { ...e, ...backfillSchedule(e, readMonthSel(sh, "bkF")), updatedAt: Date.now() };
        w(Store.saveItem(S.bid, "entries", e.id, strip(updated)).done);
        if (e.type === "bill" && !e.auto) {
          const end = Math.min(mi(e.start), mi(cur) - 1);
          for (let i = mi(updated.start); i <= end; i++) {
            const month = mk(i);
            const existing = new Set(scheduledItems(e, month).map(item => item.paymentKey));
            const added = scheduledItems(updated, month).filter(item => !existing.has(item.paymentKey));
            const paid = Object.fromEntries(added.map(item => [item.paymentKey, true]));
            if (Object.keys(paid).length) w(Store.setMonth(S.bid, month, { paid }));
          }
        }
      }
      logAct("backfill", { m: readMonthSel(sh, "bkF"), x: `${picked.length} ${kind === "income" ? "income" : "bill"}${picked.length > 1 && kind !== "income" ? "s" : ""}` });
      closeSheet(); toast(`${picked.length} filled in from ${monthName(readMonthSel(sh, "bkF"), { month: "short", year: "numeric" })}`);
    };
  });
}

function bindSettings(sh) {
    const b = B();
    const saveLook = patch => { S.profile.look = { ...look(), ...patch }; applyLook(); render(); w(Store.saveProfile({ look: patch })); };
    const segPick = (sel, key) => sh.querySelector(sel).onclick = ev => { const x = ev.target.closest("[data-v]"); if (!x) return;
      sh.querySelectorAll(sel + " [data-v]").forEach(y => y.classList.toggle("on", y === x)); saveLook({ [key]: x.dataset.v }); };
    segPick("#sTheme", "theme"); segPick("#sAcc", "accent"); segPick("#sSize", "size");
    sh.querySelector("#sStart").onchange = ev => saveLook({ start: ev.target.value });
    sh.querySelector("#sSort").onchange = ev => saveLook({ billSort: ev.target.value });
    sh.querySelector("#sHide").onchange = ev => saveLook({ hideOnStart: ev.target.checked });
    if (b) {
      sh.querySelector("#bSave").onclick = () => {
        const targetInput = sh.querySelector("#bTarget");
        const target = num(targetInput.value);
        if (targetInput.value.trim() && target <= 0) { toast("Enter a positive spending target or leave it blank"); targetInput.focus(); return; }
        w(Store.updateBudget(b.id, { name: sh.querySelector("#bN").value.trim() || b.name, emoji: sh.querySelector("#bE").value.trim() || "💰",
          currency: sh.querySelector("#bCur").value, numStyle: sh.querySelector("#bNum").value, carry: sh.querySelector("#bCarry").checked,
          spendingTarget: target || null }));
        logAct("settings"); toast("Budget saved");
      };
      sh.querySelector("#bCats").onclick = openCats;
      sh.querySelector("#bLims").onclick = openLimits;
      sh.querySelector("#bAct").onclick = openActivity;
      sh.querySelectorAll("[data-kick]").forEach(x => x.onclick = () => { const u = x.dataset.kick; if (!confirm(`Remove ${b.memberNames?.[u] || "this person"} from "${b.name}"? They won't see it any more.`)) return;
        const names = { ...(b.memberNames || {}) }; delete names[u];
        logAct("kick", { n: b.memberNames?.[u] || "someone" }); w(Store.replaceBudgetField(b.id, "members", b.members.filter(m => m !== u)).then(() => Store.replaceBudgetField(b.id, "memberNames", names))); closeSheet(); toast("Removed"); });
      const add = sh.querySelector("#pAdd");
      if (add) add.onclick = () => {
        const code = sh.querySelector("#pC").value.trim(), name = sh.querySelector("#pN").value.trim();
        if (!/^[A-Za-z0-9]{20,40}$/.test(code)) { toast("That doesn't look like a sharing code"); return; }
        if (b.members.includes(code)) { toast("Already in this budget"); return; }
        w(Store.replaceBudgetField(b.id, "members", [...b.members, code]).then(() => Store.updateBudget(b.id, { memberNames: { [code]: name || "someone" } })));
        logAct("member", { n: name || "someone" });
        closeSheet(); toast((name || "They") + " can now open this budget");
      };
      const del = sh.querySelector("#bDel");
      if (del) del.onclick = async () => {
        if (prompt(`This deletes "${b.name}" and everything in it for everyone. Type DELETE to confirm.`) !== "DELETE") return;
        closeSheet(); const p = S.budgets.find(x => x.kind === "personal" && x.owner === S.user.uid); if (p) selectBudget(p.id);
        try { await Store.deleteBudget(b.id); toast("Budget deleted"); } catch (e) { toast("Couldn't delete: " + (e.code || e)); }
      };
      const lv = sh.querySelector("#bLeave");
      if (lv) lv.onclick = () => { if (!confirm(`Leave "${b.name}"? You'll need to be added again to see it.`)) return;
        const p = S.budgets.find(x => x.kind === "personal" && x.owner === S.user.uid); logAct("leave"); w(Store.leaveBudget(b.id)); closeSheet(); if (p) selectBudget(p.id); toast("You left the budget"); };
    }
    sh.querySelector("#aSave").onclick = () => {
      const n = sh.querySelector("#aN").value.trim(); if (!n) return;
      S.profile.name = n; w(Store.saveProfile({ name: n }));
      for (const x of S.budgets) if (x.memberNames?.[S.user.uid] !== n) w(Store.updateBudget(x.id, { memberNames: { [S.user.uid]: n } }));
      toast("Name saved");
    };
    sh.querySelector("#aCopy").onclick = () => navigator.clipboard.writeText(S.user.uid).then(() => toast("Code copied"), () => toast("Couldn't copy — select it by hand"));
    const out = sh.querySelector("#aOut"); if (out) out.onclick = () => { closeSheet(); signOut(); };
    sh.querySelector("#xJ").onclick = exportJSON;
    sh.querySelector("#xC").onclick = exportCSV;
    sh.querySelector("#xI").onclick = () => sh.querySelector("#xF").click();
    sh.querySelector("#xF").onchange = importJSON;
}
