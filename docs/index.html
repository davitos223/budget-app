<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5b5fd6">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
// apply the saved look before anything paints (no flash of the wrong theme)
try { const l = JSON.parse(localStorage.getItem("budget.look") || "{}");
  if (l.theme && l.theme !== "auto") document.documentElement.dataset.theme = l.theme;
  if (l.size) document.documentElement.dataset.size = l.size;
  if (l.accentHex) document.documentElement.style.setProperty("--accent", l.accentHex); } catch {}
</script>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --card2:#f5f6fa; --text:#1b1d29; --muted:#7a7f93; --line:#e8eaf1;
  --accent:#5b5fd6; --accent-soft:color-mix(in srgb,var(--accent) 13%,transparent); --on-accent:#fff;
  --head1:var(--accent); --head2:color-mix(in srgb,var(--accent) 55%,#a5f3fc);
  --good:#16a34a; --bad:#e2574c; --warn:#d97706; --out:#f08a6c; --spend:#f6b84a; --save:#a78bfa;
  --shadow:0 1px 2px #1b1d290a, 0 6px 20px #1b1d290d;
  --r:18px; --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#0e1016; --card:#171a23; --card2:#1f2330; --text:#eceef5; --muted:#8c91a6; --line:#272b38;
    --head1:color-mix(in srgb,var(--accent) 70%,#0e1016); --head2:color-mix(in srgb,var(--accent) 35%,#0e1016);
    --good:#4ade80; --bad:#fb7185; --warn:#fbbf24; --shadow:none;
  }
}
:root[data-theme=dark]{
  --bg:#0e1016; --card:#171a23; --card2:#1f2330; --text:#eceef5; --muted:#8c91a6; --line:#272b38;
  --head1:color-mix(in srgb,var(--accent) 70%,#0e1016); --head2:color-mix(in srgb,var(--accent) 35%,#0e1016);
  --good:#4ade80; --bad:#fb7185; --warn:#fbbf24; --shadow:none;
}
:root[data-size=large]{--fs:17px} :root[data-size=xl]{--fs:19px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:500 var(--fs)/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(30px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.money small{font-size:.72em;font-weight:inherit;opacity:.85}
body.hide .money{filter:blur(.42em);user-select:none}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:.86em}

/* ---------- coloured header ---------- */
.head{background:linear-gradient(150deg,var(--head1),var(--head2));color:#fff;padding-top:env(safe-area-inset-top)}
.head.tall{padding-bottom:86px}
.head.short{padding-bottom:58px}
.topin{display:flex;align-items:center;gap:8px;padding:14px 0 6px}
.bsel{display:flex;align-items:center;gap:10px;border:none;background:none;color:#fff;padding:4px 8px 4px 4px;margin-left:-4px;border-radius:14px;min-width:0;text-align:left}
.bsel:hover{background:#ffffff1f}
.bsel .av{width:38px;height:38px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-size:1.2em;flex:none}
.bsel .t{display:block;font-weight:800;font-size:1.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsel .s{display:block;font-size:.78em;opacity:.85;font-weight:600}
.sp{flex:1}
.gb{border:none;background:#ffffff2b;color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;padding:0;flex:none}
.gb:hover{background:#ffffff45}
.gb svg{width:20px;height:20px}
.tabs{display:flex;gap:6px;margin:10px 0 0}
.tab{border:none;background:#ffffff26;color:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:.92em}
.tab.on{background:#fff;color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 0}
.nav .lbl{font-weight:800;font-size:1.05em;min-width:160px;text-align:center}
.nav .gb{width:34px;height:34px;font-size:1.1em}
.pill{border:none;background:#ffffff2b;color:#fff;border-radius:999px;padding:5px 12px;font-size:.82em;font-weight:700}
.pill:hover{background:#ffffff45}
main.wrap{margin-top:-70px;position:relative}
.head.short + main.wrap{margin-top:-44px}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media (min-width:880px){ .grid.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start} }
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{padding:4px 16px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 8px;font-size:.74em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec .lk{border:none;background:none;color:var(--accent);font-weight:700;font-size:1.25em;letter-spacing:0;text-transform:none;padding:2px 4px}
.sec .lk+.lk{margin-left:6px}
.total{position:relative}
.total .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
.total .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.total .lbl{font-weight:700}
.total .big{font-size:2.1em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.total .eq{color:var(--muted);font-size:.86em;margin-top:2px}
.brk{margin-top:10px}
.brk .r{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.brk .r:first-child{border-top:none}
.brk .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.05em;flex:none}
.brk .n{flex:1;font-weight:600}
.brk .v{font-weight:800}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--card2);margin:12px 0 2px;gap:2px}
.stack i{display:block;height:100%;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:.78em;color:var(--muted);font-weight:700}
.tile .v{font-weight:800;font-size:1.12em;margin-top:2px}
.tile .s{font-size:.76em;color:var(--muted)}
@media (max-width:520px){ .tiles{grid-template-columns:1fr 1fr} .tiles .tile:nth-child(3){grid-column:1/-1} }
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:center}
.ring svg{width:74px;height:74px;display:block;margin:0 auto 8px}
.ring .k{font-size:.8em;color:var(--muted);font-weight:700}
.ring .v{font-weight:800;font-size:1.2em}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:.74em;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);margin-top:4px}
.chip.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:none}
.item:hover .name{color:var(--accent)}
.emo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.15em;flex:none}
.item .main{flex:1;min-width:0}
.item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;white-space:nowrap;text-align:right}
.item .amt .sub{display:block;font-weight:600;font-size:.74em;color:var(--muted)}
.item .amt .was{display:block;font-weight:500;font-size:.74em;color:var(--muted);text-decoration:line-through}
.item.skipped{opacity:.5} .item.skipped .amt{text-decoration:line-through}
.item.paid .name{color:var(--muted)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;color:#fff}
.chk svg{width:15px;height:15px;opacity:0}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on svg{opacity:1}
.chk.late{border-color:var(--bad)}
.tag{display:inline-block;font-size:.7em;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--card2);color:var(--muted);margin-left:5px;vertical-align:1px}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:12px 0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--warn) 12%,var(--card));font-size:.92em}
.alert.bad{background:color-mix(in srgb,var(--bad) 11%,var(--card))}
/* limits */
.lim{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.lim:first-child{border-top:none}
.lim .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lim .nm{font-weight:800}
.lim .lft{font-weight:800;text-align:right}
.lim .lft .sub{display:block;font-size:.74em;color:var(--muted);font-weight:600}
.bar2{position:relative;height:10px;background:var(--card2);border-radius:5px;overflow:hidden;margin:8px 0 6px;display:flex}
.bar2 i{display:block;height:100%}
.lim .st{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:.82em;color:var(--muted);font-weight:600}
.healthy{display:flex;align-items:center;justify-content:space-between}
.healthy .n{font-size:1.5em;font-weight:800}
/* donut + legend */
.donutwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:420px){ .donutwrap{grid-template-columns:1fr} .donutwrap svg{margin:0 auto} }
.donutwrap svg{width:150px;height:150px;display:block}
.leg{display:flex;flex-direction:column;gap:7px;font-size:.9em}
.leg .l{display:flex;align-items:center;gap:8px}
.leg .l b{width:10px;height:10px;border-radius:3px;flex:none}
.leg .l .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .l .v{font-weight:800}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8em;flex:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dang{color:var(--bad)}
.btn.dang:hover{border-color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{padding:5px 11px;font-size:.86em}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px;resize:vertical}
.welcome{text-align:center;padding:26px 16px}
.welcome .e{font-size:2.6em}
.goal .bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;margin:10px 0 6px}
.goal .bar i{display:block;height:100%;border-radius:5px}
.goal .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart svg{width:100%;height:auto;display:block}
.chart .m{cursor:pointer}
.chart .m:hover rect.bg{fill:var(--card2)}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:.92em}
.hbar .tr{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px}
.hbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{text-align:center;margin-top:22px}

/* bottom bar + add button (phones) */
.bnav{display:none}
.fab{display:none}
@media (max-width:699px){
  .tabs{display:none}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7em;font-weight:700;color:var(--muted);padding:4px 0}
  .bnav button svg{width:22px;height:22px}
  .bnav button.on{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;
    border:none;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:#0a0c1499;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:22px;max-height:88vh} .sheet::before{display:none} }
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 14px;font-size:1.2em;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto}
.sheet h4{margin:20px 0 8px;font-size:.74em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;padding:0;flex:none}
.ib:hover{border-color:var(--accent)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:.84em;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input:not([type=checkbox]):not([type=radio]):not([type=file]),.f select,.inp{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.f input.amount{font-size:1.6em;font-weight:800;text-align:right}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:8px 4px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px #0002}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 11px;font-size:.9em;font-weight:600}
.chip2.on{border-color:var(--accent);background:var(--accent-soft);font-weight:800}
.check{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.box{background:var(--card2);border-radius:14px;padding:12px;margin:8px 0 14px}
.sheet .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet .actions .btn{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--text)}
.catrow{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;margin-bottom:8px}
.catrow input{text-align:center}
.catrow input+input{text-align:left}
.limrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;margin-bottom:8px}
.limrow input{text-align:right}
.brow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;width:100%;background:var(--card);text-align:left}
.brow.on{border-color:var(--accent);background:var(--accent-soft)}
.brow .main{flex:1}
.code{font-family:ui-monospace,Consolas,monospace;font-size:.86em;word-break:break-all;background:var(--card2);padding:8px 10px;border-radius:10px;display:block}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:14px;z-index:40;font-weight:700;max-width:90vw;box-shadow:0 6px 20px #0004}
.toast[hidden]{display:none}

/* login */
.loginbg{min-height:100vh;background:linear-gradient(150deg,var(--head1),var(--head2));padding:12vh 16px 0}
.login{max-width:380px;margin:0 auto;background:var(--card);border-radius:24px;padding:26px 22px;box-shadow:0 20px 50px #0003}
.login .logo{width:58px;height:58px;border-radius:16px;margin-bottom:10px}
.err{color:var(--bad);font-size:.9em;min-height:1.2em;margin:4px 0 8px}
.demo{background:#00000030;color:#fff;font-size:.78em;font-weight:700;text-align:center;padding:5px 10px}
</style>

"use strict";
const APP_VERSION = "20261122c";
// demo mode: no Firebase config, or ?demo on a local test server (never touches the real account)
const LOCAL = !window.BUDGET_FIREBASE || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]demo\b/.test(location.search));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Math.random().toString(36).slice(2, 12);
const pad = n => String(n).padStart(2, "0");
const today = () => new Date();
const thisMonth = () => { const d = today(); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const isoDay = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const mi = m => { const [y, mo] = m.split("-").map(Number); return y * 12 + mo - 1; };
const mk = i => Math.floor(i / 12) + "-" + pad(i % 12 + 1);
const daysIn = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo, 0).getDate(); };
const monthName = (m, opt = { month: "long", year: "numeric" }) => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("en-GB", opt); };
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v ?? "").replace(/[\s €$£]/g, "");
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");

  const n = parseFloat(s); return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}

/* ---------- demo store (no Firebase): same API as Cloud, kept in this browser ---------- */
function makeLocalStore() {
  const K = "budget.demo.v1";
  let db = null; try { db = JSON.parse(localStorage.getItem(K)); } catch {}
  db = db || { profile: {}, budgets: {}, items: {}, months: {} };
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch {} subs.forEach(f => f()); };
  const on = f => { subs.add(f); setTimeout(f); return () => subs.delete(f); };
  const clone = o => JSON.parse(JSON.stringify(o ?? null));
  const merge = (t, p) => { for (const [k, v] of Object.entries(p)) {
    if (v === null) delete t[k];
    else if (v && typeof v === "object" && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== "object") t[k] = {}; merge(t[k], v); }
    else t[k] = v; } return t; };
  const listOf = o => Object.entries(o || {}).map(([id, x]) => ({ ...clone(x), id }));
  const ok = Promise.resolve();
  return {
    version: APP_VERSION,
    watchProfile: cb => on(() => cb(clone(db.profile))),
    saveProfile: p => { merge(db.profile, p); persist(); return ok; },
    watchBudgets: cb => on(() => cb(listOf(db.budgets), { fromCache: false })),
    createBudget: d => { const id = rid(); db.budgets[id] = { ...d, owner: "local", members: ["local"], createdAt: Date.now() }; persist(); return { id, done: ok }; },
    updateBudget: (b, p) => { merge(db.budgets[b], p); persist(); return ok; },
    replaceBudgetField: (b, f, v) => { db.budgets[b][f] = clone(v); persist(); return ok; },
    deleteBudget: b => { delete db.budgets[b]; delete db.items[b]; delete db.months[b]; persist(); return ok; },
    leaveBudget: () => ok,
    watchBudget: (b, o) => on(() => { const it = db.items[b] || {}; o.entries(listOf(it.entries)); o.months(clone(db.months[b] || {})); o.goals(listOf(it.goals)); }),
    saveItem: (b, c, id, d) => { id = id || rid(); ((db.items[b] ||= {})[c] ||= {})[id] = clone(d); persist(); return { id, done: ok }; },
    deleteItem: (b, c, id) => { if (db.items[b]?.[c]) delete db.items[b][c][id]; persist(); return ok; },
    setMonth: (b, m, p) => { merge((db.months[b] ||= {})[m] ||= {}, p); persist(); return ok; },
  };
}

const look = () => ({ theme: "auto", accent: "indigo", size: "normal", start: "month", hideOnStart: false, billSort: "due", ...(S.profile.look || {}) });

}

function money(n, opt = {}) {
  const b = B() || {};
  const loc = (NUMSTYLES[b.numStyle] || NUMSTYLES.dot)[0];
  let f;
  try { f = new Intl.NumberFormat(loc, { style: "currency", currency: b.currency || "EUR", minimumFractionDigits: opt.round ? 0 : 2, maximumFractionDigits: opt.round ? 0 : 2 }); }
  catch { f = new Intl.NumberFormat(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  const v = opt.abs ? Math.abs(n) : n;
  if (opt.raw) return f.format(v);
  const html = f.formatToParts(v).map(p => p.type === "decimal" || p.type === "fraction" ? `<small>${esc(p.value)}</small>` : esc(p.value)).join("");
  return `<span class="money">${html}</span>`;
}

/* ---------- budget maths ---------- */
function occurs(e, m) {
  if (!e.start) return false;
  const a = mi(e.start), x = mi(m);
  if (x < a || (e.until && x > mi(e.until))) return false;
  const step = (REPEATS[e.repeat] || REPEATS.once)[1];
  return step ? (x - a) % step === 0 : x === a;
}
function autoPaid(e, m) {
  const cur = thisMonth();
  if (m < cur) return true;
  if (m > cur) return false;
  return today().getDate() >= (e.due || 1);
}
function monthItems(m) {
  const md = S.months[m] || {};
  return S.entries.filter(e => occurs(e, m)).map(e => {
    const over = md.amounts?.[e.id];
    const explicit = md.paid?.[e.id];
    return { ...e, base: num(e.amount), amt: over != null ? num(over) : num(e.amount), changed: over != null,
      skipped: !!md.skip?.[e.id], paid: e.type === "bill" ? (explicit != null ? !!explicit : (e.auto ? autoPaid(e, m) : false)) : true };
  });
}
function goalMoves(m) { const out = []; for (const g of S.goals) for (const d of (g.moves || [])) if ((d.d || "").startsWith(m)) out.push({ ...d, goal: g }); return out; }
function firstMonth() {
  let f = null;
  for (const e of S.entries) if (e.start && (!f || e.start < f)) f = e.start;
  for (const g of S.goals) for (const d of (g.moves || [])) { const m = (d.d || "").slice(0, 7); if (m && (!f || m < f)) f = m; }
  return f;
}
const carryCache = new Map();
function totals(m) {
  const items = monthItems(m).filter(i => !i.skipped);
  const income = sum(items.filter(i => i.type === "income"), i => i.amt);
  const billsAll = items.filter(i => i.type === "bill");
  const bills = sum(billsAll, i => i.amt);
  const unpaidList = billsAll.filter(i => !i.paid);
  const unpaid = sum(unpaidList, i => i.amt);
  const spend = sum(items.filter(i => i.type === "spend"), i => i.amt);
  const saved = sum(goalMoves(m), d => num(d.a));
  const carry = B()?.carry ? carryIn(m) : 0;
  const afterBills = income + carry - bills;
  const left = afterBills - spend - saved;
  return { income, bills, unpaid, unpaidCount: unpaidList.length, billCount: billsAll.length, spend, saved, carry, afterBills, left, out: bills + spend };
}
function carryIn(m) {
  const key = m + "|" + S.dataStamp;
  if (carryCache.has(key)) return carryCache.get(key);
  const f = firstMonth();
  let c = 0;
  if (f && f < m) {
    const start = Math.max(mi(f), mi(m) - 240);
    for (let i = start; i < mi(m); i++) {
      const items = monthItems(mk(i)).filter(x => !x.skipped);
      c += sum(items, x => x.type === "income" ? x.amt : -x.amt) - sum(goalMoves(mk(i)), d => num(d.a));
    }
  }
  carryCache.set(key, c);
  return c;
}
// spending limits per category: { catId: { limit, used, paidPart } }
function limitsFor(m) {
  const L = B()?.limits || {};
  const items = monthItems(m).filter(i => !i.skipped && i.type !== "income");
  return Object.entries(L).filter(([, v]) => num(v) > 0).map(([id, v]) => {
    const its = items.filter(i => i.category === id);
    const used = sum(its, i => i.amt), done = sum(its.filter(i => i.paid), i => i.amt);
    return { id, c: cat(id), limit: num(v), used, done };
  }).sort((a, b) => b.used / b.limit - a.used / a.limit);
}
// percent change, null if no base
const change = (now, before) => before > 0 ? Math.round((now - before) / before * 100) : null;
function chip(pct, lowerIsGood) {
  if (pct == null || !isFinite(pct)) return "";
  const good = lowerIsGood ? pct <= 0 : pct >= 0;
  return `<span class="chip ${pct === 0 ? "" : good ? "good" : "bad"}">${pct > 0 ? "▲" : pct < 0 ? "▼" : "•"} ${Math.abs(pct)}%</span>`;
}
function ring(frac, color, size = 74, stroke = 9) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${f * c} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}
function donut(segs, center, sub) {
  const size = 150, stroke = 18, r = (size - stroke) / 2, c = 2 * Math.PI * r, tot = sum(segs, s => s.v) || 1, gap = segs.length > 1 ? 3 : 0;
  let off = 0;
  const arcs = segs.map(s => { const len = Math.max(0, s.v / tot * c - gap);
    const a = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(s.t || "")}</title></circle>`;
    off += s.v / tot * c; return a; }).join("");
  return `<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${stroke}"/>${arcs}
    <text x="75" y="${sub ? 72 : 80}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text)" class="money">${esc(center)}</text>
    ${sub ? `<text x="75" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">${esc(sub)}</text>` : ""}</svg>`;
}

function itemRow(i, m) {

function renderMonth() {
  const m = S.month, t = totals(m), items = monthItems(m), l = look(), b = B();
  if (!S.entries.length && !S.goals.length) return `<div class="card welcome">
    <div class="e">👋</div><h2 style="margin:6px 0">Let's set up ${esc(b?.name || "your budget")}</h2>
    <p class="muted">Add your income and your regular bills once. Bills that repeat show up every month on their own — you just tick them off when they're paid.</p>
    <div class="addrow" style="justify-content:center"><button class="btn pri" data-act="add" data-type="income">+ Add income</button><button class="btn pri" data-act="add" data-type="bill">+ Add a bill</button></div></div>`;
  const prev = totals(mk(mi(m) - 1));
  const inc = items.filter(i => i.type === "income").sort((a, b) => b.amt - a.amt);
  const sorters = { due: (a, b) => (a.due || 99) - (b.due || 99) || a.name.localeCompare(b.name), amount: (a, b) => b.amt - a.amt, name: (a, b) => (a.name || "").localeCompare(b.name || ""), unpaid: (a, b) => a.paid - b.paid || (a.due || 99) - (b.due || 99) };
  const bills = items.filter(i => i.type === "bill").sort(sorters[l.billSort] || sorters.due);
  const spend = items.filter(i => i.type === "spend").sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const moves = goalMoves(m);
  const isNow = m === thisMonth();
  const daysLeft = isNow ? daysIn(m) - today().getDate() + 1 : 0;
  const pot = Math.max(t.income + Math.max(0, t.carry), t.out + t.saved, 1);
  const seg = [[t.bills, "var(--out)"], [t.spend, "var(--spend)"], [t.saved, "var(--save)"], [Math.max(0, t.left), "var(--accent)"]];

  // total card (overlaps the coloured header)
  const total = `<div class="card total">
    <div class="grab"></div>
    <div class="row1"><span class="lbl">Left after bills</span><span class="big ${t.afterBills < 0 ? "bad" : ""}">${money(t.afterBills)}</span></div>
    <div class="stack">${seg.filter(s => s[0] > 0).map(s => `<i style="flex:${s[0] / pot};background:${s[1]}"></i>`).join("")}</div>
    <div class="brk">
      ${t.carry ? `<div class="r"><span class="ic" style="background:var(--card2)">↪️</span><span class="n">Carried over</span><span class="v">${money(t.carry)}</span></div>` : ""}
      <div class="r"><span class="ic" style="background:color-mix(in srgb,var(--accent) 14%,transparent)">💶</span><span class="n">Income</span><span class="v">${money(t.income)}</span></div>
      <div class="r"><span class="ic" style="background:color-mix(in srgb,var(--out) 18%,transparent)">🧾</span><span class="n">Bills</span><span class="v">− ${money(t.bills)}</span></div>
      <div class="r"><span class="ic" style="background:color-mix(in srgb,var(--spend) 20%,transparent)">🛍️</span><span class="n">Spending</span><span class="v">− ${money(t.spend)}</span></div>
      ${t.saved ? `<div class="r"><span class="ic" style="background:color-mix(in srgb,var(--save) 20%,transparent)">🐷</span><span class="n">Into savings</span><span class="v">− ${money(t.saved)}</span></div>` : ""}
      <div class="r"><span class="ic" style="background:var(--card2)">🟰</span><span class="n">Left after everything</span><span class="v ${t.left < 0 ? "bad" : "good"}">${money(t.left)}</span></div>
    </div>
  </div>`;

  const tiles = `<div class="tiles">
    <div class="tile"><div class="k">Still to pay</div><div class="v ${t.unpaid ? "warn" : "good"}">${t.unpaid ? money(t.unpaid) : "All paid ✓"}</div><div class="s">${t.unpaidCount ? `${t.unpaidCount} of ${t.billCount} bills` : t.billCount ? `${t.billCount} bills` : "no bills"}</div></div>
    ${isNow ? `<div class="tile"><div class="k">Safe to spend</div><div class="v">${money(Math.max(0, t.left) / daysLeft)}</div><div class="s">a day · ${daysLeft} day${daysLeft > 1 ? "s" : ""} left</div></div>`
      : `<div class="tile"><div class="k">Bills paid</div><div class="v">${t.billCount - t.unpaidCount} / ${t.billCount}</div><div class="s">this month</div></div>`}
    <div class="tile"><div class="k">Saved this month</div><div class="v">${money(t.saved)}</div><div class="s">${t.income ? Math.round(Math.max(0, t.left + t.saved) / t.income * 100) + "% of income kept" : "&nbsp;"}</div></div>
  </div>`;

  const rings = `<div class="rings">
    <div class="ring">${ring(t.income ? t.out / t.income : 0, "var(--out)")}<div class="k">Going out</div><div class="v">${money(t.out, { round: true })}</div>${chip(change(t.out, prev.out), true)}</div>
    <div class="ring">${ring(t.income ? Math.max(0, t.left) / t.income : 0, "var(--accent)")}<div class="k">Left over</div><div class="v">${money(t.left, { round: true })}</div>${chip(change(t.left, prev.left), false)}</div>
  </div>`;

  // alerts
  const alerts = [];
  if (t.left < 0) alerts.push(`<div class="alert bad">📉 <div>You're planning to spend <b>${money(-t.left)}</b> more than comes in this month.</div></div>`);
  const lims = limitsFor(m), over = lims.filter(x => x.used > x.limit);
  if (over.length) alerts.push(`<div class="alert bad">🚦 <div><b>Over the limit:</b> ${over.map(x => esc(x.c.name)).join(", ")}</div></div>`);

  // upcoming payments (this month)
  const upcoming = isNow ? bills.filter(i => !i.paid && !i.skipped).sort((a, b) => (a.due || 99) - (b.due || 99)) : [];
  const upCard = upcoming.length ? `<div><div class="sec">Upcoming payments<button class="lk" data-act="jump" data-to="billsCard">See all</button></div>
    <div class="card flat">${upcoming.slice(0, 4).map(i => { const c = cat(i.category), late = i.due && i.due < today().getDate();
      return `<div class="item" data-act="edit" data-id="${esc(i.id)}"><div class="emo" style="background:${c.color}1f">${esc(c.emoji)}</div>
        <div class="main"><div class="name">${esc(i.name)}</div><div class="meta">${i.auto ? "Autopay" : "Pay by hand"}</div></div>
        <div class="amt">${money(i.amt)}<span class="sub ${late ? "bad" : ""}">${esc(dueText(i, m))}</span></div></div>`; }).join("")}</div></div>` : "";

  // spending limits
  const healthy = lims.filter(x => x.used <= x.limit * .85).length;
  const limCard = `<div><div class="sec">Spending limits<button class="lk" data-act="limits">${lims.length ? "Manage" : "Set up"}</button></div>
    ${lims.length ? `<div class="card" style="padding-top:8px;padding-bottom:8px">
      <div class="healthy" style="padding:6px 0 10px;border-bottom:1px solid var(--line)"><div><b>Healthy limits now</b><div class="muted small">${healthy === lims.length ? "You're doing great 👍" : "Keep an eye on the ones in orange"}</div></div><span class="n">${healthy}/${lims.length}</span></div>
      ${lims.map(x => limitCard(x, m)).join("")}</div>`
      : `<div class="card"><p class="muted" style="margin:0 0 10px">Give categories like Groceries or Eating out a monthly limit and see how much is left as you go.</p><button class="btn sm" data-act="limits">+ Set a limit</button></div>`}</div>`;

  // categories donut
  const byCat = {};
  for (const i of items) if (!i.skipped && i.type !== "income") byCat[i.category] = (byCat[i.category] || 0) + i.amt;
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const top = catRows.slice(0, 6), rest = sum(catRows.slice(6), r => r[1]);
  const segs = top.map(([id, v]) => ({ v, color: cat(id).color, t: cat(id).name })).concat(rest ? [{ v: rest, color: "#94a3b8", t: "Others" }] : []);
  const catCard = catRows.length ? `<div><div class="sec">Where it goes</div><div class="card"><div class="donutwrap">
    ${donut(segs, money(t.out, { raw: true, round: true }), monthName(m, { month: "short" }))}
    <div class="leg">${top.map(([id, v]) => { const c = cat(id); return `<div class="l"><b style="background:${c.color}"></b><span class="n">${esc(c.emoji)} ${esc(c.name)}</span><span class="v">${money(v, { round: true })}</span></div>`; }).join("")}
      ${rest ? `<div class="l"><b style="background:#94a3b8"></b><span class="n">Others</span><span class="v">${money(rest, { round: true })}</span></div>` : ""}</div>
  </div></div></div>` : "";

  // who added what (shared budgets)
  let whoCard = "";
  if (b?.kind === "shared") {
    const by = {};
    for (const i of items) if (!i.skipped && i.type !== "income" && i.by) by[i.by] = (by[i.by] || 0) + i.amt;
    const rows = Object.entries(by).sort((a, z) => z[1] - a[1]);
    if (rows.length) whoCard = `<div><div class="sec">Added by</div><div class="card flat">${rows.map(([u, v]) =>
      `<div class="item" style="cursor:default">${avatar(u)}<div class="main"><div class="name">${esc(nameOf(u))}</div></div><div class="amt">${money(v)}</div></div>`).join("")}</div></div>`;
  }

  const section = (title, list, type, total, id, extra = "") => `<div id="${id}"><div class="sec"><span>${title} · ${money(total, { round: true })}</span><span>${extra}<button class="lk" data-act="add" data-type="${type}">+ Add</button></span></div>
    <div class="card flat">${list.length ? list.map(i => itemRow(i, m)).join("") : `<div class="empty">Nothing here this month.</div>`}</div></div>`;

  const md = S.months[m] || {};
  return `<div class="grid two">
    <div class="grid">${total}${alerts.join("")}${tiles}${upCard}
      ${section("Bills", bills, "bill", t.bills, "billsCard", bills.length ? `<button class="lk" data-act="sort">${({ due: "By date", amount: "By amount", name: "A–Z", unpaid: "Unpaid first" })[l.billSort] || "By date"}</button>` : "")}
      ${section("Spending", spend, "spend", t.spend, "spendCard")}
    </div>
    <div class="grid">
      ${rings}
      ${limCard}
      ${section("Income", inc, "income", t.income, "incCard")}
      ${moves.length ? `<div><div class="sec"><span>Into savings · ${money(t.saved, { round: true })}</span></div><div class="card flat">${moves.map(d => `<div class="item" data-act="goal" data-id="${esc(d.goal.id)}"><div class="emo" style="background:${d.goal.color || "#8b5cf6"}1f">${esc(d.goal.emoji || "🐷")}</div><div class="main"><div class="name">${esc(d.goal.name)}</div><div class="meta">${esc(new Date(d.d).toLocaleDateString("en-GB", { day: "numeric", month: "short" }))}${b?.kind === "shared" && d.by ? " · by " + esc(whoName(d.by)) : ""}</div></div><div class="amt">${money(num(d.a))}</div></div>`).join("")}</div></div>` : ""}
      ${catCard}${whoCard}
      <div><div class="sec">Notes for ${esc(monthName(m, { month: "long" }))}</div><div class="card"><textarea id="note" placeholder="Anything to remember this month…">${esc(md.note || "")}</textarea></div></div>
    </div>
  </div>`;
}

function renderYear() {
  const y = S.year, ms = Array.from({ length: 12 }, (_, i) => y + "-" + pad(i + 1)), cur = thisMonth();
  const T = ms.map(m => ({ m, ...totals(m) }));
  const P = Array.from({ length: 12 }, (_, i) => totals((y - 1) + "-" + pad(i + 1)));
  const inc = sum(T, t => t.income), out = sum(T, t => t.out), saved = sum(T, t => t.saved);
  const pinc = sum(P, t => t.income), pout = sum(P, t => t.out);
  const past = T.filter(t => t.m <= cur);
  const max = Math.max(...T.map(t => Math.max(t.income, t.out)), 1);
  const W = 720, H = 240, pb = 26, cw = W / 12, bw = cw * .3;
  const bars = T.map((t, i) => {
    const x = i * cw, hi = (t.income / max) * (H - pb - 10), ho = (t.out / max) * (H - pb - 10);
    const fut = t.m > cur ? ' opacity=".4"' : "";
    return `<g class="m" data-act="ymonth" data-m="${t.m}"><title>${monthName(t.m)}: in ${money(t.income, { raw: true })}, out ${money(t.out, { raw: true })}, left ${money(t.left, { raw: true })}</title>
      <rect class="bg" x="${x + 2}" y="0" width="${cw - 4}" height="${H}" rx="10" fill="transparent"/>
      <rect x="${x + cw / 2 - bw - 1.5}" y="${H - pb - hi}" width="${bw}" height="${Math.max(hi, 0)}" rx="${bw / 2}" fill="var(--accent)"${fut}/>
      <rect x="${x + cw / 2 + 1.5}" y="${H - pb - ho}" width="${bw}" height="${Math.max(ho, 0)}" rx="${bw / 2}" fill="var(--out)"${fut}/>
      <text x="${x + cw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${t.m === cur ? "var(--text)" : "var(--muted)"}" font-weight="${t.m === cur ? 800 : 600}">${monthName(t.m, { month: "short" })}</text></g>`;
  }).join("");
  const byCat = {};
  for (const m of ms) for (const i of monthItems(m)) if (!i.skipped && i.type !== "income") byCat[i.category] = (byCat[i.category] || 0) + i.amt;
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const top = catRows.slice(0, 6), rest = sum(catRows.slice(6), r => r[1]);
  const segs = top.map(([id, v]) => ({ v, color: cat(id).color, t: cat(id).name })).concat(rest ? [{ v: rest, color: "#94a3b8", t: "Others" }] : []);
  const best = past.length ? past.reduce((a, b) => b.left > a.left ? b : a) : null;
  const bigBills = {};
  for (const m of ms) for (const i of monthItems(m)) if (!i.skipped && i.type === "bill") { (bigBills[i.id] ||= { name: i.name, c: i.category, v: 0 }).v += i.amt; }
  const topBills = Object.values(bigBills).sort((a, b) => b.v - a.v).slice(0, 6);
  return `<div class="grid">
    <div class="card total"><div class="grab"></div>
      <div class="row1"><span class="lbl">Left over in ${y}</span><span class="big ${inc - out - saved < 0 ? "bad" : ""}">${money(inc - out - saved, { round: true })}</span></div>
      <div class="brk">
        <div class="r"><span class="ic" style="background:color-mix(in srgb,var(--accent) 14%,transparent)">💶</span><span class="n">Income</span><span class="v">${money(inc, { round: true })}</span></div>
        <div class="r"><span class="ic" style="background:color-mix(in srgb,var(--out) 18%,transparent)">🧾</span><span class="n">Bills & spending</span><span class="v">− ${money(out, { round: true })}</span></div>
        ${saved ? `<div class="r"><span class="ic" style="background:color-mix(in srgb,var(--save) 20%,transparent)">🐷</span><span class="n">Into savings</span><span class="v">− ${money(saved, { round: true })}</span></div>` : ""}
        <div class="r"><span class="ic" style="background:var(--card2)">📅</span><span class="n">Average left a month</span><span class="v">${money(past.length ? sum(past, t => t.left) / past.length : 0, { round: true })}</span></div>
      </div></div>
    <div class="rings">
      <div class="ring">${ring(inc ? out / inc : 0, "var(--out)")}<div class="k">Going out</div><div class="v">${money(out, { round: true })}</div>${pout ? chip(change(out, pout), true) + `<div class="muted small">vs ${y - 1}</div>` : ""}</div>
      <div class="ring">${ring(1, "var(--accent)")}<div class="k">Income</div><div class="v">${money(inc, { round: true })}</div>${pinc ? chip(change(inc, pinc), false) + `<div class="muted small">vs ${y - 1}</div>` : ""}</div>
    </div>
    <div><div class="sec">Month by month</div><div class="card">
      <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending per month">${bars}</svg></div>
      <div class="legend muted small" style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px"><span>🟦 Income</span><span>🟧 Bills & spending</span><span>Faded = planned · tap a month</span></div>
      ${best && best.left > 0 ? `<p class="muted small" style="text-align:center;margin:8px 0 0">Best month so far: <b>${monthName(best.m, { month: "long" })}</b> with ${money(best.left, { round: true })} left.</p>` : ""}
    </div></div>
    <div class="grid two">
      <div><div class="sec">By category</div><div class="card">${catRows.length ? `<div class="donutwrap">${donut(segs, money(out, { raw: true, round: true }), String(y))}
        <div class="leg">${top.map(([id, v]) => { const c = cat(id); return `<div class="l"><b style="background:${c.color}"></b><span class="n">${esc(c.emoji)} ${esc(c.name)}</span><span class="v">${money(v, { round: true })}</span></div>`; }).join("")}
        ${rest ? `<div class="l"><b style="background:#94a3b8"></b><span class="n">Others</span><span class="v">${money(rest, { round: true })}</span></div>` : ""}</div></div>` : '<div class="empty">Nothing yet.</div>'}</div></div>
      <div><div class="sec">Biggest bills</div><div class="card">${topBills.length ? topBills.map(b => `<div class="hbar"><span class="n">${esc(cat(b.c).emoji)} ${esc(b.name || cat(b.c).name)}</span><span class="tr"><i style="width:${b.v / topBills[0].v * 100}%;background:${cat(b.c).color}"></i></span><span>${money(b.v, { round: true })}</span></div>`).join("") : '<div class="empty">No bills yet.</div>'}</div></div>
    </div>
  </div>`;
}

function goalSaved(g) { return sum(g.moves || [], d => num(d.a)); }
function renderGoals() {
  const gs = [...S.goals].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const total = sum(gs, goalSaved), target = sum(gs, g => num(g.target));
  return `<div class="grid">
    ${gs.length ? `<div class="card total"><div class="grab"></div><div class="row1"><span class="lbl">Saved in total</span><span class="big">${money(total)}</span></div>
      <div class="eq">${gs.length} goal${gs.length > 1 ? "s" : ""}${target ? ` · ${Math.round(Math.min(1, total / target) * 100)}% of all targets` : ""}</div></div>` : ""}
    ${gs.length ? `<div class="grid two" style="align-items:stretch">${gs.map(g => {
      const s = goalSaved(g), tg = num(g.target), pct = tg ? Math.min(100, s / tg * 100) : 0;
      let plan = "";
      if (tg && s < tg && g.by) {
        const months = mi(g.by) - mi(thisMonth()) + 1;
        plan = months > 0 ? `Put aside <b>${money((tg - s) / months)}</b> a month to reach it by ${esc(monthName(g.by, { month: "short", year: "numeric" }))}` : `<span class="bad">Target date has passed</span>`;
      }
      return `<div class="card goal">
        <div style="display:flex;align-items:center;gap:12px"><span class="emo" style="background:${g.color || "#8b5cf6"}1f">${esc(g.emoji || "🐷")}</span><b style="flex:1;font-size:1.05em">${esc(g.name)}</b><button class="btn sm" data-act="goal" data-id="${esc(g.id)}">Edit</button></div>
        <div class="row" style="margin-top:12px"><span><b style="font-size:1.2em">${money(s)}</b>${tg ? ` <span class="muted">of ${money(tg, { round: true })}</span>` : ""}</span>${tg ? `<span class="muted">${s >= tg ? "🎉 Reached!" : Math.round(pct) + "%"}</span>` : ""}</div>
        ${tg ? `<div class="bar"><i style="width:${pct}%;background:${g.color || "#8b5cf6"}"></i></div>` : ""}
        ${plan ? `<div class="muted small">${plan}</div>` : ""}
        <div class="addrow"><button class="btn sm pri" data-act="gmove" data-id="${esc(g.id)}" data-dir="1">+ Put money in</button><button class="btn sm" data-act="gmove" data-id="${esc(g.id)}" data-dir="-1">− Take out</button></div>
      </div>`; }).join("")}</div>` : `<div class="card welcome"><div class="e">🐷</div><h2 style="margin:6px 0">Saving for something?</h2><p class="muted">A holiday, a new car, an emergency fund… Make a goal, then put money in whenever you can. It shows up in that month's budget too.</p></div>`}
    <div><button class="btn pri" data-act="goal">+ New savings goal</button></div>
  </div>`;
}

/* ---------- sheets ---------- */
function openSheet(html, mount) {
  const sc = $("#scrim");
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  sc.hidden = false; document.body.classList.add("noscroll");
  const sh = sc.firstElementChild;
  mount && mount(sh);
  const f = sh.querySelector("[autofocus]"); if (f && matchMedia("(pointer:fine)").matches) f.focus();
  return sh;
}
function closeSheet() { const sc = $("#scrim"); sc.hidden = true; sc.innerHTML = ""; document.body.classList.remove("noscroll"); }
const head = t => `<h3>${t}<button class="ib x" data-close title="Close">✕</button></h3>`;
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

function catChips(kind, sel) {
  return cats().filter(c => c.kind === kind).map(c => `<button type="button" class="chip2 ${c.id === sel ? "on" : ""}" data-cat="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("");
}

function openEntry(id, type) {
  const e = id ? S.entries.find(x => x.id === id) : null;
  if (id && !e) return;
  const m = S.month, md = S.months[m] || {};
  const f = e ? { ...e } : { type: type || "bill", name: "", amount: "", repeat: type === "spend" ? "once" : "monthly", start: m, until: "", due: "", auto: false, note: "",
    category: (cats().find(c => c.kind === (type === "income" ? "in" : "out") && (type !== "spend" || c.name === "Groceries")) || cats().find(c => c.kind === (type === "income" ? "in" : "out")) || {}).id };
  const repeating = e && e.repeat && e.repeat !== "once";
  openSheet(`
    ${head(e ? "Edit " + TYPES[e.type].toLowerCase() : "Add")}
    <div class="seg" id="tsel">${Object.entries(TYPES).map(([k, v]) => `<button type="button" data-t="${k}" class="${f.type === k ? "on" : ""}">${v}</button>`).join("")}</div>
    <label class="f"><span>Amount</span><input class="amount" id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(e ? String(e.amount).replace(".", ",") : "")}" autofocus></label>
    <label class="f"><span>Name</span><input type="text" id="fName" maxlength="60" placeholder="e.g. Rent, Electricity, Salary" value="${esc(f.name)}"></label>
    <div class="f"><span>Category</span><div class="chips" id="fCats"></div></div>
    <div class="cols">
      <label class="f"><span>How often</span><select id="fRep">${Object.entries(REPEATS).map(([k, [t]]) => `<option value="${k}" ${f.repeat === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label class="f"><span id="fStartL">Month</span><input type="month" id="fStart" value="${esc(f.start)}"></label>
    </div>

    </div>
    <label class="check" id="autoRow"><input type="checkbox" id="fAuto" ${f.auto ? "checked" : ""}> Autopay (direct debit) — ticks itself on the due day</label>
    <label class="f"><span>Note (optional)</span><input type="text" id="fNote" maxlength="120" placeholder="e.g. account number, who pays it" value="${esc(f.note || "")}"></label>
    ${repeating ? `<h4>Just for ${esc(monthName(m))}</h4><div class="box">
      <label class="f" style="margin-bottom:8px"><span>Different amount this month only</span><input type="text" id="fOver" inputmode="decimal" placeholder="usual: ${esc(money(num(e.amount), { raw: true }))}" value="${md.amounts?.[e.id] != null ? esc(String(md.amounts[e.id]).replace(".", ",")) : ""}"></label>
      <label class="check" style="margin:0"><input type="checkbox" id="fSkip" ${md.skip?.[e.id] ? "checked" : ""}> Skip it this month</label></div>` : ""}
    <div class="actions"><button class="btn pri" id="save">Save</button></div>
    ${e ? `<div class="actions">${repeating && m > e.start ? `<button class="btn" id="stop">Stop from ${esc(monthName(m, { month: "short" }))} on</button>` : ""}<button class="btn dang" id="del">Delete${repeating ? " from every month" : ""}</button></div>` : ""}
  `, sh => {
    const sync = () => {
      sh.querySelectorAll("#tsel button").forEach(b => b.classList.toggle("on", b.dataset.t === f.type));
      const kind = f.type === "income" ? "in" : "out";
      if (!cats().some(c => c.id === f.category && c.kind === kind)) f.category = (cats().find(c => c.kind === kind) || {}).id;
      sh.querySelector("#fCats").innerHTML = catChips(kind, f.category);
      sh.querySelector("#fDue").closest("label").style.display = f.type === "bill" ? "" : "none";
      sh.querySelector("#autoRow").style.display = f.type === "bill" ? "" : "none";
      const rep = sh.querySelector("#fRep").value !== "once";
      sh.querySelector("#untilF").style.display = rep ? "" : "none";
      sh.querySelector("#billRow").style.display = f.type === "bill" || rep ? "" : "none";
      sh.querySelector("#fStartL").textContent = rep ? "Starting from" : "Month";
    };
    sync();
    sh.querySelector("#tsel").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; f.type = b.dataset.t;
      if (!e) sh.querySelector("#fRep").value = f.type === "spend" ? "once" : "monthly"; sync(); };
    sh.querySelector("#fRep").onchange = sync;
    sh.querySelector("#fCats").onclick = ev => { const b = ev.target.closest("[data-cat]"); if (!b) return; f.category = b.dataset.cat; sync(); };
    sh.querySelector("#save").onclick = () => {
      const amount = num(sh.querySelector("#fAmt").value);
      if (!amount) { toast("Enter an amount"); sh.querySelector("#fAmt").focus(); return; }
      const repeat = sh.querySelector("#fRep").value;
      const start = sh.querySelector("#fStart").value || m;
      const until = repeat === "once" ? null : (sh.querySelector("#fUntil").value || null);
      if (until && until < start) { toast("The last month is before the start"); return; }
      const due = f.type === "bill" ? Math.min(31, Math.max(1, parseInt(sh.querySelector("#fDue").value) || 0)) || null : null;
      const data = { type: f.type, name: sh.querySelector("#fName").value.trim() || cat(f.category).name, amount, category: f.category || null,
        repeat, start, until, due, auto: f.type === "bill" && sh.querySelector("#fAuto").checked, note: sh.querySelector("#fNote").value.trim(),
        by: e?.by || S.user.uid, createdAt: e?.createdAt || Date.now(), updatedAt: Date.now() };
      w(Store.saveItem(S.bid, "entries", e?.id || null, data).done);
      if (repeating) {
        const ov = sh.querySelector("#fOver").value.trim();
        w(Store.setMonth(S.bid, m, { amounts: { [e.id]: ov === "" ? null : num(ov) }, skip: { [e.id]: sh.querySelector("#fSkip").checked ? true : null } }));
      }
      closeSheet();
      if (!e && !occurs(data, S.month)) toast("Added to " + monthName(start));
      else toast(e ? "Saved" : (data.repeat !== "once" ? `Added — repeats ${REPEATS[data.repeat][0].toLowerCase()}` : "Added"));
    };
    const st = sh.querySelector("#stop");
    if (st) st.onclick = () => { if (!confirm(`Stop "${e.name}" from ${monthName(m)} on? Earlier months stay as they are.`)) return;
      w(Store.saveItem(S.bid, "entries", e.id, { ...strip(e), until: mk(mi(m) - 1), updatedAt: Date.now() }).done); closeSheet(); toast("Stopped"); };
    const dl = sh.querySelector("#del");
    if (dl) dl.onclick = () => { if (!confirm(repeating ? `Delete "${e.name}" from every month, including past ones?\n\nTip: use "Stop from … on" to keep the history.` : `Delete "${e.name}"?`)) return;
      w(Store.deleteItem(S.bid, "entries", e.id)); closeSheet(); toast("Deleted"); };
  });
}

  const b = B(); let list = JSON.parse(JSON.stringify(cats()));
  const draw = sh => {
    const part = kind => list.map((c, i) => c.kind !== kind ? "" : `<div class="catrow"><input class="inp" data-i="${i}" data-k="emoji" maxlength="4" value="${esc(c.emoji)}"><input class="inp" data-i="${i}" data-k="name" maxlength="30" value="${esc(c.name)}"><button class="ib" data-del="${i}" title="Remove">✕</button></div>`).join("");
    sh.querySelector("#cl").innerHTML = `<h4 style="margin-top:0">Money in</h4>${part("in")}<button class="btn sm" data-addk="in">+ Add</button><h4>Money out</h4>${part("out")}<button class="btn sm" data-addk="out">+ Add</button>`;
  };
  openSheet(`${head("Categories")}<p class="muted small" style="margin-top:-6px">Tap an icon to change it (any emoji works). Changes apply to “${esc(b.name)}”.</p><div id="cl"></div>
    <div class="actions"><button class="btn pri" id="cS">Save categories</button><button class="btn" id="cR">Reset to defaults</button></div>`, sh => {
    draw(sh);
    sh.querySelector("#cl").addEventListener("input", ev => { const t = ev.target; if (t.dataset.i != null) list[t.dataset.i][t.dataset.k] = t.value; });
    sh.querySelector("#cl").addEventListener("click", ev => {
      const d = ev.target.closest("[data-del]"), a = ev.target.closest("[data-addk]");
      if (d) { const c = list[d.dataset.del]; const used = S.entries.filter(e => e.category === c.id).length;
        if (used && !confirm(`${used} item${used > 1 ? "s use" : " uses"} “${c.name}”. They'll show as “Other”. Remove it?`)) return; list.splice(d.dataset.del, 1); draw(sh); }
      if (a) { list.push({ id: "c" + rid(), kind: a.dataset.addk, emoji: "🏷️", name: "", color: PALETTE[list.length % PALETTE.length] }); draw(sh); sh.querySelector(`#cl [data-i="${list.length - 1}"][data-k=name]`).focus(); }
    });
    sh.querySelector("#cS").onclick = () => { list = list.filter(c => c.name.trim()).map(c => ({ ...c, name: c.name.trim(), emoji: c.emoji.trim() || "🏷️" }));
      w(Store.replaceBudgetField(b.id, "categories", list)); closeSheet(); toast("Categories saved"); };
    sh.querySelector("#cR").onclick = () => { if (confirm("Put back the original categories?")) { list = JSON.parse(JSON.stringify(DEFAULT_CATS)); draw(sh); } };
  });
}

/* ---------- backup ---------- */
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileSafe = s => String(s).replace(/[^\w-]+/g, "-").replace(/^-|-$/g, "") || "budget";
function exportJSON() {
  const b = B();
  const data = { app: "budget", format: 1, exported: new Date().toISOString(), budget: { name: b.name, emoji: b.emoji, currency: b.currency, numStyle: b.numStyle, carry: !!b.carry, categories: cats(), limits: b.limits || {} },
    entries: S.entries, months: S.months, goals: S.goals };
  download(`budget-${fileSafe(b.name)}-${isoDay(today())}.json`, JSON.stringify(data, null, 2), "application/json");
  toast("Backup downloaded — keep it somewhere safe");
}
function exportCSV() {
  const rows = [["Month", "Type", "Name", "Category", "Amount", "Paid", "Note"]];
  const q = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  for (let i = 1; i <= 12; i++) { const m = S.year + "-" + pad(i);
    for (const it of monthItems(m)) if (!it.skipped) rows.push([m, TYPES[it.type], it.name, cat(it.category).name, it.amt.toFixed(2).replace(".", ","), it.type === "bill" ? (it.paid ? "yes" : "no") : "", it.note || ""]);
    for (const d of goalMoves(m)) rows.push([m, "Savings", d.goal.name, "", num(d.a).toFixed(2).replace(".", ","), "", ""]); }
  download(`budget-${fileSafe(B().name)}-${S.year}.csv`, "﻿" + rows.map(r => r.map(q).join(";")).join("\r\n"), "text/csv");
}
async function importJSON(ev) {
  const file = ev.target.files[0]; ev.target.value = ""; if (!file) return;
  let d; try { d = JSON.parse(await file.text()); } catch { toast("That file isn't a budget backup"); return; }
  if (d.app !== "budget" || !Array.isArray(d.entries)) { toast("That file isn't a budget backup"); return; }
  if (!confirm(`Restore ${d.entries.length} items and ${(d.goals || []).length} goals from "${d.budget?.name || "backup"}" into "${B().name}"?\n\nItems with the same id are replaced; nothing else is deleted.`)) return;
  for (const e of d.entries) if (e && e.id && e.start) w(Store.saveItem(S.bid, "entries", String(e.id), strip(e)).done);
  for (const g of d.goals || []) if (g && g.id) w(Store.saveItem(S.bid, "goals", String(g.id), strip(g)).done);
  for (const [m, md] of Object.entries(d.months || {})) if (/^\d{4}-\d{2}$/.test(m) && md) w(Store.setMonth(S.bid, m, md));
  if (d.budget?.categories?.length) w(Store.replaceBudgetField(S.bid, "categories", d.budget.categories));
  if (d.budget?.limits && typeof d.budget.limits === "object") w(Store.replaceBudgetField(S.bid, "limits", d.budget.limits));
  closeSheet(); toast("Backup restored");
}

/* ---------- data flow ---------- */
function selectBudget(id) {
  if (S.bid === id && unsubBudget) return;
  unsubBudget && unsubBudget();
  S.bid = id; S.entries = []; S.months = {}; S.goals = []; S.loaded = false; S.dataStamp = 0; carryCache.clear();
  try { localStorage.setItem("budget.last." + S.user.uid, id); } catch {}
  let got = 0;
  const mark = () => { S.dataStamp++; carryCache.clear(); if (++got >= 3) S.loaded = true; render(); };
  // a brand-new budget may not be on the server yet, so the rules refuse at first: try again a few times
  let tries = 0, stopped = false;
  const watch = () => {
    let failed = false;
    const u = Store.watchBudget(id, {
      entries: l => { S.entries = l; mark(); },
      months: o => { S.months = o; mark(); },
      goals: l => { S.goals = l; mark(); },
    }, e => {
      if (failed || stopped) return; failed = true;
      if (e && e.code === "permission-denied" && tries++ < 6 && S.budgets.some(b => b.id === id)) {
        u && u(); setTimeout(() => { if (!stopped && S.bid === id) cur = watch(); }, 1500 * tries);
      } else err(e);
    });
    return u;
  };
  let cur = watch();
  unsubBudget = () => { stopped = true; cur && cur(); };
  render();
}
function err(e) { console.error(e); if (e && e.code === "permission-denied") toast("No access to this budget"); else toast("Sync problem: " + (e.code || e.message || e)); }

function start(user) {
  S.user = user; S.ready = true; S.loaded = false;
  let firstProfile = true;
  unsub.push(Store.watchProfile(p => {
    S.profile = p || {};
    if (firstProfile) { firstProfile = false; S.view = look().start; S.hide = !!look().hideOnStart; }
    applyLook(); render();
  }, err));
  unsub.push(Store.watchBudgets((list, meta) => {
    S.budgets = list;
    const mine = list.find(b => b.kind === "personal" && b.owner === user.uid);
    if (!mine && !meta?.fromCache && !creatingPersonal) {
      creatingPersonal = "pending";
      const r = Store.createBudget({ name: "My budget", emoji: "💰", kind: "personal", currency: "EUR", numStyle: "dot", categories: DEFAULT_CATS, memberNames: { [user.uid]: myName() } });
      w(r.done);
      S.bid = null;
      r.done.then(() => { creatingPersonal = true; selectBudget(r.id); }, () => { creatingPersonal = false; });
      return;
    }
    if (creatingPersonal === "pending") { render(); return; }   // wait until the server has the new budget
    if (!S.bid || !list.some(b => b.id === S.bid)) {
      let last = null; try { last = localStorage.getItem("budget.last." + user.uid); } catch {}
      const pick = list.find(b => b.id === last) || mine || list[0];
      if (pick) selectBudget(pick.id);
    }
    render();
  }, err));
}
function signOut() {
  unsub.forEach(f => f()); unsub = []; unsubBudget && unsubBudget(); unsubBudget = null;
  Object.assign(S, { user: null, profile: {}, budgets: [], bid: null, entries: [], months: {}, goals: [], ready: false, loaded: false });
  creatingPersonal = false;
  window.Cloud.signOut();
}

/* ---------- login ---------- */
function showLogin(msg) {
  S.ready = false;
  $("#app").innerHTML = `<div class="loginbg"><div class="login">
    <img class="logo" src="icons/icon.svg" alt="">
    <h1 style="margin:0 0 4px;font-weight:800">Budget</h1>
    <p class="muted" style="margin:0 0 20px">Private budgeting. Sign in with the login you were given.</p>
    <form id="lf">
      <label class="f"><span>Email</span><input type="email" id="le" autocomplete="username" required></label>
      <label class="f"><span>Password</span><input type="password" id="lp" autocomplete="current-password" required></label>
      <div class="err" id="lerr">${esc(msg || "")}</div>
      <button class="btn pri wide" id="lb">Sign in</button>
    </form>
    <p style="text-align:center;margin-bottom:0"><button class="btn sm" id="lr" style="border:none;background:none;color:var(--muted)">Forgot password?</button></p>
  </div></div>`;
  $("#lf").onsubmit = async ev => {
    ev.preventDefault(); $("#lb").disabled = true; $("#lerr").textContent = "";
    try { await window.Cloud.signIn($("#le").value.trim(), $("#lp").value); }
    catch (e) { $("#lerr").textContent = /invalid|wrong|not-found|credential/.test(e.code || "") ? "Wrong email or password." : /too-many/.test(e.code || "") ? "Too many tries — wait a few minutes." : /network/.test(e.code || "") ? "No internet connection." : "Couldn't sign in (" + (e.code || e) + ")"; $("#lb").disabled = false; }
  };
  $("#lr").onclick = async () => {
    const em = $("#le").value.trim(); if (!em) { $("#lerr").textContent = "Type your email first."; return; }
    try { await window.Cloud.resetPassword(em); } catch {}
    $("#lerr").textContent = "If that email has a login, a reset link is on its way.";
  };
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  if (ev.target.closest("[data-close]")) { closeSheet(); return; }
  if (ev.target.id === "scrim") { closeSheet(); return; }
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "pay") {
    ev.stopPropagation();
    const it = monthItems(S.month).find(i => i.id === t.dataset.id); if (!it) return;
    w(Store.setMonth(S.bid, S.month, { paid: { [it.id]: !it.paid } }));
    if (!it.paid) toast(`${it.name} paid ✓`);
    return;
  }
  ({
    tab: () => { S.view = t.dataset.v; if (S.view === "year") S.year = +S.month.slice(0, 4); _render(); window.scrollTo(0, 0); },
    prev: () => { if (S.view === "year") S.year--; else S.month = mk(mi(S.month) - 1); render(); },
    next: () => { if (S.view === "year") S.year++; else S.month = mk(mi(S.month) + 1); render(); },
    now: () => { S.month = thisMonth(); S.year = today().getFullYear(); render(); },
    ymonth: () => { S.month = t.dataset.m; S.view = "month"; render(); window.scrollTo(0, 0); },
    add: () => openEntry(null, t.dataset.type),
    quick: openQuick,
    edit: () => openEntry(t.dataset.id),
    hide: () => { S.hide = !S.hide; render(); },
    settings: openSettings,
    budgets: openBudgets,
    limits: openLimits,
    jump: () => document.getElementById(t.dataset.to)?.scrollIntoView({ behavior: "smooth", block: "start" }),
    goal: () => openGoal(t.dataset.id),
    gmove: () => openMove(t.dataset.id, +t.dataset.dir),
    sort: () => { const order = ["due", "unpaid", "amount", "name"]; const n = order[(order.indexOf(look().billSort) + 1) % order.length];
      S.profile.look = { ...look(), billSort: n }; render(); w(Store.saveProfile({ look: { billSort: n } })); },
  })[a]?.();
});
let noteT;
document.addEventListener("input", ev => {
  if (ev.target.id !== "note") return;
  const v = ev.target.value, m = S.month, bid = S.bid;
  clearTimeout(noteT); noteT = setTimeout(() => w(Store.setMonth(bid, m, { note: v || null })), 600);
});
// don't let a re-render wipe the note while typing
const _render = render;
render = function () { const a = document.activeElement; if (a && a.id === "note" && S.view === "month") return; _render(); };
document.addEventListener("focusout", ev => { if (ev.target.id === "note") setTimeout(_render, 0); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#scrim").hidden) closeSheet();
  if (ev.key === "Enter" && !$("#scrim").hidden && ev.target.matches(".sheet input:not([type=checkbox])")) { const s = $("#scrim").querySelector(".actions .btn.pri"); if (s) { ev.preventDefault(); s.click(); } }
});
setInterval(() => { if (S.ready) render(); }, 60 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.ready) render(); });

/* ---------- boot ---------- */
if (LOCAL) { Store = makeLocalStore(); start({ uid: "local", email: "" }); }
else {
  $("#app").innerHTML = `<div class="loginbg"><div class="login muted">Loading…</div></div>`;
  window.addEventListener("cloud-auth", e => {
    if (e.detail) { if (S.user?.uid === e.detail.uid) return; Store = window.Cloud; start(e.detail); }
    else { if (S.ready) signOut(); showLogin(); }
  });
  window.addEventListener("cloud-failed", () => { $("#app").innerHTML = `<div class="loginbg"><div class="login"><h2>Can't reach the budget server</h2><p class="muted">Check the internet connection and try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div></div>`; });
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
