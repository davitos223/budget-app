name: Budget checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  demo:
    name: Version and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-version.mjs
      - run: BROWSER="$(command -v google-chrome)" node tools/test.mjs

  rules:
    name: Shared and private budget permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm test
